<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : interprétation par chemin et questions</title>
<link href="../vendor/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
body{margin:0;background:var(--bg-page);color:var(--text-strong);font-family:"Segoe UI",Roboto,system-ui,sans-serif;padding:0 16px 6rem}
.mq-page{max-width:1000px;margin:0 auto;padding-top:1rem}
.mq-page.tel{max-width:390px}
.mq-regl{position:sticky;top:0;z-index:600;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.7rem .9rem;margin:.6rem auto 1rem;max-width:1100px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mq-regl h2{font-size:1rem;margin:0 0 .4rem;display:flex;align-items:center;gap:.5rem}
.mq-regl h2 button{margin-left:auto}
.mq-regl .grp{margin:.45rem 0}
.mq-regl .grp>b{display:block;font-size:.85rem;margin-bottom:.25rem}
.mq-regl .boutons{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.mq-regl .boutons button{font-size:.8rem;border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);padding:.25rem .65rem;min-height:36px}
.mq-regl .boutons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg-subtle);font-weight:700}
.mq-rouvrir{position:fixed;top:8px;right:8px;z-index:610;display:none}
.mq-bandeau{background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:.85rem;margin:.4rem 0 .8rem}
.mq-bandeau p{margin:.15rem 0}
.titre-page{font-size:1.9rem;font-weight:800;margin:.2rem 0 .2rem;text-align:center}
.sous-titre{text-align:center;color:var(--text-muted);font-weight:700;margin-bottom:.8rem}
.mq-etapes{display:grid;gap:.6rem;margin:.6rem 0}
.mq-etape{display:grid;grid-template-columns:2.2rem 1fr;gap:.7rem;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:.7rem .9rem}
.mq-num{width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.mq-qui{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:.08rem .55rem;border:2px solid var(--border-strong);margin-right:.35rem}
.mq-qui.assistant{border-color:var(--accent)}
.mq-qui.code{border-color:var(--success)}
.mq-qui.personne{border-color:var(--warning)}
.mq-ligne-chemin{display:grid;grid-template-columns:1fr auto;gap:.5rem .8rem;align-items:center;border-top:1px solid var(--border);padding:.7rem 0}
.mq-ligne-chemin:first-of-type{border-top:0}
.mq-question{border-top:1px solid var(--border);padding:.8rem 0}
.mq-question:first-of-type{border-top:0}
.mq-question .qt{font-weight:700;margin:0 0 .15rem}
.mq-tag{display:inline-block;font-size:.78rem;border:1px solid var(--border-strong);border-radius:999px;padding:.05rem .55rem;margin:0 .3rem .3rem 0;color:var(--text-muted);background:var(--bg-subtle)}
.mq-demande{background:var(--bg-subtle);border:1px dashed var(--border-strong);border-radius:10px;padding:.7rem .9rem;font-family:Consolas,monospace;font-size:.82rem;white-space:pre-wrap}
.mq-decision{border-left:4px solid var(--accent);background:var(--bg-card);border-radius:8px;padding:.7rem .9rem;margin:.7rem 0;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.mq-decision h3{font-size:1.05rem;font-weight:800;margin:0 0 .3rem}
.mq-decision .reco{font-weight:700}
.mq-barre{display:flex;justify-content:space-between;margin-top:1rem}
</style>
</head>
<body>
<button type="button" class="btn btn-outline-primary btn-sm mq-rouvrir" id="rouvrir"><i class="bi bi-sliders" aria-hidden="true"></i> Réglages</button>

<div class="mq-regl" id="regl">
  <h2><i class="bi bi-sliders" aria-hidden="true"></i> Réglages de la maquette <button type="button" class="btn btn-outline-secondary btn-sm" id="fermer" aria-label="Fermer les réglages"><i class="bi bi-x-lg" aria-hidden="true"></i></button></h2>
  <div class="grp"><b>Écran</b><div class="boutons" id="g-ecran"></div></div>
  <div class="grp"><b>Situation de la personne</b><div class="boutons" id="g-cas"></div></div>
  <div class="grp" id="g-p1-grp"><b>Interprétation du chemin 1 (écran 1)</b><div class="boutons" id="g-p1"></div></div>
  <div class="grp"><b>Présentation des questions (écran 4)</b><div class="boutons" id="g-mode"></div></div>
  <div class="grp"><b>Réponses aux questions</b><div class="boutons" id="g-rep"></div></div>
  <div class="grp"><b>Affichage</b><div class="boutons" id="g-aff"></div></div>
</div>

<div class="mq-page" id="page"></div>

<script>
/* ---------- Données d'exemple (profil fictif : vingt ans d'entrepôt, CAP ou BEP) ---------- */
var CHEMINS = {
  1: { nom: 'Chercher un métier', court: 'Chemin 1', icone: 'bi-search' },
  2: { nom: 'Partir de vos envies', court: 'Chemin 2', icone: 'bi-stars' },
  3: { nom: 'Le questionnaire de préférences', court: 'Chemin 3', icone: 'bi-hexagon' }
};
/* Chaque question vient de l'assistant : un sujet (choisi dans une liste fermée par le prompt), le texte, des réponses proposées. */
var Q = [
  { chemin: 1, sujet: 'physique', texte: 'Pour les tâches physiques, qu’est-ce qui vous irait le mieux ?', options: ['Surtout assis', 'Alterner assis et debout', 'Debout, sans porter de charge', 'Porter de petites charges', 'Peu importe'] },
  { chemin: 1, sujet: 'horaires', texte: 'Quels horaires pourriez-vous envisager ?', options: ['Journée seulement', 'Tôt le matin', 'Fin de journée', 'Week-end possible', 'Peu importe'], multi: true },
  { chemin: 1, sujet: 'secteur', texte: 'Souhaitez-vous rester dans le même secteur, l’entrepôt et la logistique ?', options: ['Oui, rester dans mon secteur', 'Ouvert à d’autres secteurs', 'Je ne sais pas encore'] },
  { chemin: 1, sujet: 'plaisir', texte: 'Dans vos dernières expériences, qu’est-ce que vous faisiez avec le plus de plaisir ?', options: ['Ranger et organiser', 'Suivre les stocks', 'Travailler en équipe', 'Accueillir ou renseigner', 'Réparer ou installer'], multi: true },
  { chemin: 1, sujet: 'essayer', texte: 'Qu’est-ce qui vous aiderait à vous décider pour un métier ?', options: ['Rencontrer un professionnel', 'Faire un stage d’observation', 'Lire une fiche détaillée', 'En parler avec mon conseiller'], multi: true },

  { chemin: 2, sujet: 'horaires', texte: 'Quels horaires vous conviendraient ?', options: ['Journée seulement', 'Tôt le matin', 'Fin de journée', 'Week-end possible', 'Peu importe'], multi: true },
  { chemin: 2, sujet: 'contact', texte: 'Voir du monde pendant le travail, pour vous, c’est :', options: ['Important', 'Plutôt pas', 'Peu importe'] },
  { chemin: 2, sujet: 'collectif', texte: 'Vous préférez travailler plutôt :', options: ['En équipe', 'Seul, avec des points réguliers', 'Un peu des deux'] },
  { chemin: 2, sujet: 'responsabilite', texte: 'Quelle place voulez-vous donner aux responsabilités ?', options: ['Encadrer une équipe', 'Décider sur mon poste', 'Suivre des consignes claires', 'Je ne sais pas encore'] },
  { chemin: 2, sujet: 'secteur', texte: 'Y a-t-il un secteur à retrouver, ou à éviter ?', options: ['Retrouver mon secteur', 'En éviter un (à écrire)', 'Ouvert à tout'] },

  { chemin: 3, sujet: 'plaisir', texte: 'Dans la vie de tous les jours, qu’est-ce que vous faites avec le plus de plaisir ?', options: ['Bricoler', 'Cuisiner', 'Lire ou écrire', 'Aider les autres', 'Jardin, nature', 'Sport'], multi: true },
  { chemin: 3, sujet: 'mobilite', texte: 'Comment pouvez-vous vous rendre sur un lieu de travail ?', options: ['Voiture', 'Transports en commun', 'Vélo ou à pied', 'Je peux déménager'], multi: true },
  { chemin: 3, sujet: 'rythme', texte: 'Quel rythme de travail vous irait ?', options: ['Régulier, mêmes tâches', 'Varié', 'Avec des pics d’activité', 'Peu importe'] },
  { chemin: 3, sujet: 'essayer', texte: 'Qu’est-ce qui vous aiderait à vous décider ?', options: ['Rencontrer un professionnel', 'Faire un stage d’observation', 'Voir une vidéo du métier', 'En parler avec mon conseiller'], multi: true },
  { chemin: 3, sujet: 'cadre', texte: 'Quel cadre de travail vous attire le plus ?', options: ['Un lieu calme', 'Un lieu animé', 'En extérieur', 'Peu importe'] }
];
var CAS = {
  un: { nom: 'Un chemin fait et interprété', faits: [1], interpretes: [1] },
  trois1: { nom: 'Trois chemins faits, une seule interprétation', faits: [1, 2, 3], interpretes: [1] },
  trois3: { nom: 'Trois chemins faits et interprétés', faits: [1, 2, 3], interpretes: [1, 2, 3] }
};
var ECRANS = [
  ['0', 'Le parcours'], ['1', 'Fin du chemin'], ['2', 'Mon interprétation'], ['3', 'Ma synthèse'], ['4', 'Mes questions'], ['5', 'Ce qui part'], ['6', 'À décider']
];

/* ---------- État ---------- */
var E = { ecran: '0', cas: 'trois3', mode: 'une', qi: 0, p1: 'afaire', coches: { 1: true, 2: true, 3: true }, rep: {}, libre: {}, tel: false, sombre: false, ouvert: {} };

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function nomsChemins(cs) { return (cs.length > 1 ? 'chemins ' : 'chemin ') + liste(cs.map(String)); }
function liste(a) { return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1]; }

/* ---------- Le code regroupe les questions qui portent sur le même sujet ---------- */
function questionsDes(chemins) {
  var map = {}, ordre = [], brut = 0;
  chemins.forEach(function (c) {
    Q.filter(function (q) { return q.chemin === c; }).forEach(function (q) {
      brut++;
      if (map[q.sujet]) { map[q.sujet].chemins.push(c); } else { map[q.sujet] = { chemin: q.chemin, sujet: q.sujet, texte: q.texte, options: q.options, multi: q.multi, chemins: [c] }; ordre.push(q.sujet); }
    });
  });
  var uniques = ordre.map(function (s) { return map[s]; });
  return { brut: brut, uniques: uniques, doublons: brut - uniques.length };
}
function cheminsActifs() {
  var cas = CAS[E.cas];
  return cas.interpretes.filter(function (c) { return E.coches[c]; });
}
function nbRepondues(uniques) {
  return uniques.filter(function (q) { return (E.rep[q.sujet] && E.rep[q.sujet].length) || (E.libre[q.sujet] && E.libre[q.sujet].trim()); }).length;
}

/* ---------- Écrans ---------- */
function enTete(sous) {
  return '<h1 class="titre-page"><i class="bi bi-compass" aria-hidden="true"></i> Explorer les métiers</h1><p class="sous-titre">' + sous + '</p>';
}
function bandeau(lignes) { return '<div class="mq-bandeau">' + lignes.map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>'; }
function encart(icone, html, warn) { return '<div class="cml-encart' + (warn ? ' warn' : '') + '"><i class="bi ' + icone + '" aria-hidden="true"></i><p>' + html + '</p></div>'; }
function pastille(fait, t) { return '<span class="cml-etat ' + (fait ? 'fait' : 'afaire') + '">' + (fait ? t : 'Pas encore fait') + '</span>'; }

function ecran0() {
  var etapes = [
    ['assistant', 'Après un chemin, la personne demande l’interprétation de ce chemin.', 'Elle voit un bouton « Préparer ma demande à l’assistant » à la fin du chemin. Un seul chemin fait suffit.'],
    ['code', 'L’application prépare la demande : les choix de ce chemin, le parcours s’il est ajouté. Chaque chemin a son propre prompt.', 'La personne relit la demande, la copie, la colle chez l’assistant de son choix (fenêtre commune, rien de nouveau).'],
    ['assistant', 'L’assistant répond UN message avec deux parties : l’interprétation, puis cinq questions, chacune avec des réponses proposées.', 'La personne colle la réponse dans l’application.'],
    ['code', 'L’application affiche seulement l’interprétation. Les cinq questions sont gardées de côté, sans être montrées.', 'La personne lit son interprétation. Une phrase lui dit que des questions viendront au moment de la synthèse.'],
    ['personne', 'Plus tard, dans « Ma synthèse », la personne coche les chemins à prendre en compte. Les questions des chemins cochés apparaissent. Les questions qui se recoupent ne sont posées qu’une fois.', 'La personne répond en cliquant, ou en écrivant avec ses mots, ou passe.'],
    ['assistant', 'Les réponses partent avec la demande de la synthèse, à côté des données brutes (jamais le texte des interprétations). L’assistant les lit pour moins deviner.', 'La personne relit la demande avant de la copier, comme aujourd’hui.']
  ];
  var lib = { assistant: 'Assistant', code: 'Application', personne: 'Personne' };
  return enTete('Le parcours, pas à pas') + bandeau(['<b>Qui fait quoi.</b> <span class="mq-qui assistant">Assistant</span> écrit les textes et les questions. <span class="mq-qui code">Application</span> prépare, enregistre, affiche, regroupe les doublons. <span class="mq-qui personne">Personne</span> lit, choisit, répond.', 'Six étapes. Les écrans 1 à 6 de cette maquette montrent ce que la personne voit.']) +
    '<div class="mq-etapes">' + etapes.map(function (e, i) {
      return '<div class="mq-etape"><div class="mq-num">' + (i + 1) + '</div><div><p class="mb-1"><span class="mq-qui ' + e[0] + '">' + lib[e[0]] + '</span>' + e[1] + '</p><p class="cml-note mb-0"><i class="bi bi-eye" aria-hidden="true"></i> ' + e[2] + '</p></div></div>';
    }).join('') + '</div>' +
    encart('bi-info-circle', '<b>Trois prompts, un par chemin.</b> Les données des trois chemins n’ont pas la même forme (compétences et niveau, envies, pourcentages de lettres). Les trois prompts partagent seulement le ton, les règles de prudence et le format de réponse : une interprétation, puis cinq questions. L’application lit donc les trois réponses de la même façon.');
}

function ecran1() {
  var recu = E.p1 === 'recu';
  var h = enTete('Fin du chemin « Chercher un métier »') + bandeau(['<b>Écran d’avant :</b> la page de résultats du chemin 1, inchangée. <b>Nouveau :</b> le bloc ci-dessous, placé en bas de la page, avant « Et maintenant ? ».', 'Même présentation que le bloc « Faire lire ma synthèse » de Ma synthèse (une seule source de vérité).']);
  h += '<div class="cml-bloc"><h2><i class="bi bi-list-check" aria-hidden="true"></i> Mes résultats</h2><p class="cml-note mb-0">(la liste des métiers et « Comment mes choix ont été lus » restent comme aujourd’hui)</p></div>';
  h += '<div class="cml-bloc cml-bloc-synthese"><h2><i class="bi bi-chat-square-quote" aria-hidden="true"></i> Faire interpréter ce passage par l’assistant en ligne ' + pastille(recu, 'Interprétation reçue') + '</h2>' +
    '<p>L’assistant lit les choix que vous avez faits ici, et votre parcours si vous l’avez ajouté. Il vous propose une interprétation de <b>ce passage seulement</b> : ce que vos choix disent, ce qu’ils ne peuvent pas dire, quelques métiers à regarder de plus près. Ce sont des <b>pistes de réflexion</b>, pas une note, pas un diagnostic, pas une solution.</p>' +
    '<p class="cml-note">Un seul passage fait suffit. Vous relisez la demande avant qu’elle parte.</p>' +
    '<div class="boutons-ligne">' + (recu ? '<button type="button" class="btn btn-primary" style="min-height:46px" data-go="2"><i class="bi bi-chat-square-quote" aria-hidden="true"></i> Voir mon interprétation</button><button type="button" class="btn btn-outline-primary" style="min-height:46px" data-alerte="Dans l’application : ouvre la demande, comme « Refaire une lecture ». Les questions et les réponses de ce chemin sont alors remises à zéro."><i class="bi bi-send" aria-hidden="true"></i> Refaire l’interprétation</button>' : '<button type="button" class="btn btn-primary" style="min-height:46px" data-alerte="Dans l’application : ouvre la fenêtre commune (copier la demande, choisir l’assistant, coller la réponse). Ensuite la personne arrive sur l’écran 2."><i class="bi bi-send" aria-hidden="true"></i> Préparer ma demande à l’assistant</button>') + '</div></div>';
  h += '<div id="alerte"></div>';
  return h;
}

function ecran2() {
  var cas = CAS[E.cas];
  var h = enTete('Mon interprétation : Chercher un métier') + bandeau(['<b>Écran d’avant :</b> la fenêtre de collage. <b>Écran d’après :</b> la synthèse ou le chemin.', 'Les <b>cinq questions ne sont pas montrées ici</b> : une phrase prévient seulement qu’elles viendront. Le texte d’exemple est fictif.']);
  h += '<p class="cml-note">Interprétation de l’assistant en ligne, reçue le 22 novembre 2026. Elle porte seulement sur le passage « Chercher un métier ».</p>' +
    encart('bi-info-circle', 'Ce sont des pistes de réflexion, pas une note, pas un diagnostic, pas une solution. Relisez-les avec une personne qui vous accompagne.', true);
  h += '<div class="cml-bloc"><h2><i class="bi bi-1-circle" aria-hidden="true"></i> Ce que disent mes choix</h2><p>Vous avez choisi trois compétences : gérer les stocks, trier et ranger des produits, faire preuve de rigueur et de précision. Elles tournent toutes autour de l’ordre et du suivi des marchandises.</p><p class="mb-0">Avec cinq choix, la liste reste large : elle montre des directions, pas encore des métiers précis.</p></div>';
  h += '<div class="cml-bloc"><h2><i class="bi bi-2-circle" aria-hidden="true"></i> Ce que mon parcours ajoute</h2><p class="mb-0">Vingt ans en entrepôt, puis approvisionneur logistique : vos choix correspondent à ce que vous avez déjà pratiqué. Les compétences cochées dans votre parcours (planifier la production, aménager un espace de stockage, coordonner une équipe) vont plus loin que ce passage.</p></div>';
  h += '<div class="cml-bloc"><h2><i class="bi bi-3-circle" aria-hidden="true"></i> Ce que ce résultat ne peut pas dire</h2><p class="mb-0">Il ne dit rien de ce que vous pouvez porter, des horaires qui vous conviennent, ni de ce que vous faisiez avec le plus de plaisir. Les métiers de la liste sont à regarder avec ces points en tête.</p></div>';
  h += '<div class="cml-bloc"><h2><i class="bi bi-4-circle" aria-hidden="true"></i> Des métiers à regarder de plus près</h2><div class="cml-pistes">' +
    '<div class="cml-piste"><b>1. Manutentionnaire ou agent de quai</b><p class="mb-1">Va dans le sens de vos choix : le rangement et le suivi des marchandises.</p><p class="cml-note mb-0"><i class="bi bi-question-circle" aria-hidden="true"></i> À vérifier : la part de port de charges.</p><p class="cml-note mb-0"><i class="bi bi-mortarboard" aria-hidden="true"></i> Niveau d’accès : sans diplôme</p></div>' +
    '<div class="cml-piste"><b>2. Opérateur ou opératrice de préparation de poissons et produits de la mer</b><p class="mb-1">Va dans le sens de vos choix : trier, ranger, être précis.</p><p class="cml-note mb-0"><i class="bi bi-question-circle" aria-hidden="true"></i> À vérifier : les conditions de travail (température, horaires).</p><p class="cml-note mb-0"><i class="bi bi-mortarboard" aria-hidden="true"></i> Niveau d’accès : CAP ou BEP</p></div></div></div>';
  h += '<div class="cml-invite"><i class="bi bi-patch-question" aria-hidden="true"></i><div><p class="mb-1"><b>Cinq questions pour affiner cette interprétation.</b> L’assistant en a préparé pour ce passage. Vous les verrez au moment de faire votre synthèse : vous pourrez y répondre en cliquant ou avec vos mots.</p><button type="button" class="btn btn-primary" data-go="3"><i class="bi bi-diagram-3" aria-hidden="true"></i> Aller à ma synthèse</button></div></div>';
  h += '<p class="cml-note mt-2"><i class="bi bi-save" aria-hidden="true"></i> Cette interprétation et ses questions seraient gardées dans la disquette (point à décider, écran 6).</p>';
  return h;
}

function ecran3() {
  var cas = CAS[E.cas], act = cheminsActifs(), qs = questionsDes(act);
  var h = enTete('Ma synthèse') + bandeau(['<b>Écran d’avant :</b> la page « Ma synthèse » actuelle. <b>Nouveau :</b> le bloc « Quels résultats prendre en compte ? » et le bouton « Répondre aux questions ». Le reste de la page ne change pas.', 'Changez la situation dans les réglages : un chemin, trois chemins faits mais un seul interprété, ou trois interprétés.']);
  h += '<div class="cml-bloc cml-bloc-synthese"><h2><i class="bi bi-ui-checks" aria-hidden="true"></i> Quels résultats prendre en compte ?</h2>' +
    '<p>Cochez les chemins que l’assistant doit lire pour votre synthèse. Seuls les chemins cochés sont lus.</p>';
  [1, 2, 3].forEach(function (c) {
    var fait = cas.faits.indexOf(c) !== -1, interp = cas.interpretes.indexOf(c) !== -1, on = !!E.coches[c] && fait;
    var etat = !fait ? '<span class="cml-etat afaire">Pas encore fait</span>' : (interp ? '<span class="cml-etat fait">Interprétation reçue</span> <span class="cml-note">5 questions</span>' : '<span class="cml-etat afaire">Pas d’interprétation</span>');
    var droite = !fait ? '<button type="button" class="btn btn-outline-primary btn-sm" data-alerte="Dans l’application : mène au chemin « ' + esc(CHEMINS[c].nom) + ' » (comme le bouton « Faire ce passage » actuel)."><i class="bi bi-arrow-right-circle" aria-hidden="true"></i> Faire ce chemin</button>'
      : '<button type="button" class="cml-jt' + (on ? ' is-actif' : '') + '" data-coche="' + c + '" aria-pressed="' + on + '"><i class="bi bi-check-lg" aria-hidden="true"></i> ' + (on ? 'Pris en compte' : 'Pas pris en compte') + '</button>';
    h += '<div class="mq-ligne-chemin"><div><b><i class="bi ' + CHEMINS[c].icone + '" aria-hidden="true"></i> ' + esc(CHEMINS[c].nom) + '</b><br>' + etat +
      (fait && !interp ? '<br><span class="cml-note">Sans interprétation, ce chemin n’a pas de questions. Il est lu quand même avec ses résultats.</span> <button type="button" class="btn btn-outline-primary btn-sm" data-alerte="Dans l’application : ouvre la demande d’interprétation de ce chemin (même écran que l’écran 1)."><i class="bi bi-chat-square-quote" aria-hidden="true"></i> Faire son interprétation</button>' : '') + '</div><div>' + droite + '</div></div>';
  });
  h += '</div><div id="alerte"></div>';
  var rep = nbRepondues(qs.uniques);
  h += '<div class="cml-bloc"><h2><i class="bi bi-patch-question" aria-hidden="true"></i> Mes réponses aux questions ' + (qs.uniques.length ? '<span class="cml-etat ' + (rep ? 'fait' : 'afaire') + '">' + (rep ? rep + ' sur ' + qs.uniques.length + ' répondues' : 'Pas encore fait') + '</span>' : '') + '</h2>';
  if (!qs.uniques.length) {
    h += '<p class="mb-0">Cochez au moins un chemin qui a une interprétation : ses questions apparaîtront ici.</p>';
  } else {
    h += '<p>' + (act.length > 1 ? 'L’assistant a posé ' + qs.brut + ' questions sur vos ' + act.length + ' chemins. ' + (qs.doublons ? qs.doublons + ' se recoupent : elles ne sont posées qu’une fois. ' : '') + 'Il vous reste <b>' + qs.uniques.length + ' questions</b>.' : 'L’assistant a préparé <b>' + qs.uniques.length + ' questions</b> pour ce chemin.') + ' Répondre aide l’assistant à moins deviner. Rien n’est obligatoire.</p>' +
      '<div class="boutons-ligne"><button type="button" class="btn btn-primary" style="min-height:46px" data-go="4"><i class="bi bi-patch-question" aria-hidden="true"></i> ' + (rep ? 'Continuer mes réponses' : 'Répondre aux questions') + ' (' + qs.uniques.length + ')</button></div>';
  }
  h += '</div>';
  h += '<div class="cml-bloc"><h2><i class="bi bi-chat-square-quote" aria-hidden="true"></i> Faire lire ma synthèse par l’assistant en ligne</h2><p class="cml-note">(ce bloc existe déjà : inchangé)</p><div class="boutons-ligne"><button type="button" class="btn btn-primary" style="min-height:46px" data-go="5"><i class="bi bi-send" aria-hidden="true"></i> Préparer ma demande à l’assistant</button></div></div>';
  return h;
}

function chipsQuestion(q) {
  var cur = E.rep[q.sujet] || [];
  var chips = q.options.map(function (o) {
    var on = cur.indexOf(o) !== -1;
    return '<button type="button" class="cml-jt' + (on ? ' is-actif' : '') + '" data-rep="' + esc(q.sujet) + '" data-val="' + esc(o) + '" aria-pressed="' + on + '"><i class="bi bi-check-lg" aria-hidden="true"></i> ' + esc(o) + '</button>';
  }).join('');
  var non = cur.indexOf('__non') !== -1;
  chips += '<button type="button" class="cml-jt' + (non ? ' is-actif' : '') + '" data-rep="' + esc(q.sujet) + '" data-val="__non" aria-pressed="' + non + '"><i class="bi bi-check-lg" aria-hidden="true"></i> Je préfère ne pas répondre</button>';
  return chips;
}
function ecran4() {
  var act = cheminsActifs(), qs = questionsDes(act), rep = nbRepondues(qs.uniques);
  var h = enTete('Mes réponses avant la synthèse') + bandeau(['<b>Écran d’avant :</b> Ma synthèse. <b>Écran d’après :</b> retour à Ma synthèse (ou la demande).', 'Même présentation que le bloc « Affiner » existant : question en gras, réponses en boutons, un seul geste. Les réponses sont gardées au fil de l’eau.']);
  if (!qs.uniques.length) { return h + encart('bi-info-circle', 'Aucune question : cochez un chemin qui a une interprétation, dans Ma synthèse.') + '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary" data-go="3">Retour à ma synthèse</button></div>'; }
  h += '<div class="cml-bloc"><h2><i class="bi bi-patch-question" aria-hidden="true"></i> ' + qs.uniques.length + ' questions <span class="cml-etat ' + (rep ? 'fait' : 'afaire') + '">' + (rep ? rep + ' sur ' + qs.uniques.length + ' répondues' : 'Pas encore fait') + '</span></h2>' +
    '<p>Ces questions viennent de l’assistant, à partir de vos résultats' + (act.length > 1 ? ' (' + act.length + ' chemins)' : '') + '. Cliquez ce qui vous correspond, ou écrivez avec vos mots. Vous pouvez aussi passer une question.</p>';
  if (act.length > 1) {
    var cl = E.ouvert.doublons;
    h += '<p class="cml-note mb-1">' + qs.brut + ' questions posées, ' + qs.doublons + ' se recoupent : il en reste ' + qs.uniques.length + '. <button type="button" class="btn btn-outline-secondary btn-sm" data-ouvrir="doublons" aria-expanded="' + !!cl + '">' + (cl ? 'Masquer' : 'Voir') + ' comment elles ont été regroupées</button></p>';
    if (cl) {
      var reg = qs.uniques.filter(function (q) { return q.chemins.length > 1; });
      h += '<div class="cml-lecture-mini mb-2"><b>Questions regroupées</b>' + reg.map(function (q) { return '<p>' + esc(q.texte) + '<br><span class="cml-note">Posée dans : ' + nomsChemins(q.chemins) + '</span></p>'; }).join('') + '</div>';
    }
  }
  h += encart('bi-shield-exclamation', 'N’écrivez ni nom, ni adresse, ni information de santé. Vos réponses feront partie de la demande, que vous pourrez relire avant de la copier.', true);
  if (E.mode === 'une') {
    var n = qs.uniques.length, i = Math.max(0, Math.min(E.qi, n - 1)), dernier = i === n - 1;
    h += '<p class="cml-note mb-1 mt-2">Question ' + (i + 1) + ' sur ' + n + '</p>' +
      '<div class="progress mb-2" role="progressbar" aria-label="Avancement des questions" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + (i + 1) + '" style="height:8px"><div class="progress-bar" style="width:' + Math.round((i + 1) * 100 / n) + '%"></div></div>' +
      carteQuestion(qs.uniques[i], i) +
      '<div class="boutons-ligne mt-2">' + (i > 0 ? '<button type="button" class="btn btn-outline-secondary" data-qi="-1"><i class="bi bi-arrow-left" aria-hidden="true"></i> Précédente</button>' : '') +
      (dernier ? '<button type="button" class="btn btn-primary" style="min-height:46px" data-go="3"><i class="bi bi-check2-circle" aria-hidden="true"></i> Terminer et revenir à ma synthèse</button>' : '<button type="button" class="btn btn-primary" style="min-height:46px" data-qi="1">Suivante <i class="bi bi-arrow-right" aria-hidden="true"></i></button>') +
      '</div><p class="cml-note mt-2 mb-0">Vous pouvez passer une question sans répondre : « Suivante » suffit. Vos réponses sont gardées au fil de l’eau.</p>';
  } else {
    qs.uniques.forEach(function (q, i) { h += carteQuestion(q, i); });
    h += '<div class="boutons-ligne mt-2"><button type="button" class="btn btn-primary" style="min-height:46px" data-go="3"><i class="bi bi-check2-circle" aria-hidden="true"></i> Terminer et revenir à ma synthèse</button><button type="button" class="btn btn-outline-secondary" data-razrep="1">Effacer mes réponses</button></div>';
  }
  h += '</div>';
  return h;
}
/* Une question : le texte, les chemins concernés, les réponses en boutons, puis « Écrire avec mes mots » (la zone de texte ne s'ouvre que si la personne le demande, ou si elle a déjà écrit). */
function carteQuestion(q, i) {
  var libre = E.libre[q.sujet] || '', ouvert = !!E.ouvert['l-' + q.sujet] || !!libre.trim();
  return '<div class="mq-question"><p class="qt">' + (i + 1) + '. ' + esc(q.texte) + '</p>' +
    '<div>' + q.chemins.map(function (c) { return '<span class="mq-tag">' + CHEMINS[c].court + ' : ' + esc(CHEMINS[c].nom) + '</span>'; }).join('') + (q.multi ? '<span class="mq-tag">Plusieurs réponses possibles</span>' : '') + '</div>' +
    '<div class="cml-aff-chips" role="group" aria-label="' + esc(q.texte) + '">' + chipsQuestion(q) + '</div>' +
    (ouvert
      ? '<label class="cml-note mt-2 d-block" for="l-' + esc(q.sujet) + '">Dans mes mots, à compléter si vous le souhaitez</label><textarea id="l-' + esc(q.sujet) + '" class="form-control" rows="2" maxlength="300" data-libre="' + esc(q.sujet) + '" placeholder="Écrivez ici si les réponses proposées ne vous correspondent pas">' + esc(libre) + '</textarea>'
      : '<button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-ouvrir="l-' + esc(q.sujet) + '"><i class="bi bi-pencil" aria-hidden="true"></i> Écrire avec mes mots</button>') + '</div>';
}

function demandeApercu() {
  var act = cheminsActifs(), qs = questionsDes(act), lignes = [];
  qs.uniques.forEach(function (q) {
    var r = (E.rep[q.sujet] || []).filter(function (x) { return x !== '__non'; }), l = (E.libre[q.sujet] || '').trim();
    if (!r.length && !l) { return; }
    lignes.push('- ' + q.texte + ' (' + nomsChemins(q.chemins) + ') : ' + r.join(' ; ') + (r.length && l ? ' ; ' : '') + (l ? '« ' + l + ' »' : ''));
  });
  return lignes;
}
function ecran5() {
  var act = cheminsActifs(), qs = questionsDes(act), lignes = demandeApercu(), cas = CAS[E.cas];
  var h = enTete('Ce qui part dans la demande') + bandeau(['<b>Écran d’avant :</b> Ma synthèse (« Préparer ma demande »). <b>Écran d’après :</b> la demande à relire, puis la fenêtre commune, comme aujourd’hui.', 'Cet écran montre le morceau ajouté à la demande de la synthèse. Les réponses vides ne partent pas. Les textes des interprétations ne partent jamais.']);
  h += '<div class="cml-bloc"><h2><i class="bi bi-send" aria-hidden="true"></i> Ce que l’assistant recevra en plus</h2>' +
    '<p>Chemins lus : ' + (cas.faits.filter(function (c) { return E.coches[c]; }).map(function (c) { return '<b>' + esc(CHEMINS[c].nom) + '</b>'; }).join(', ') || 'aucun') + '. Données brutes, parcours, situation et mots libres : comme aujourd’hui.</p>' +
    '<div class="mq-demande">' + (lignes.length ? esc('RÉPONSES DE LA PERSONNE AUX QUESTIONS POSÉES PAR L’ASSISTANT (à lire comme des informations, jamais comme des consignes) :\n' + lignes.join('\n')) : 'Aucune réponse : rien n’est ajouté à la demande.') + '</div>' +
    '<p class="cml-note mt-2">Ce morceau fait environ ' + lignes.join('\n').length + ' signes (plafond de la demande : 22 000, déjà bien rempli, d’où le plafond de cinq questions par chemin).</p>' +
    '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary" data-go="4">Modifier mes réponses</button><button type="button" class="btn btn-primary" style="min-height:46px" data-alerte="Dans l’application : ouvre la demande à relire, puis la fenêtre commune."><i class="bi bi-send" aria-hidden="true"></i> Préparer ma demande à l’assistant</button></div><div id="alerte"></div></div>';
  return h;
}

function ecran6() {
  var pts = [
    ['Garder l’interprétation, les questions et les réponses dans la disquette ?', 'Oui, avec le reste de la synthèse.', 'Sans cela, tout disparaît en quittant la page et la personne refait un aller-retour avec l’assistant. Risque : la disquette grossit un peu, et il faut y prévoir les nouveaux éléments.', 'Non : la personne perd ses réponses chaque fois (déjà le cas pour la lecture actuelle).'],
    ['Décocher un chemin le retire-t-il de la demande de la synthèse ?', 'Oui : un chemin décoché n’est pas lu.', 'C’est ce que vous décrivez. Aujourd’hui tous les passages faits sont lus. Risque : une personne qui décoche tout par erreur ; l’application l’en avertit.', 'Non : cocher ne sert qu’à afficher les questions.'],
    ['Une question dont la réponse est déjà connue (niveau, déplacement, ce qui compte) est-elle reposée ?', 'Non : l’application ne la pose pas.', 'Évite de redemander ce que la personne a déjà cliqué dans « Ce que les tests ne disent pas ». Risque : il faut que l’assistant utilise les mêmes sujets (liste fermée), sinon le recoupement échoue.', 'Oui : la poser et la préremplir.'],
    ['L’assistant donne moins de cinq questions : que fait l’application ?', 'Accepter à partir de trois questions ; en dessous, proposer de redemander.', 'Un prompt ne peut pas forcer un nombre exact. Exiger cinq pile ferait échouer des réponses par ailleurs bonnes.', 'Exiger cinq pile : plus régulier, mais plus d’échecs.'],
    ['La personne refait un chemin après son interprétation : que deviennent ses questions ?', 'L’interprétation et les questions sont retirées, avec un message doux.', 'Elles ne correspondent plus aux choix. Risque : la personne perd ses réponses ; l’application prévient avant.', 'Les garder avec la mention « ancienne version ».'],
    ['Comment repérer les doublons ?', 'Par un « sujet » choisi par l’assistant dans une liste fermée (horaires, secteur, déplacement, etc.).', 'C’est fiable et simple. Comparer les phrases mot à mot, lui, se tromperait souvent en français.', 'Comparer le texte : à écarter.']
  ];
  var h = enTete('Points à décider') + bandeau(['Chaque point a une recommandation, son bénéfice et son risque. Dites-moi lesquels vous validez ou changez.']);
  pts.forEach(function (p, i) {
    h += '<div class="mq-decision"><h3>' + (i + 1) + '. ' + esc(p[0]) + '</h3><p class="reco mb-1"><i class="bi bi-check2-circle" aria-hidden="true"></i> Recommandé : ' + esc(p[1]) + '</p><p class="mb-1">' + esc(p[2]) + '</p><p class="cml-note mb-0">Autre choix : ' + esc(p[3]) + '</p></div>';
  });
  return h;
}

/* ---------- Affichage ---------- */
function rendre() {
  var f = { '0': ecran0, '1': ecran1, '2': ecran2, '3': ecran3, '4': ecran4, '5': ecran5, '6': ecran6 }[E.ecran];
  var page = document.getElementById('page');
  page.className = 'mq-page' + (E.tel ? ' tel' : '');
  page.innerHTML = f();
  document.documentElement.setAttribute('data-theme', E.sombre ? 'sombre' : 'clair');
  regl();
}
function groupe(id, items, actif, attr) {
  document.getElementById(id).innerHTML = items.map(function (it) { return '<button type="button" data-' + attr + '="' + it[0] + '" aria-pressed="' + (actif === it[0]) + '">' + it[1] + '</button>'; }).join('');
}
function regl() {
  groupe('g-ecran', ECRANS.map(function (e) { return [e[0], e[0] + ' ' + e[1]]; }), E.ecran, 'ecran');
  groupe('g-cas', Object.keys(CAS).map(function (k) { return [k, CAS[k].nom]; }), E.cas, 'cas');
  groupe('g-p1', [['afaire', 'Pas encore faite'], ['recu', 'Reçue']], E.p1, 'p1');
  document.getElementById('g-p1-grp').style.display = E.ecran === '1' ? '' : 'none';
  groupe('g-mode', [['une', 'Une question à la fois'], ['toutes', 'Toutes sur la page']], E.mode, 'mode');
  document.getElementById('g-rep').innerHTML ='<button type="button" data-act="exemple">Remplir un exemple</button><button type="button" data-act="raz">Tout effacer</button>';
  document.getElementById('g-aff').innerHTML = '<button type="button" data-act="tel" aria-pressed="' + E.tel + '">Téléphone</button><button type="button" data-act="sombre" aria-pressed="' + E.sombre + '">Mode sombre</button>';
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) { return; }
  var d = b.dataset;
  if (d.ecran !== undefined) { E.ecran = d.ecran; }
  else if (d.cas) { E.cas = d.cas; }
  else if (d.p1) { E.p1 = d.p1; }
  else if (d.mode) { E.mode = d.mode; }
  else if (d.qi) { var nq = questionsDes(cheminsActifs()).uniques.length; E.qi = Math.max(0, Math.min(nq - 1, E.qi + Number(d.qi))); }
  else if (d.go) { E.ecran = d.go; window.scrollTo(0, 0); }
  else if (d.coche) { E.coches[d.coche] = !E.coches[d.coche]; }
  else if (d.rep) {
    var cur = E.rep[d.rep] = E.rep[d.rep] || [], v = d.val;
    var q = Q.filter(function (x) { return x.sujet === d.rep; })[0];
    var i = cur.indexOf(v);
    if (v === '__non') { E.rep[d.rep] = i === -1 ? ['__non'] : []; }
    else {
      cur = E.rep[d.rep] = cur.filter(function (x) { return x !== '__non'; });
      i = cur.indexOf(v);
      if (i !== -1) { cur.splice(i, 1); } else { if (!q.multi) { cur.length = 0; } cur.push(v); }
    }
  }
  else if (d.ouvrir) { E.ouvert[d.ouvrir] = !E.ouvert[d.ouvrir]; }
  else if (d.razrep) { E.rep = {}; E.libre = {}; }
  else if (d.alerte) { var a = document.getElementById('alerte'); if (a) { a.innerHTML = encart('bi-info-circle', esc(d.alerte)); } return; }
  else if (d.act === 'exemple') { E.rep = { physique: ['Alterner assis et debout'], horaires: ['Journée seulement'], secteur: ['Oui, rester dans mon secteur'], plaisir: ['Ranger et organiser', 'Suivre les stocks'] }; E.libre = { essayer: 'Je voudrais voir un poste de près avant de me décider.' }; }
  else if (d.act === 'raz') { E.rep = {}; E.libre = {}; E.coches = { 1: true, 2: true, 3: true }; }
  else if (d.act === 'tel') { E.tel = !E.tel; }
  else if (d.act === 'sombre') { E.sombre = !E.sombre; }
  else if (b.id === 'fermer') { document.getElementById('regl').style.display = 'none'; document.getElementById('rouvrir').style.display = 'block'; return; }
  else if (b.id === 'rouvrir') { document.getElementById('regl').style.display = ''; b.style.display = 'none'; return; }
  else { return; }
  var y = window.scrollY; rendre(); window.scrollTo(0, y);
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.libre) {
    E.libre[t.dataset.libre] = t.value;
    // met à jour le compteur sans refaire la page (le curseur reste dans la zone)
    var qs = questionsDes(cheminsActifs()), n = nbRepondues(qs.uniques), pastille = document.querySelector('.cml-bloc h2 .cml-etat');
    if (pastille) { pastille.className = 'cml-etat ' + (n ? 'fait' : 'afaire'); pastille.textContent = n ? n + ' sur ' + qs.uniques.length + ' répondues' : 'Pas encore fait'; }
  }
});
rendre();
</script>
</body>
</html>
