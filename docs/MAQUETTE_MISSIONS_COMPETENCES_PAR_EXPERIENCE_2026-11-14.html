.vp-qcorps{padding:.25rem .85rem .7rem;border-top:1px solid var(--border);}

document.addEventListener('click', function(e){ var t = e.target.closest('[data-onglet],[data-autres],[data-fiche],[data-ouvrir],[data-m],[data-modifier-m],[data-ok-m],[data-actuelle],[data-perso-m],[data-g],[data-h],[data-aller],[data-c],[data-ajout-m],[data-ajout-comp],[data-nav]'); if (t) agir(t); });
document.addEventListener('keydown', function(e){
  var c = e.target;
  if (e.key === 'Enter' || e.key === ' ') { if (c.classList && c.classList.contains('vp-carte') && c.getAttribute('role') === 'checkbox') { e.preventDefault(); agir(c); return; } }
  if (e.key !== 'Enter') return;
  if (c.id && c.id.indexOf('ajout-m-') === 0) qs('[data-ajout-m="' + c.id.slice(8) + '"]').click();
  if (c.id && c.id.indexOf('ajout-comp-') === 0) qs('[data-ajout-comp="' + c.id.slice(11) + '"]').click();
});

/* Outils de la maquette */
qs('#mq-ouvrir').addEventListener('click', function(){ qs('#mq-panneau').hidden = !qs('#mq-panneau').hidden; });
qs('#mq-fermer').addEventListener('click', function(){ qs('#mq-panneau').hidden = true; });
qs('#mq-ecran').addEventListener('change', function(){ etat.ecran = this.value; tout(); window.scrollTo(0, 0); });
qs('#mq-theme').addEventListener('change', function(){ document.documentElement.setAttribute('data-theme', this.value === 'sombre' ? 'sombre' : 'clair'); });
qs('#mq-apercu').addEventListener('change', function(){ delete etat.ouvert.cv; tout(); });
tout();
