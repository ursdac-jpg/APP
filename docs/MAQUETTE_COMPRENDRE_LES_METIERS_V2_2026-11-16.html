<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : Comprendre les métiers (version 2)</title>
<link href="../vendor/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
/* Couleurs des six lettres : valeur claire ET sombre. À ajouter dans css/style.css au moment du code. Jamais la couleur seule : la lettre est toujours écrite. */
:root{--ri-R:#b4540a;--ri-I:#1f7a4d;--ri-A:#b4233c;--ri-S:#6d4aa8;--ri-E:#0f6f8f;--ri-C:#7a6a00;--ri-txt:#fff}
[data-theme="sombre"]{--ri-R:#e8944f;--ri-I:#4cc38a;--ri-A:#f27a8f;--ri-S:#b79cf0;--ri-E:#52bfe0;--ri-C:#d6c24a;--ri-txt:#101418}
body{margin:0;background:var(--bg-page);color:var(--text-strong);font-family:"Segoe UI",Roboto,system-ui,sans-serif;padding:0 16px 7rem}
.mq-page{max-width:1000px;margin:0 auto;padding-top:1rem}
.mq-page.tel{max-width:390px}
.mq-regl{position:sticky;top:0;z-index:600;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.7rem .9rem;margin:.6rem auto 1rem;max-width:1100px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.mq-regl h2{font-size:1rem;margin:0 0 .4rem;display:flex;align-items:center;gap:.5rem}
.mq-regl h2 button{margin-left:auto}
.mq-regl .grp{margin:.45rem 0}
.mq-regl .grp>b{display:block;font-size:.85rem;margin-bottom:.25rem}
.mq-regl .boutons{display:flex;flex-wrap:wrap;gap:.35rem}
.mq-regl .boutons button,.mq-regl select{font-size:.8rem}
.mq-rouvrir{position:fixed;top:8px;right:8px;z-index:610;display:none}
.mq-retient{background:var(--bg-subtle);border:1px dashed var(--border-strong);border-radius:8px;padding:.5rem .7rem;font-size:.85rem;margin-top:.5rem}
.mq-retient p{margin:.1rem 0}
.mq-note{font-size:.85rem;color:var(--text-muted)}

.fil{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;border:1px solid var(--border-strong);border-radius:12px;padding:.45rem .7rem;background:var(--bg-card);margin-bottom:.8rem;font-size:var(--t-petit,.875rem)}
.fil .pas{padding:.1rem .6rem;border-radius:999px;background:var(--accent-bg-subtle);border:1px solid var(--border);color:var(--accent-texte,var(--accent));font-weight:600}
.fil .ici{background:var(--accent);color:#fff;border-color:var(--accent)}

.bloc{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;margin:.7rem 0}
.bloc h2,.bloc h3{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0 0 .5rem}
.titre-page{font-size:var(--t-titre-page,1.9rem);font-weight:800;margin:.2rem 0 .4rem}
.encart{background:var(--accent-bg-subtle);border-left:3px solid var(--accent);border-radius:8px;padding:.7rem .9rem;margin:.7rem 0;display:flex;gap:.7rem;align-items:flex-start}
.encart.warn{background:var(--warning-bg-subtle);border-left-color:var(--warning-border)}
.encart i{color:var(--accent);font-size:1.3rem;margin-top:.1rem}
.encart.warn i{color:var(--warning-strong)}
.encart p{margin:0}
.grille3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.tel .grille3{grid-template-columns:1fr}
.entree{display:flex;flex-direction:column;gap:.5rem;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.9rem 1rem}
.entree .ico{font-size:1.7rem;color:var(--accent)}
.entree h3{font-size:var(--t-moyen,1rem);font-weight:800;margin:0}
.entree p{font-size:var(--t-petit,.875rem);margin:0;color:var(--text-muted);flex:1}
.entree .btn{min-height:44px}
.six{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .9rem;margin-top:.4rem}
.tel .six{grid-template-columns:1fr}
.six div{display:flex;gap:.5rem;align-items:flex-start;font-size:var(--t-petit,.875rem)}

.ri-p{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ri-c);color:var(--ri-txt);font-weight:800;font-size:.95rem;flex:none}
.ri-p.gros{width:56px;height:56px;font-size:1.6rem}
.ri-R{--ri-c:var(--ri-R)}.ri-I{--ri-c:var(--ri-I)}.ri-A{--ri-c:var(--ri-A)}.ri-S{--ri-c:var(--ri-S)}.ri-E{--ri-c:var(--ri-E)}.ri-C{--ri-c:var(--ri-C)}

.etapes{display:grid;gap:.35rem;margin:.3rem 0 .2rem}
.etapes span{height:8px;border-radius:999px;background:var(--border)}
.etapes span.fait{background:var(--accent)}
.etapes span.en-cours{background:var(--accent);opacity:.55}
.q-compteur{font-size:var(--t-petit,.875rem);color:var(--text-muted);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.q-ligne{display:flex;align-items:center;justify-content:space-between;gap:.8rem;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);padding:.6rem .8rem;margin:.45rem 0;flex-wrap:wrap}
.q-ligne .txt{flex:1 1 260px;font-size:var(--t-moyen,1rem);font-weight:600}
.q-rep{display:flex;gap:.4rem;flex-wrap:wrap}
.q-rep .btn{min-height:44px;min-width:88px;font-weight:700}
.q-rep .btn.choisi{background:var(--accent);border-color:var(--accent);color:#fff}
.q-reste{font-size:var(--t-petit,.875rem);color:var(--text-muted);margin:.6rem 0 0}

.hex-zone{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:center}
.tel .hex-zone{grid-template-columns:1fr}
.hex-zone svg{width:100%;height:auto;max-width:460px;margin:0 auto;display:block}
.hex-zone svg text{fill:var(--text-strong);font-family:inherit}
.hex-fond{fill:var(--bg-subtle);stroke:var(--border-strong);stroke-width:2}
.hex-axe{stroke:var(--border-strong);stroke-width:1}
.hex-opp{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;opacity:.75}
.hex-profil{fill:var(--accent);fill-opacity:.28;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.hex-pt{fill:var(--accent)}

.barre-l{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:.6rem;margin:.35rem 0}
.barre-l .piste{height:16px;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);overflow:hidden}
.barre-l .piste span{display:block;height:100%;background:var(--ri-c);border-radius:999px}
.barre-l .nom{font-size:var(--t-petit,.875rem);color:var(--text-muted);min-width:5.5rem;text-align:right}
.barre-l.haut .nom{color:var(--text-strong);font-weight:700}

.ff{border:1px solid var(--border);border-radius:12px;padding:.7rem .85rem;margin:.55rem 0;background:var(--bg-card)}
.ff-tete{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:700;font-size:var(--t-petit,.875rem)}
.ff-tete .cote{display:flex;align-items:center;gap:.4rem}
.ff-piste{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--g),var(--d));margin:.7rem 0 .5rem}
.ff-piste i{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--bg-card);border:4px solid var(--accent)}
.ff p{margin:0;font-size:var(--t-petit,.875rem)}

.m-grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.tel .m-grille{grid-template-columns:1fr}
.m-carte{display:flex;flex-direction:column;gap:.45rem;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.8rem .9rem}
.m-carte.premier{grid-column:1 / -1;border-color:var(--accent);border-width:2px}
.m-carte h4{margin:0;font-size:var(--t-moyen,1rem);font-weight:800}
.m-carte .let{display:flex;gap:.35rem;align-items:center;font-size:var(--t-petit,.875rem);color:var(--text-muted);flex-wrap:wrap}
.m-carte .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;margin-top:auto}
.m-carte .actions .btn{min-height:44px;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:.3rem;text-align:center;line-height:1.15}
.m-carte .actions .large{grid-column:1 / -1}
.pill{display:inline-block;font-size:.78rem;padding:.12rem .55rem;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-muted)}
.pct{display:flex;align-items:center;gap:.6rem}
.pct .piste{flex:1;height:16px;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);overflow:hidden}
.pct .piste span{display:block;height:100%;background:var(--accent);border-radius:999px}
.pct b{font-size:1rem;min-width:3.2rem;text-align:right}

details.bloc-depli-m{border-left:4px solid var(--accent);border-radius:8px;background:var(--bg-card);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:.5rem 0}
details.bloc-depli-m summary{cursor:pointer;padding:.7rem .9rem;font-weight:700;display:flex;gap:.6rem;align-items:center;background:var(--accent-bg-subtle);border-radius:0 8px 8px 0;list-style:none}
details.bloc-depli-m summary::-webkit-details-marker{display:none}
details.bloc-depli-m summary::before{content:"\f285";font-family:"bootstrap-icons";transition:transform .15s}
details.bloc-depli-m[open] summary::before{transform:rotate(90deg)}
details.bloc-depli-m .corps{padding:.7rem .9rem}


.secteurs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.tel .secteurs{grid-template-columns:1fr}
.secteurs .btn{min-height:46px;display:flex;justify-content:space-between;align-items:center;gap:.5rem;text-align:left;font-weight:600}
.secteurs .btn .nb{font-size:.78rem;font-weight:700;background:var(--accent-bg-subtle);color:var(--accent-texte,var(--accent));border-radius:999px;padding:.05rem .5rem;flex:none}
.secteurs .btn.actif{background:var(--accent);color:#fff;border-color:var(--accent)}
.secteurs .btn.actif .nb{background:rgba(255,255,255,.25);color:#fff}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:.45rem .6rem .45rem .8rem;min-height:52px;margin:.35rem 0;flex-wrap:wrap}
.ligne .btn{min-height:40px;font-size:.8rem}
.ligne .sub{font-size:.8rem;color:var(--text-muted)}
.bandeau-choix{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;border:1px solid var(--border-strong);border-radius:12px;padding:.55rem .8rem;background:var(--bg-card)}
.bandeau-choix .n{font-size:1.1rem;font-weight:800}
.coche{color:var(--success,#1f7a4d)}
.btn-recommencer{background:#f6d9cf;border-color:#e6b8a6;color:#5b2a1a}
[data-theme="sombre"] .btn-recommencer{background:#4a2c22;border-color:#7a4a3a;color:#f3d6cb}
.m-carte .actions.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.m-carte .actions.trois .btn{padding:.3rem .35rem}
@media (max-width:640px){.m-carte .actions.trois .btn{font-size:.7rem}.hex-zone,.grille3,.six,.m-grille,.secteurs{grid-template-columns:1fr}.mq-page{padding-top:.4rem}}
</style>
</head>
<body>

</div>

    '<div class="encart"><i class="bi bi-compass"></i><p>Voici ce que vos réponses mettent en avant <b>aujourd’hui</b> (questionnaire passé le 16/11/2026). Ce n’est ni un verdict ni une étiquette : c’est un point de départ pour explorer. Tout le monde a un peu de chaque lettre, et elles évoluent avec l’expérience.</p></div>' +
    '<div class="bloc"><h2>Vos trois lettres</h2><div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">' + t.map(function (l) { return '<div style="display:flex;gap:.4rem;align-items:center">' + past(l, true) + '<b>' + NOMS[l] + '</b></div>'; }).join('') + '</div></div>' +
    '<div class="bloc"><div class="hex-zone"><div>' + hexagone(PROFIL, true) + '</div><div><h2>Vos réponses sur l’hexagone</h2><div role="group" aria-label="Vos six lettres">' + barres + '</div></div></div></div>' +
    '<div class="bloc"><h2>Les types face à face</h2><p class="mq-note">Sur l’hexagone, chaque type a son opposé. Voici de quel côté penchent vos réponses.</p>' + ff + '</div>' +
    '<div class="bloc"><h2>Ce que veulent dire vos lettres</h2>' + fichesLettres(t, true) + '</div>' +
    '<div class="bloc"><h2>Des métiers qui partagent vos lettres</h2>' +
    '<div class="encart"><i class="bi bi-building"></i><p>France Travail donne à chaque métier du ROME une ou deux lettres. Ces métiers portent les vôtres : ce sont des pistes qui ressemblent à ce que vous aimez, pas une liste de métiers « faits pour vous ».</p></div>' +
    '<div class="m-grille">' + metiers.map(function (m) { return '<div class="m-carte"><h4>' + esc(m.nom) + '</h4><div class="let">' + lettres(m.l) + '<span class="pill">' + esc(m.sect) + '</span></div>' + boutonsMetier(m.nom, true) + '</div>'; }).join('') + '</div></div>' +
    '<div class="encart"><i class="bi bi-people"></i><p>Parler de ce résultat avec un conseiller ou un professionnel complète utilement cette exploration.</p></div>' +

}
var VUES = { accueil: vAccueil, intro: vIntro, metier: vMetier, fiche: vFiche, actions1: function () { return vChoix('actions1'); }, actions2: function () { return vChoix('actions2'); }, actions3: function () { return vChoix('actions3'); }, actions4: vConditions, resultats2: vResultats2, 'q-intro': vQIntro, q1: function () { return vQuestion(1); }, q2: function () { return vQuestion(2); }, q3: function () { return vQuestion(3); }, q4: function () { return vQuestion(4); }, fin1: vFin1, resultat: vResultat };

/* ===== Barre du bas : la vraie barre de l'application (barreNavigation, js/app.js), mêmes classes ===== */
function barreBas() {
  var e = ETAT.ecran, retour = null, suite = null, desactive = null;
  var retourFiche = ETAT.depuis;
  var R = { intro: 'accueil', metier: 'intro', fiche: retourFiche, actions1: 'intro', actions2: 'actions1', actions3: 'actions2', actions4: 'actions3', resultats2: 'actions4', 'q-intro': 'intro', q1: 'q-intro', q2: 'q1', q3: 'q2', q4: 'q3', fin1: 'q1', resultat: 'q4' };
  var S = { actions1: 'actions2', actions2: 'actions3', actions3: 'actions4', actions4: 'resultats2', q1: 'fin1', q2: 'fin1', q3: 'fin1', q4: 'resultat' };
  retour = R[e] || null; suite = S[e] || null;
  if (e === 'fin1') { retour = 'q' + (ETAT.partieFinie || 1); suite = 'q' + ((ETAT.partieFinie || 1) + 1); }
  if (ECRAN_CHOIX[e] && nbChoix(ECRAN_CHOIX[e]) === 0) { desactive = 'Choisissez au moins un élément pour continuer.'; }
  var h = '<div class="barre-navigation-fixe"><div class="d-flex justify-content-between align-items-center mt-4 barre-navigation">';
  h += retour ? '<button class="btn btn-nav-erip btn-lg" data-go="' + retour + '">&#8592; Retour</button>' : '<span></span>';
  h += '<button class="btn btn-nav-erip btn-accueil" data-go="accueil"><i class="bi bi-house-door" aria-hidden="true"></i> Accueil</button>';
  if (suite) {
    h += '<button class="btn btn-primary btn-lg"' + (desactive ? ' disabled title="' + desactive + '"' : ' data-go="' + suite + '"') + '>' + (e === 'q4' ? 'Voir mon résultat' : 'Continuer') + ' &#8594;</button>' + (desactive ? '<span class="barre-raison-suivant" role="status">' + desactive + '</span>' : '');
  } else { h += '<span></span>'; }
  return h + '</div></div>';
}

RETIENT.resultat = ['Un score par lettre (barres), jamais une note sur 100 ni un classement de personnes.', 'Face à face : de quel côté penchent les réponses sur chaque paire d’opposés, en phrases de préférence.', 'Explication de chacune des trois lettres : en bref, ce qui attire, points forts, ce qui demande un peu d’attention, univers, métiers (mots à nous, tendances de groupe, pas un portrait).', 'Métiers : lettres `ri` du ROME. « Garder mon résultat » et « Refaire le questionnaire » sont dans la page, pas dans la barre du bas.'];

/* ===== Rendu et événements ===== */
function rendre() {
  var page = document.getElementById('mqPage');
  page.className = 'mq-page' + (ETAT.taille === 'tel' ? ' tel' : '');
  page.innerHTML = VUES[ETAT.ecran]();
  document.getElementById('mqBas').innerHTML = barreBas();
  document.getElementById('mqEcran').value = ETAT.ecran;
  var r = RETIENT[ETAT.ecran] || [];
  document.getElementById('mqRetient').innerHTML = '<b>Ce que cet écran retient</b>' + r.map(function (x) { return '<p>' + x.replace(/`([^`]+)`/g, '<code>$1</code>') + '</p>'; }).join('');
  document.getElementById('mqVar').innerHTML = [
    ['p3', 'doux', 'Partie 3 : mots doux', 'origine', 'Partie 3 : faible, moyen, fort'],
    ['p4', 'doux', 'Partie 4 : phrases adoucies', 'origine', 'Partie 4 : proches de l’original']
  ].map(function (c) {
    return '<button type="button" class="btn btn-sm ' + (ETAT[c[0]] === c[1] ? 'btn-primary' : 'btn-outline-primary') + '" data-var="' + c[0] + '" data-val="' + c[1] + '">' + c[2] + '</button>' +
      '<button type="button" class="btn btn-sm ' + (ETAT[c[0]] === c[3] ? 'btn-primary' : 'btn-outline-primary') + '" data-var="' + c[0] + '" data-val="' + c[3] + '">' + c[4] + '</button>';
  }).join('');
  var rech = document.getElementById('rech');
  if (rech) { rech.addEventListener('input', function () { ETAT.rech = rech.value; document.getElementById('resRech').innerHTML = htmlResultatsRech(); }); }
  var fs = document.getElementById('filtreSecteur');
  if (fs) { fs.addEventListener('input', function () { ETAT.filtreSecteur = fs.value; var pos = fs.selectionStart; rendre(); var n = document.getElementById('filtreSecteur'); n.focus(); n.setSelectionRange(pos, pos); }); }
}
function aller(e) { var m = /^q([1-3])$/.exec(ETAT.ecran); if (e === 'fin1' && m) { ETAT.partieFinie = parseInt(m[1], 10); } ETAT.ecran = e; if (e === 'metier' || e === 'resultats2') { ETAT.depuis = e; } rendre(); window.scrollTo(0, 0); }
(function init() {
  var s = document.getElementById('mqEcran');
  s.innerHTML = ECRANS.map(function (e) { return '<option value="' + e[0] + '">' + e[1] + '</option>'; }).join('');
  s.addEventListener('change', function () { aller(s.value); });
  document.getElementById('mqLarge').onclick = function () { ETAT.taille = 'large'; rendre(); };
  document.getElementById('mqTel').onclick = function () { ETAT.taille = 'tel'; rendre(); };
  document.getElementById('mqZero').onclick = function () { ETAT.choix = { qui: {}, actions: {}, env: {}, cond: {} }; ETAT.rep = {}; ETAT.reperes = {}; ETAT.compar = {}; ETAT.proches = {}; ETAT.cacher = {}; ETAT.partieFinie = 1; ETAT.secteur = null; ETAT.plusRes = false; ETAT.rech = 'AS'; ETAT.fiche = null; rendre(); };
  document.getElementById('mqTheme').onclick = function () {
    var sombre = document.documentElement.getAttribute('data-theme') === 'sombre';
    if (sombre) { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', 'sombre'); }
    this.textContent = sombre ? 'Mode sombre' : 'Mode clair';
  };
  document.getElementById('mqFermer').onclick = function () { document.getElementById('mqRegl').style.display = 'none'; document.getElementById('mqRouvrir').style.display = 'inline-block'; };
  document.getElementById('mqRouvrir').onclick = function () { document.getElementById('mqRegl').style.display = ''; this.style.display = 'none'; };
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-go],[data-rep],[data-var],[data-secteur],[data-choix],[data-bascule],[data-fiche],[data-vider],[data-plus],[data-proches]');
    if (!el || el.disabled) { return; }
    var y = window.scrollY;
    var d = el.dataset;
    if (d.go) { aller(d.go); return; }
    if (d.fiche) { ETAT.fiche = d.fiche; ETAT.depuis = (ETAT.ecran === 'resultats2' || ETAT.ecran === 'metier') ? ETAT.ecran : ETAT.depuis; if (ETAT.ecran === 'fiche') { rendre(); window.scrollTo(0, 0); return; } aller('fiche'); return; }
    if (d.rep) { var v = d.v; ETAT.rep[d.rep] = (v === 'o' || v === 'n') ? v : parseInt(v, 10); }
    else if (d.var) { ETAT[d.var] = d.val; }
    else if (d.secteur) { ETAT.secteur = (ETAT.secteur === d.secteur) ? null : d.secteur; ETAT.filtreSecteur = ''; }
    else if (d.choix) { var p = d.choix.split('|'), c = p.shift(), l = p.join('|'); ETAT.choix[c][l] = !ETAT.choix[c][l]; }
    else if (d.vider) { ETAT.choix[d.vider] = {}; }
    else if (d.plus) { ETAT.plusRes = true; }
    else if (d.proches) { ETAT.proches[d.proches] = !ETAT.proches[d.proches]; }
    else if (d.bascule) { ETAT[d.bascule][d.nom] = !ETAT[d.bascule][d.nom]; }
    rendre(); window.scrollTo(0, y);
  });
  rendre();
})();
</script>
