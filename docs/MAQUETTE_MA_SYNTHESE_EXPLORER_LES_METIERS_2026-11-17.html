<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : Ma synthèse (Explorer les métiers), version du 18/11/2026</title>
<link href="../vendor/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
/* Couleurs des six lettres : les mêmes que la maquette V2 du module (valeur claire ET sombre). La lettre est toujours écrite, jamais la couleur seule. */
:root{--ri-R:#b4540a;--ri-I:#1f7a4d;--ri-A:#b4233c;--ri-S:#6d4aa8;--ri-E:#0f6f8f;--ri-C:#7a6a00;--ri-txt:#fff}
[data-theme="sombre"]{--ri-R:#e8944f;--ri-I:#4cc38a;--ri-A:#f27a8f;--ri-S:#b79cf0;--ri-E:#52bfe0;--ri-C:#d6c24a;--ri-txt:#101418}
body{margin:0;background:var(--bg-page);color:var(--text-strong);font-family:"Segoe UI",Roboto,system-ui,sans-serif;padding:0 16px 7rem}
.mq-page{max-width:1000px;margin:0 auto;padding-top:1rem}
.mq-page.tel{max-width:390px}
.mq-regl{position:sticky;top:0;z-index:600;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.7rem .9rem;margin:.6rem auto 1rem;max-width:1100px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mq-regl h2{font-size:1rem;margin:0 0 .4rem;display:flex;align-items:center;gap:.5rem}
.mq-regl h2 button{margin-left:auto}
.mq-regl .grp{margin:.45rem 0}
.mq-regl .grp>b{display:block;font-size:.85rem;margin-bottom:.25rem}
.mq-regl .boutons{display:flex;flex-wrap:wrap;gap:.35rem}
.mq-regl .boutons button{font-size:.8rem}
.mq-rouvrir{position:fixed;top:8px;right:8px;z-index:610;display:none}
.mq-retient{background:var(--bg-subtle);border:1px dashed var(--border-strong);border-radius:8px;padding:.5rem .7rem;font-size:.85rem;margin-top:.5rem}
.mq-retient p{margin:.1rem 0}
.note{font-size:.85rem;color:var(--text-muted)}

.bloc{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;margin:.7rem 0}
.bloc h2,.bloc h3{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bloc h2 .bi,.bloc h3 .bi{color:var(--accent)}
.titre-page{font-size:var(--t-titre-page,1.9rem);font-weight:800;margin:.2rem 0 .4rem;text-align:center}
.sous-titre{text-align:center;color:var(--text-muted);margin-bottom:.6rem}
.encart{background:var(--accent-bg-subtle);border-left:3px solid var(--accent);border-radius:8px;padding:.7rem .9rem;margin:.7rem 0;display:flex;gap:.7rem;align-items:flex-start}
.encart.warn{background:var(--warning-bg-subtle);border-left-color:var(--warning-border)}
.encart i{color:var(--accent);font-size:1.3rem;margin-top:.1rem}
.encart p{margin:0}
.pill{display:inline-block;font-size:.8rem;padding:.12rem .6rem;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-strong);margin:.1rem .15rem .1rem 0}
.etat-pastille{font-size:.8rem;font-weight:700;padding:.12rem .6rem;border-radius:999px;margin-left:auto}
.etat-pastille.fait{background:var(--success-bg-subtle,#e6f4ea);color:var(--success,#1e6b3a);border:1px solid var(--success,#1e6b3a)}
.etat-pastille.afaire{background:var(--warning-bg-subtle);color:var(--warning-strong);border:1px solid var(--warning-border)}
.ri-p{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ri-c);color:var(--ri-txt);font-weight:800;font-size:.95rem;flex:none}
.ri-p.gros{width:52px;height:52px;font-size:1.5rem}
.ri-R{--ri-c:var(--ri-R)}.ri-I{--ri-c:var(--ri-I)}.ri-A{--ri-c:var(--ri-A)}.ri-S{--ri-c:var(--ri-S)}.ri-E{--ri-c:var(--ri-E)}.ri-C{--ri-c:var(--ri-C)}
.lettres{display:flex;gap:1rem 1.4rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.lettres div{display:flex;gap:.5rem;align-items:center;font-weight:700}
.ligne{display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--border);padding:.55rem 0}
.ligne:first-of-type{border-top:0}
.ligne .nom{font-weight:700}
.ligne .sub{font-size:.85rem;color:var(--text-muted)}
.boutons-ligne{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.boutons-ligne .btn{min-height:44px}
.dep{display:flex;gap:.5rem;flex-wrap:wrap;margin:.3rem 0 .6rem}
.dep .btn{min-height:44px}
.chiffre-cle{font-size:.85rem;color:var(--text-muted)}
.mini-plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.tel .mini-plan{grid-template-columns:1fr}
.mini-plan .carte{border:1px solid var(--border-strong);border-radius:12px;padding:.7rem .8rem;background:var(--bg-card)}
.mini-plan .carte h4{font-size:1rem;font-weight:800;margin:0 0 .3rem;display:flex;gap:.4rem;align-items:center}
.mini-plan .carte p{font-size:.85rem;margin:0 0 .4rem;color:var(--text-muted)}
.mini-plan .carte .btn{min-height:44px}
.feuille{background:#fff;color:#111;border:1px solid #bbb;border-radius:4px;max-width:720px;margin:.8rem auto;padding:1.6rem 1.8rem;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:Georgia,"Times New Roman",serif}
.feuille h1{font-size:1.5rem;margin:0 0 .2rem}
.feuille h2{font-size:1.1rem;margin:1rem 0 .3rem;border-bottom:1px solid #999;padding-bottom:.15rem}
.feuille p,.feuille li{font-size:.95rem;margin:.15rem 0}
.feuille .pied{font-size:.8rem;color:#555;border-top:1px solid #999;margin-top:1rem;padding-top:.4rem}
.feuille .ri-p{width:24px;height:24px;font-size:.8rem}
.barre-navigation-fixe{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-top:1px solid var(--border);padding:.5rem 1rem;z-index:500}
.barre-navigation-fixe .barre{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.m-fil{font-size:.85rem;color:var(--text-muted);text-align:center}
@media (max-width:640px){.mini-plan{grid-template-columns:1fr}}
.mini-plan.mini-plan4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.mini-plan.mini-plan4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.mini-plan.mini-plan4{grid-template-columns:1fr}}
.bloc h3.h6{font-size:1rem;margin:.8rem 0 .2rem}
.table-croise{width:100%;border-collapse:collapse;font-size:.9rem}
.table-croise th,.table-croise td{border-top:1px solid var(--border);padding:.45rem .5rem;text-align:left;vertical-align:middle}
.table-croise thead th{border-top:0;font-size:.8rem;color:var(--text-muted)}
.table-croise td .ri-p{margin-right:.2rem}
pre.demande{white-space:pre-wrap;word-break:break-word;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:.7rem .8rem;font-size:.85rem;max-height:24rem;overflow:auto;font-family:inherit}
.bloc h2 .num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.9rem;flex:none}
</style>
</head>
<body>
<button type="button" class="btn btn-outline-primary btn-sm mq-rouvrir" id="mqRouvrir"><i class="bi bi-sliders"></i> Réglages</button>

<div class="mq-regl" id="mqRegl">
  <h2><i class="bi bi-sliders"></i> Réglages de la maquette <button type="button" class="btn btn-outline-secondary btn-sm" id="mqFermer" aria-label="Fermer les réglages"><i class="bi bi-x-lg"></i></button></h2>
  <div class="grp"><b>Écran à voir</b>
    <div class="boutons" id="mqEcrans"></div>
  </div>
  <div class="grp"><b>Ce que la personne a déjà fait (exemple fictif)</b>
    <div class="boutons" id="mqRempl"></div>
  </div>
  <div class="grp"><b>Taille d’écran, thème</b>
    <div class="boutons">
      <button type="button" class="btn btn-sm btn-primary" id="mqLarge">Ordinateur</button>
      <button type="button" class="btn btn-sm btn-outline-primary" id="mqTel">Téléphone</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="mqTheme">Mode sombre</button>
    </div>
  </div>
  <div class="grp"><b>Points encore à trancher</b>
    <div class="boutons" id="mqVar"></div>
  </div>
  <div class="mq-retient" id="mqRetient"></div>
</div>

<div class="mq-page" id="mqPage"></div>
<div id="mqBas"></div>

<script>
/* ------------------------------------------------------------------
   Données d'exemple : les chiffres des deux départements sont les vrais (modules/comprendre-les-chiffres/donnees/bmo-metiers.json, enquête BMO 2026).
   Tout le reste (lettres, choix, métiers regardés) est FICTIF : c'est un exemple de personne.
   Version 2 (18/11/2026) : la synthèse tient compte des TROIS passages (Par un métier, Par ce que vous aimez faire, questionnaire de préférences) ;
   le quatrième chemin (Les emplois en demande) n'a pas de résultat personnel : il apporte du concret tout de suite (territoire, offres).
------------------------------------------------------------------ */
var DEP = {
  '24': { nom: 'Dordogne', metiers: [['Viticulteurs, arboriculteurs', 1447, 1383], ['Agriculteurs', 1212, 1145], ['Aides de cuisine et employés polyvalents de la restauration', 1098, 524]] },
  '87': { nom: 'Haute-Vienne', metiers: [['Agriculteurs', 692, 610], ['Aides de cuisine et employés polyvalents de la restauration', 500, 137], ['Aides-soignants', 407, 84]] }
};
/* Correspondance entre un métier de piste et une ligne de l'enquête (en vrai : la table CMR_FICHES_ENQUETE du module). */
var LIEN_ENQUETE = { 'Aide-soignant ou aide-soignante': 'Aides-soignants' };
var EXEMPLE = {
  lettres: [['S', 'Social'], ['A', 'Artistique']],
  pct: { S: 71, A: 58, E: 33, I: 21, C: 12, R: 8 },
  date: '17/11/2026',
  choix: { 'Avec qui ou avec quoi': ['Des enfants', 'Des personnes âgées', 'Des animaux'], 'Ce que j’aimerais faire': ['Écouter, conseiller', 'Créer, imaginer', 'Prendre soin'], 'Où': ['Dans un lieu calme', 'À l’intérieur et à l’extérieur'], 'Ce qui serait difficile': ['Travailler la nuit'] },
  regardes: ['Auxiliaire de puériculture', 'Aide-soignant ou aide-soignante'],
  metiers: [
    { nom: 'Auxiliaire de puériculture', lettres: 'SA', p2: '82 %', p3: true, p1: true },
    { nom: 'Animateur ou animatrice socioculturel', lettres: 'SA', p2: '78 %', p3: true, p1: false },
    { nom: 'Aide-soignant ou aide-soignante', lettres: 'SR', p2: '71 %', p3: true, p1: true }
  ]
};
var ETAT = { ecran: 'synthese', p1: true, p2: true, p3: true, lect: true, dep: '87', tel: false, sombre: false, vLect: true, vCroise: true, vConseil: true, vPlace: 'bas', regl: true };

function e(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function pastille(l, gros) { return '<span class="ri-p ri-' + l + (gros ? ' gros' : '') + '" aria-hidden="true">' + l + '</span>'; }
function nb(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function nbPassages() { return (ETAT.p1 ? 1 : 0) + (ETAT.p2 ? 1 : 0) + (ETAT.p3 ? 1 : 0); }
function pastilleEtat(fait) { return '<span class="etat-pastille ' + (fait ? 'fait' : 'afaire') + '">' + (fait ? 'Fait' : 'Pas encore fait') + '</span>'; }
function lieEnquete(m) { var d = DEP[ETAT.dep], cible = LIEN_ENQUETE[m.nom], r = null; if (!cible) { return null; } d.metiers.forEach(function (x) { if (x[0] === cible) { r = x; } }); return r; }
/* Les pistes affichées : celles qui apparaissent dans au moins un passage fait. */
function pistes() {
  return EXEMPLE.metiers.map(function (m) {
    var n = (ETAT.p1 && m.p1 ? 1 : 0) + (ETAT.p2 ? 1 : 0) + (ETAT.p3 && m.p3 ? 1 : 0);
    return { m: m, n: n };
  }).filter(function (x) { return x.n > 0; }).sort(function (a, b) { return b.n - a.n; });
}

/* ---------- Accueil du module : où apparaît « Ma synthèse » ---------- */
function ecranAccueil() {
  var h = '<h1 class="titre-page"><i class="bi bi-compass"></i> Explorer les métiers</h1><p class="sous-titre">Par où voulez-vous commencer ?</p>';
  h += '<div class="mini-plan mini-plan4">' +
    '<div class="carte"><h4><i class="bi bi-search"></i> Par un métier</h4><p>Cherchez un métier par son nom, un sigle ou son secteur.</p><button class="btn btn-primary" type="button">Chercher un métier</button></div>' +
    '<div class="carte"><h4><i class="bi bi-list-check"></i> Par ce que vous aimez faire</h4><p>Quatre pages de choix, puis des métiers proposés.</p><button class="btn btn-primary" type="button">' + (ETAT.p2 ? 'Revoir mes choix' : 'Choisir mes envies') + '</button></div>' +
    '<div class="carte"><h4><i class="bi bi-hexagon"></i> Par un questionnaire</h4><p>Quatre parties, à votre rythme.</p><button class="btn btn-primary" type="button">' + (ETAT.p3 ? 'Revoir mon résultat' : 'Voir le questionnaire') + '</button></div>' +
    '<div class="carte"><h4><i class="bi bi-briefcase"></i> Les emplois en demande</h4><p>Ce que les employeurs prévoient d’embaucher, et des offres près de chez vous.</p><button class="btn btn-primary" type="button">Voir les emplois</button></div></div>';
  if (nbPassages() > 0) {
    h += '<div class="bloc" style="margin-top:1rem"><h2><i class="bi bi-clipboard-check"></i> Ma synthèse</h2>' +
      '<p>Vous avez déjà ' + (nbPassages() === 1 ? 'un résultat' : nbPassages() + ' résultats') + ' : vous pouvez les rassembler sur une seule page, avec le territoire où vous cherchez, pour les garder ou en parler avec un conseiller.</p>' +
      '<div class="boutons-ligne"><button type="button" class="btn btn-primary" data-go="synthese"><i class="bi bi-clipboard-check"></i> Voir ma synthèse</button></div>' +
      '<p class="note mt-2 mb-0">NOUVEAU : ce bloc n’apparaît que s’il y a au moins un résultat. Sans résultat, rien ne change sur l’accueil du module. Le quatrième chemin (« Les emplois en demande ») ne compte pas comme un résultat : il ne dit rien sur vous.</p></div>';
  } else {
    h += '<p class="note" style="text-align:center;margin-top:1rem">Rien à rassembler pour l’instant : « Ma synthèse » apparaît ici dès que vous avez un résultat.</p>';
  }
  return h;
}

/* ---------- Blocs de la synthèse ---------- */
function blocPassage1() {
  var h = '<div class="bloc"><h2><i class="bi bi-search"></i> Passage 1 : les métiers que j’ai regardés ' + pastilleEtat(ETAT.p1) + '</h2>';
  if (ETAT.p1) {
    h += '<p class="note mb-1">Les métiers gardés comme Repère ou mis à comparer pendant votre exploration.</p>' +
      EXEMPLE.regardes.map(function (n) { return '<span class="pill">' + e(n) + '</span>'; }).join(' ') +
      '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary">Chercher un autre métier</button></div>';
  } else {
    h += '<p class="mb-1">Vous n’avez gardé ni comparé aucun métier pour l’instant. Ce n’est pas obligatoire.</p><div class="boutons-ligne"><button type="button" class="btn btn-primary">Chercher un métier</button></div>';
  }
  return h + '</div>';
}
function blocPassage2() {
  var h = '<div class="bloc"><h2><i class="bi bi-list-check"></i> Passage 2 : ce que j’aime faire ' + pastilleEtat(ETAT.p2) + '</h2>';
  if (ETAT.p2) {
    h += Object.keys(EXEMPLE.choix).map(function (k) { return '<p class="mb-1"><b>' + e(k) + ' :</b> ' + EXEMPLE.choix[k].map(function (x) { return '<span class="pill">' + e(x) + '</span>'; }).join(' ') + '</p>'; }).join('') +
      '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary">Modifier mes choix</button></div>';
  } else {
    h += '<p class="mb-1">Vous n’avez pas encore choisi ce que vous aimez faire. Ce n’est pas obligatoire.</p><div class="boutons-ligne"><button type="button" class="btn btn-primary">Choisir mes envies</button></div>';
  }
  return h + '</div>';
}
function blocPassage3() {
  var h = '<div class="bloc"><h2><i class="bi bi-hexagon"></i> Passage 3 : mes lettres ' + pastilleEtat(ETAT.p3) + '</h2>';
  if (ETAT.p3) {
    h += '<p class="note mb-1">Questionnaire passé le ' + EXEMPLE.date + '. Ce que vos réponses montrent aujourd’hui.</p><div class="lettres">' +
      EXEMPLE.lettres.map(function (l) { return '<div>' + pastille(l[0], true) + l[1] + '</div>'; }).join('') + '</div>' +
      '<p class="note mb-0">Les autres lettres comptent moins de 10 % dans vos réponses.</p>' +
      '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary">Revoir mon résultat en détail</button></div>';
  } else {
    h += '<p class="mb-1">Vous n’avez pas encore passé le questionnaire de préférences. Ce n’est pas obligatoire.</p><div class="boutons-ligne"><button type="button" class="btn btn-primary">Voir le questionnaire</button></div>';
  }
  return h + '</div>';
}
/* Recoupement par le code : aucun assistant. Les pistes qui reviennent dans plusieurs passages. */
function blocCroisement() {
  var n = nbPassages();
  if (n === 0) { return ''; }
  var h = '<div class="bloc"><h2><i class="bi bi-intersect"></i> Ce que mes passages ont en commun</h2>';
  if (n === 1) {
    return h + '<p class="mb-0">Un seul passage est fait : il n’y a pas encore de recoupement à montrer. Chaque passage ajouté rend cette page plus riche, sans jamais être obligatoire.</p></div>';
  }
  var liste = pistes();
  h += '<p class="note">Un métier qui revient dans plusieurs passages mérite d’être regardé de plus près. Ce n’est pas une note sur vous : c’est un recoupement.</p>' +
    '<div class="table-responsive"><table class="table-croise"><thead><tr><th scope="col">Métier</th>' +
    (ETAT.p1 ? '<th scope="col">Regardé</th>' : '') + (ETAT.p2 ? '<th scope="col">Mes choix</th>' : '') + (ETAT.p3 ? '<th scope="col">Mes lettres</th>' : '') + '<th scope="col">Revient dans</th></tr></thead><tbody>' +
    liste.map(function (x) {
      var m = x.m;
      return '<tr><th scope="row">' + e(m.nom) + '</th>' +
        (ETAT.p1 ? '<td>' + (m.p1 ? 'Oui' : 'Non') + '</td>' : '') +
        (ETAT.p2 ? '<td>Retrouve ' + m.p2 + ' de mes choix</td>' : '') +
        (ETAT.p3 ? '<td>' + (m.p3 ? m.lettres.split('').map(function (l) { return pastille(l); }).join('') : 'Non') + '</td>' : '') +
        '<td><b>' + x.n + ' passage' + (x.n > 1 ? 's' : '') + ' sur ' + n + '</b></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="note mt-2 mb-0">Le pourcentage dit seulement combien de vos choix le métier retrouve. Il ne mesure ni vos capacités ni vos chances.</p></div>';
  return h;
}
/* Lecture par l'assistant en ligne : facultative, même principe que les autres écrans « collez la réponse ». */
function blocLecture() {
  if (!ETAT.vLect || nbPassages() < 2) { return ''; }
  var h = '<div class="bloc"><h2><i class="bi bi-chat-square-quote"></i> Une lecture de mes passages ' + (ETAT.lect ? '<span class="etat-pastille fait">Faite</span>' : '<span class="etat-pastille afaire">Pas encore faite</span>') + '</h2>';
  if (!ETAT.lect) {
    h += '<p>Si vous le souhaitez, l’assistant en ligne peut lire vos ' + nbPassages() + ' passages ensemble et vous dire, avec des mots simples, ce qui se retrouve partout, ce qui diffère, et quelles pistes essayer en premier. C’est une aide, jamais un diagnostic.</p>' +
      '<div class="boutons-ligne"><button type="button" class="btn btn-primary" data-go="demande"><i class="bi bi-clipboard-plus"></i> Préparer ma demande</button></div>' +
      '<p class="note mt-2 mb-0">Rien n’est envoyé par cette application : vous copiez la demande, vous la collez dans l’assistant de votre choix, puis vous collez sa réponse ici.</p>';
  } else {
    h += '<p class="note mb-2">Lecture de l’assistant en ligne, reçue le ' + EXEMPLE.date + '. Elle s’appuie seulement sur vos résultats. À relire avec un conseiller.</p>' +
      '<h3 class="h6">Ce qui se retrouve partout</h3><p>Le contact avec les personnes, plus précisément les plus jeunes et les plus âgées, revient dans vos choix, dans vos lettres et dans les métiers que vous avez regardés.</p>' +
      '<h3 class="h6">Ce qui diffère</h3><p>Vos choix parlent de calme et de création, alors que le métier d’aide-soignant demande parfois des horaires de nuit, que vous avez écartés. Ce n’est pas une contradiction : c’est un point à regarder de près.</p>' +
      '<h3 class="h6">Trois pistes à essayer en premier</h3><ol><li>Auxiliaire de puériculture : elle revient dans les trois passages.</li><li>Animateur ou animatrice socioculturel : proche de vos choix de création.</li><li>Un stage d’observation de quelques jours pour vérifier ce que ces métiers demandent vraiment.</li></ol>' +
      '<h3 class="h6">Questions à poser à un conseiller</h3><ul><li>Quelle formation, et de quel niveau, pour la première piste près de chez moi ?</li><li>Comment tester le métier avant de m’engager ?</li></ul>' +
      '<p class="note mb-0"><i class="bi bi-info-circle"></i> Cette lecture n’est pas un avis sur vous. Elle ne remplace pas un rendez-vous.</p>' +
      '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary" data-go="demande">Refaire la lecture</button><button type="button" class="btn btn-outline-secondary">Effacer cette lecture</button></div>';
  }
  return h + '</div>';
}
/* Quatrième chemin : du concret tout de suite. */
function blocDepartement() {
  var d = DEP[ETAT.dep];
  var h = '<div class="bloc"><h2><i class="bi bi-briefcase"></i> Chez moi : ce qui recrute</h2>' +
    '<p>Ce quatrième chemin ne dit rien sur vous : il donne du concret tout de suite. Dites où vous cherchez, les métiers que les employeurs citent le plus s’affichent.</p>' +
    '<div class="dep" role="group" aria-label="Département">' +
    ['24', '87'].map(function (c) { return '<button type="button" class="btn ' + (c === ETAT.dep ? 'btn-primary' : 'btn-outline-primary') + '" data-dep="' + c + '" aria-pressed="' + (c === ETAT.dep) + '">' + DEP[c].nom + '</button>'; }).join('') + '</div>' +
    d.metiers.map(function (m) {
      return '<div class="ligne"><div><div class="nom">' + e(m[0]) + '</div><div class="sub">Au moins ' + nb(m[1]) + ' projets, dont au moins ' + nb(m[2]) + ' saisonniers (' + Math.round(m[2] / m[1] * 100) + ' %).</div></div></div>';
    }).join('') +
    '<p class="note mt-2">Ce sont des intentions d’employeurs, pas des embauches garanties. Source : France Travail, enquête Besoins en main-d’œuvre 2026.</p>';
  if (ETAT.vCroise && nbPassages() > 0) {
    var avec = pistes().map(function (x) { return { m: x.m, l: lieEnquete(x.m) }; }).filter(function (x) { return x.l; });
    h += '<div class="encart"><i class="bi bi-geo-alt"></i><div><p><b>Vos pistes et ' + d.nom + '</b></p>' +
      (avec.length ? '<ul class="mb-1">' + avec.map(function (x) { return '<li>' + e(x.m.nom) + ' : au moins ' + nb(x.l[1]) + ' projets de recrutement annoncés (« ' + e(x.l[0]) + ' »).</li>'; }).join('') + '</ul>' : '<p class="mb-1">Aucune de vos pistes ne figure parmi les trois métiers les plus cités ici. Cela ne veut pas dire qu’on n’y recrute pas : la liste complète est dans « Les emplois en demande ».</p>') +
      '<p class="note mb-0">En vrai, le recoupement se fait avec la liste complète de l’enquête, pas seulement ces trois lignes.</p></div></div>';
  }
  h += '<div class="boutons-ligne"><button type="button" class="btn btn-outline-secondary"><i class="bi bi-graph-up"></i> Voir tous les emplois en demande</button>' +
    '<button type="button" class="btn btn-primary"><i class="bi bi-search"></i> Chercher des offres pour mes pistes</button></div>' +
    '<p class="note mt-2 mb-0">« Chercher des offres » reprend l’écran déjà construit (jusqu’à cinq métiers cochés, ici déjà proposés d’après vos pistes), puis votre territoire.</p></div>';
  return h;
}
function blocConseiller() {
  if (!ETAT.vConseil) { return ''; }
  return '<div class="bloc"><h2><i class="bi bi-chat-square-text"></i> À voir avec un conseiller</h2>' +
    '<p>Quelques questions pour préparer un rendez-vous. Elles sont écrites d’après ce que vous avez trouvé' + (ETAT.lect && ETAT.vLect ? ', et complétées par la lecture ci-dessus' : '') + '.</p><ul class="mb-0">' +
    (ETAT.p3 ? '<li>Ces lettres (' + EXEMPLE.lettres.map(function (l) { return l[1]; }).join(', ') + ') vous ressemblent-elles ? Qu’en pense la personne qui vous accompagne ?</li>' : '') +
    (nbPassages() > 0 ? '<li>Parmi ces pistes, laquelle pourrait être essayée en stage d’observation ?</li>' : '') +
    '<li>Quelles formations ou quels niveaux demandent ces métiers, près de chez vous (' + DEP[ETAT.dep].nom + ') ?</li>' +
    (ETAT.p2 ? '<li>Qu’est-ce qui, dans vos choix, serait difficile à trouver dans ces métiers ?</li>' : '') + '</ul></div>';
}
function ecranSynthese() {
  var h = '<h1 class="titre-page"><i class="bi bi-clipboard-check"></i> Ma synthèse</h1>' +
    '<p class="sous-titre">Ce que vous avez trouvé dans « Explorer les métiers », sur une seule page</p>' +
    '<div class="encart"><i class="bi bi-shield-check"></i><p>Cette page rassemble vos résultats pour vous aider à y voir clair. Ce n’est pas un diagnostic, ni une orientation : ce sont des pistes. Rien n’est envoyé : tout reste sur cet appareil.</p></div>';
  if (ETAT.vPlace === 'haut') { h += blocDepartement(); }
  h += blocPassage1() + blocPassage2() + blocPassage3() + blocCroisement() + blocLecture();
  if (ETAT.vPlace === 'bas') { h += blocDepartement(); }
  h += blocConseiller();
  h += '<div class="bloc"><h2><i class="bi bi-box-arrow-down"></i> Garder ou partager cette page</h2>' +
    '<p>Rien n’est conservé sans votre accord.</p><div class="boutons-ligne">' +
    '<button type="button" class="btn btn-outline-primary"><i class="bi bi-save"></i> Garder dans la disquette</button>' +
    '<button type="button" class="btn btn-outline-primary" data-go="impression"><i class="bi bi-printer"></i> Imprimer ou enregistrer en PDF</button></div>' +
    '<p class="note mt-2 mb-0">La version imprimée est une feuille simple, sans boutons, à donner à un conseiller si vous le souhaitez.</p></div>';
  return h;
}

/* ---------- La demande à l'assistant en ligne ---------- */
function texteDemande() {
  var d = DEP[ETAT.dep], t = [];
  t.push('Vous êtes un conseiller en insertion professionnelle, bienveillant et clair. Une personne a exploré des métiers avec l’application APP. Voici ses résultats, tels que l’application les a produits. Aidez-la à y voir clair.');
  t.push('');
  if (ETAT.p1) { t.push('PASSAGE 1, métiers regardés : ' + EXEMPLE.regardes.join(' ; ') + '.'); }
  if (ETAT.p2) { t.push('PASSAGE 2, ce que la personne aime faire (ses choix) : ' + Object.keys(EXEMPLE.choix).map(function (k) { return k + ' : ' + EXEMPLE.choix[k].join(', '); }).join(' ; ') + '. Métiers les plus proches de ces choix : ' + EXEMPLE.metiers.map(function (m) { return m.nom + ' (retrouve ' + m.p2 + ' des choix)'; }).join(' ; ') + '.'); }
  if (ETAT.p3) { t.push('PASSAGE 3, questionnaire de préférences (six types, en pourcentage de ses réponses) : ' + Object.keys(EXEMPLE.pct).map(function (l) { return l + ' ' + EXEMPLE.pct[l] + ' %'; }).join(', ') + '. Types dominants : ' + EXEMPLE.lettres.map(function (l) { return l[1]; }).join(' puis ') + '. Ce questionnaire dit des préférences, pas des compétences.'); }
  t.push('TERRITOIRE, ' + d.nom + ', ce que les employeurs prévoient d’embaucher (France Travail, enquête Besoins en main-d’œuvre 2026, intentions et non embauches garanties) : ' + d.metiers.map(function (m) { return m[0] + ' (au moins ' + nb(m[1]) + ' projets)'; }).join(' ; ') + '.');
  t.push('');
  t.push('CONSIGNES : ne posez aucun diagnostic sur la personne et ne dites jamais qui elle est ; parlez de pistes et de recoupements. Employez des mots simples et des phrases courtes. N’inventez aucune offre, aucun salaire, aucun diplôme : si vous n’êtes pas sûr, dites-le. Si les résultats se contredisent, dites-le avec douceur : c’est normal et utile. Répondez avec exactement ces cinq titres : « Ce qui se retrouve partout », « Ce qui diffère », « Trois pistes à essayer en premier », « Questions à poser à un conseiller », « Ce qu’il faut garder en tête ».');
  return t.join('\n');
}
function ecranDemande() {
  return '<h1 class="titre-page"><i class="bi bi-clipboard-plus"></i> Ma demande à l’assistant en ligne</h1>' +
    '<p class="sous-titre">Trois gestes : copier, coller dans l’assistant, rapporter sa réponse</p>' +
    '<div class="encart"><i class="bi bi-shield-check"></i><p>La demande ne contient ni votre nom ni aucune de vos réponses : seulement vos résultats. Vous pouvez la relire avant de la copier.</p></div>' +
    '<div class="bloc"><h2><span class="num">1</span> Copiez la demande</h2><pre class="demande">' + e(texteDemande()) + '</pre>' +
    '<div class="boutons-ligne"><button type="button" class="btn btn-primary"><i class="bi bi-clipboard"></i> Copier la demande</button></div></div>' +
    '<div class="bloc"><h2><span class="num">2</span> Collez-la dans l’assistant</h2><p>Ouvrez l’assistant de votre choix, collez la demande, attendez sa réponse, puis copiez-la.</p>' +
    '<div class="boutons-ligne"><button type="button" class="btn btn-outline-primary"><i class="bi bi-box-arrow-up-right"></i> Ouvrir l’assistant</button></div></div>' +
    '<div class="bloc"><h2><span class="num">3</span> Collez sa réponse ici</h2><textarea class="form-control" rows="5" aria-label="Réponse de l’assistant" placeholder="Collez ici la réponse de l’assistant"></textarea>' +
    '<div class="boutons-ligne"><button type="button" class="btn btn-primary" data-lect="1">Ajouter à ma synthèse</button></div>' +
    '<p class="note mt-2 mb-0">Si la réponse n’a pas exactement les cinq titres, elle s’affiche quand même telle quelle : rien n’est perdu.</p></div>';
}

/* ---------- La feuille imprimée (aperçu) ---------- */
function ecranImpression() {
  var d = DEP[ETAT.dep];
  var h = '<p class="m-fil">Aperçu de la feuille imprimée (noir sur blanc, sans boutons)</p><div class="feuille">' +
    '<h1>Ma synthèse : Explorer les métiers</h1><p>Établie le ' + EXEMPLE.date + '. Document personnel : ce sont des pistes de réflexion, pas un diagnostic.</p>';
  if (ETAT.p1) { h += '<h2>Métiers regardés</h2><p>' + EXEMPLE.regardes.map(e).join(' ; ') + '.</p>'; }
  if (ETAT.p2) { h += '<h2>Ce que j’aime faire</h2><ul>' + Object.keys(EXEMPLE.choix).map(function (k) { return '<li><b>' + e(k) + ' :</b> ' + EXEMPLE.choix[k].map(e).join(', ') + '</li>'; }).join('') + '</ul>'; }
  if (ETAT.p3) { h += '<h2>Mes lettres</h2><p>' + EXEMPLE.lettres.map(function (l) { return '<b>' + l[0] + '</b> ' + l[1]; }).join(' ; ') + '. Questionnaire passé le ' + EXEMPLE.date + '. Les autres lettres comptent moins de 10 %.</p>'; }
  if (nbPassages() > 1) { h += '<h2>Ce que mes passages ont en commun</h2><ul>' + pistes().map(function (x) { return '<li>' + e(x.m.nom) + ' : revient dans ' + x.n + ' passage' + (x.n > 1 ? 's' : '') + ' sur ' + nbPassages() + '</li>'; }).join('') + '</ul>'; }
  if (ETAT.lect && ETAT.vLect && nbPassages() > 1) { h += '<h2>Lecture de l’assistant en ligne</h2><p>Trois pistes à essayer en premier : auxiliaire de puériculture, animateur ou animatrice socioculturel, un stage d’observation. Lecture à relire avec un conseiller ; ce n’est pas un avis sur la personne.</p>'; }
  h += '<h2>Où je cherche : ' + d.nom + '</h2><ul>' + d.metiers.map(function (m) { return '<li>' + e(m[0]) + ' : au moins ' + nb(m[1]) + ' projets de recrutement, dont au moins ' + nb(m[2]) + ' saisonniers</li>'; }).join('') + '</ul><p>Intentions d’employeurs, pas des embauches garanties. Source : France Travail, enquête Besoins en main-d’œuvre 2026.</p>';
  if (ETAT.vConseil) { h += '<h2>À voir avec mon conseiller</h2><ul><li>Ces pistes me ressemblent-elles ?</li><li>Laquelle pourrait être essayée en stage d’observation ?</li><li>Quelles formations près de chez moi ?</li></ul>'; }
  h += '<div class="pied">Rien n’a été envoyé : cette feuille a été produite sur l’appareil de la personne.</div></div>' +
    '<div class="boutons-ligne" style="justify-content:center"><button type="button" class="btn btn-primary"><i class="bi bi-printer"></i> Lancer l’impression</button><button type="button" class="btn btn-outline-secondary" data-go="synthese">Retour à ma synthèse</button></div>';
  return h;
}

var ECRANS = [['accueil', 'Accueil du module'], ['synthese', 'Ma synthèse'], ['demande', 'Demande à l’assistant'], ['impression', 'Feuille imprimée']];
var TOGGLES = [['p1', 'Passage 1 : métiers regardés'], ['p2', 'Passage 2 : mes choix'], ['p3', 'Passage 3 : questionnaire'], ['lect', 'Lecture de l’assistant collée']];
var RETIENT = {
  accueil: ['NOUVEAU : un bloc « Ma synthèse » sur l’accueil du module, seulement quand il y a au moins un résultat. Sans résultat, l’accueil reste comme aujourd’hui.', 'Les quatre cartes ne changent pas. Le quatrième chemin n’est jamais un « résultat » : il ne dit rien sur la personne.'],
  synthese: ['Trois passages = trois blocs qui disent chacun « Fait » ou « Pas encore fait », sans jamais obliger. Le quatrième chemin (ce qui recrute chez moi) donne du concret tout de suite.', 'Le recoupement « Ce que mes passages ont en commun » est calculé par le code : aucun assistant, aucune interprétation hasardeuse. Un métier qui revient dans plusieurs passages remonte.', 'La lecture de l’assistant en ligne est FACULTATIVE : un bouton propose de préparer la demande. Elle ne s’ajoute qu’avec l’accord de la personne et reste étiquetée « à relire avec un conseiller ».', 'Le territoire est demandé ICI, jamais avant les tests (consigne 432).', 'La page est assemblée par le code à partir de ce qui existe : résultat du questionnaire, choix, métiers gardés ou comparés, enquête de l’emploi.'],
  demande: ['Même principe que les autres écrans de l’application : copier, coller dans l’assistant, rapporter la réponse (composant « collez la réponse » partagé).', 'La demande ne contient jamais une réponse du questionnaire ni un nom : seulement les résultats (pourcentages par type, choix, métiers regardés, chiffres du territoire).', 'Consignes écrites pour une personne fragile : aucun diagnostic, ni salaire ni offre inventés, les contradictions dites avec douceur.'],
  impression: ['Une feuille simple, noir sur blanc, sans boutons, qu’on peut donner à un conseiller. Produite sur l’appareil : rien n’est envoyé.', 'Elle ne reprend que ce que la personne a déjà fait, y compris la lecture si elle est faite.']
};
var VARIABLES = [
  ['vLect', 'Lecture par l’assistant en ligne', [[true, 'Oui, facultative (recommandé)'], [false, 'Non, le code seul']]],
  ['vCroise', 'Pistes recoupées avec ce qui recrute', [[true, 'Oui (recommandé)'], [false, 'Non']]],
  ['vPlace', 'Place du territoire', [['bas', 'Avant les questions (recommandé)'], ['haut', 'En haut de la page']]],
  ['vConseil', 'Questions pour un conseiller', [[true, 'Oui (recommandé)'], [false, 'Non']]]
];

function barre() {
  var e2 = ETAT.ecran, retour = { synthese: 'accueil', demande: 'synthese', impression: 'synthese' }[e2];
  return '<div class="barre-navigation-fixe"><div class="barre"><span>' + (retour ? '<button class="btn btn-nav-erip btn-lg" data-go="' + retour + '">&#8592; Retour</button>' : '') + '</span>' +
    '<button class="btn btn-nav-erip btn-accueil" type="button"><i class="bi bi-house-door" aria-hidden="true"></i> Accueil</button><span></span></div></div>';
}
function rendre() {
  document.documentElement.setAttribute('data-theme', ETAT.sombre ? 'sombre' : 'clair');
  var p = document.getElementById('mqPage');
  p.className = 'mq-page' + (ETAT.tel ? ' tel' : '');
  p.innerHTML = ETAT.ecran === 'accueil' ? ecranAccueil() : (ETAT.ecran === 'impression' ? ecranImpression() : (ETAT.ecran === 'demande' ? ecranDemande() : ecranSynthese()));
  document.getElementById('mqBas').innerHTML = barre();
  document.getElementById('mqEcrans').innerHTML = ECRANS.map(function (x) { return '<button type="button" class="btn btn-sm ' + (x[0] === ETAT.ecran ? 'btn-primary' : 'btn-outline-primary') + '" data-go="' + x[0] + '">' + x[1] + '</button>'; }).join('');
  document.getElementById('mqRempl').innerHTML = TOGGLES.map(function (x) { return '<button type="button" class="btn btn-sm ' + (ETAT[x[0]] ? 'btn-primary' : 'btn-outline-secondary') + '" data-tog="' + x[0] + '" aria-pressed="' + ETAT[x[0]] + '">' + (ETAT[x[0]] ? '✓ ' : '') + x[1] + '</button>'; }).join('');
  document.getElementById('mqVar').innerHTML = VARIABLES.map(function (v) {
    return '<span class="note">' + v[1] + ' :</span> ' + v[2].map(function (o) { return '<button type="button" class="btn btn-sm ' + (ETAT[v[0]] === o[0] ? 'btn-primary' : 'btn-outline-secondary') + '" data-var="' + v[0] + '" data-val="' + o[0] + '">' + o[1] + '</button>'; }).join(' ') + '<br>';
  }).join('');
  document.getElementById('mqRetient').innerHTML = '<b>Ce que cet écran retient</b>' + (RETIENT[ETAT.ecran] || []).map(function (t) { return '<p>• ' + t + '</p>'; }).join('');
  document.getElementById('mqLarge').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-outline-primary' : 'btn-primary');
  document.getElementById('mqTel').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-primary' : 'btn-outline-primary');
  document.getElementById('mqTheme').textContent = ETAT.sombre ? 'Mode clair' : 'Mode sombre';
  document.getElementById('mqRegl').style.display = ETAT.regl ? '' : 'none';
  document.getElementById('mqRouvrir').style.display = ETAT.regl ? 'none' : 'inline-flex';
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-go],[data-dep],[data-tog],[data-var],[data-lect]');
  if (!t) { return; }
  if (t.dataset.go) { ETAT.ecran = t.dataset.go; window.scrollTo(0, 0); }
  if (t.dataset.dep) { ETAT.dep = t.dataset.dep; }
  if (t.dataset.tog) { ETAT[t.dataset.tog] = !ETAT[t.dataset.tog]; }
  if (t.dataset.lect) { ETAT.lect = true; ETAT.ecran = 'synthese'; window.scrollTo(0, 0); }
  if (t.dataset.var) { var v = t.dataset.val; ETAT[t.dataset.var] = (v === 'true' ? true : (v === 'false' ? false : v)); }
  rendre();
});
document.getElementById('mqLarge').onclick = function () { ETAT.tel = false; rendre(); };
document.getElementById('mqTel').onclick = function () { ETAT.tel = true; rendre(); };
document.getElementById('mqTheme').onclick = function () { ETAT.sombre = !ETAT.sombre; rendre(); };
document.getElementById('mqFermer').onclick = function () { ETAT.regl = false; rendre(); };
document.getElementById('mqRouvrir').onclick = function () { ETAT.regl = true; rendre(); };
rendre();
</script>
</body>
</html>
