<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : les chemins 2, 3 et 4 d’Explorer les métiers, version 2 du 18/11/2026</title>
<link href="../vendor/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
/* VERSION 2 (consigne 477) : plus de couleur propre à chaque partie. Tout reprend l'accent choisi par la personne (data-accent : bleu, orange, vert, violet, turquoise, framboise)
   avec les trois jetons déjà prévus par l'application : --accent (bords, texte, jauge), --accent-bg-subtle (fonds teintés), --accent-solide (fonds pleins sous texte blanc). */
:root{--cmp-txt:#fff}
.p0,.p1,.p2,.p3,.p4{--pc:var(--accent);--pc-bg:var(--accent-bg-subtle);--pc-solide:var(--accent-solide)}
.ri-S,.ri-R,.ri-I,.ri-A,.ri-E,.ri-C{}
:root{--ri-R:#b4540a;--ri-I:#1f7a4d;--ri-A:#b4233c;--ri-S:#6d4aa8;--ri-E:#0f6f8f;--ri-C:#7a6a00;--ri-txt:#fff}
[data-theme="sombre"]{--ri-R:#e8944f;--ri-I:#4cc38a;--ri-A:#f27a8f;--ri-S:#b79cf0;--ri-E:#52bfe0;--ri-C:#d6c24a;--ri-txt:#101418}

body{margin:0;background:var(--bg-page);color:var(--text-strong);font-family:"Segoe UI",Roboto,system-ui,sans-serif;padding:0 16px 7rem}
.mq-page{max-width:1000px;margin:0 auto;padding-top:1rem}
.mq-page.tel{max-width:390px}
.mq-regl{position:sticky;top:0;z-index:600;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.7rem .9rem;margin:.6rem auto 1rem;max-width:1100px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-height:78vh;overflow:auto}
.mq-regl h2{font-size:1rem;margin:0 0 .4rem;display:flex;align-items:center;gap:.5rem}
.mq-regl h2 button{margin-left:auto}
.mq-regl .grp{margin:.45rem 0}
.mq-regl .grp>b{display:block;font-size:.85rem;margin-bottom:.25rem}
.mq-regl .boutons{display:flex;flex-wrap:wrap;gap:.35rem}
.mq-regl .boutons button{font-size:.8rem}
.mq-rouvrir{position:fixed;top:8px;right:8px;z-index:610;display:none}
.mq-retient{background:var(--bg-subtle);border:1px dashed var(--border-strong);border-radius:8px;padding:.5rem .7rem;font-size:.85rem;margin-top:.5rem}
.mq-retient p{margin:.1rem 0}
.note{font-size:.85rem;color:var(--text-muted)}
.titre-page{font-size:var(--t-titre-page,1.9rem);font-weight:800;margin:.2rem 0 .1rem;text-align:center}
.sous-titre{text-align:center;color:var(--text-muted);margin-bottom:.6rem}
.bloc{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;margin:.7rem 0}
.bloc h2,.bloc h3{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.encart{background:var(--accent-bg-subtle);border-left:3px solid var(--accent);border-radius:8px;padding:.7rem .9rem;margin:.7rem 0;display:flex;gap:.7rem;align-items:flex-start}
.encart.warn{background:var(--warning-bg-subtle);border-left-color:var(--warning-border)}
.encart i{color:var(--accent);font-size:1.3rem;margin-top:.1rem}.encart.warn i{color:var(--warning-strong)}
.encart p{margin:0}.encart>div{flex:1}
.pill{display:inline-block;font-size:.8rem;padding:.12rem .6rem;border-radius:999px;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-strong);margin:.1rem .15rem .1rem 0}
.pill.pc{background:var(--pc-bg);border-color:var(--pc);font-weight:600}
.ri-p{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ri-c);color:var(--ri-txt);font-weight:800;font-size:.85rem;flex:none}
.ri-R{--ri-c:var(--ri-R)}.ri-I{--ri-c:var(--ri-I)}.ri-A{--ri-c:var(--ri-A)}.ri-S{--ri-c:var(--ri-S)}.ri-E{--ri-c:var(--ri-E)}.ri-C{--ri-c:var(--ri-C)}
.barre-navigation-fixe{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-top:1px solid var(--border);padding:.5rem 1rem;z-index:500}
.barre-navigation-fixe .barre{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.barre-navigation-fixe .barre{flex-wrap:wrap}
.barre-navigation-fixe .msg{order:-1;flex:1 1 100%;text-align:center;font-size:.85rem;color:var(--warning-strong);background:var(--warning-bg-subtle);border:1px solid var(--warning-border);border-radius:8px;padding:.25rem .6rem}
.tag-nouveau{font-size:.72rem;font-weight:700;padding:.08rem .5rem;border-radius:6px;background:var(--bg-subtle);border:1px dashed var(--border-strong);color:var(--text-muted);margin-left:.4rem;white-space:nowrap}

/* ---- Fil des parties : quatre tuiles numérotées, une couleur par partie (remplace les quatre barres grises) ---- */
.fil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin:.6rem 0}
.tel .fil{grid-template-columns:repeat(2,minmax(0,1fr))}
.fil-t{display:flex;gap:.55rem;align-items:center;text-align:left;border:2px solid var(--border);border-radius:12px;background:var(--bg-card);color:var(--text-strong);padding:.45rem .6rem;min-height:56px;font-size:.9rem;line-height:1.15}
.fil-t .num{flex:none;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;background:var(--bg-subtle);color:var(--text-muted);border:1px solid var(--border-strong)}
.fil-t small{display:block;color:var(--text-muted);font-size:.78rem}
.fil-t.fait{border-color:var(--pc);background:var(--pc-bg);cursor:pointer}
.fil-t.fait .num{background:var(--pc-solide);color:#fff;border-color:var(--pc)}
.fil-t.encours{border-color:var(--pc);background:var(--pc-bg);box-shadow:0 0 0 3px var(--pc-bg),0 0 0 4px var(--pc);font-weight:800}
.fil-t.encours .num{background:var(--pc-solide);color:#fff;border-color:var(--pc)}
.fil-t.avenir{opacity:.8}

/* ---- Bandeau de partie ---- */
.bandeau{display:flex;gap:.9rem;align-items:center;border:2px solid var(--pc);border-left-width:8px;border-radius:14px;background:var(--pc-bg);padding:.8rem 1rem;margin:.6rem 0}
.bandeau .num{flex:none;width:52px;height:52px;border-radius:12px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem}
.bandeau h2{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0 0 .15rem}
.bandeau p{margin:0}
.bandeau.petit{padding:.5rem .8rem}.bandeau.petit .num{width:40px;height:40px;font-size:1.4rem}.bandeau.petit h2{font-size:1.05rem;margin:0}

/* ---- Suivi des choix (compteur + barre + plateau) ---- */
.suivi{border:1px solid var(--border-strong);border-radius:14px;background:var(--bg-card);padding:.7rem .9rem;margin:.6rem 0}
.suivi .haut{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.suivi .n{font-size:1.5rem;font-weight:800;color:var(--pc);margin-right:.2rem}
.jauge{height:12px;border-radius:7px;background:var(--bg-subtle);border:1px solid var(--border);overflow:hidden;margin:.45rem 0}
.jauge i{display:block;height:100%;background:var(--pc);transition:width .25s}
.plateau{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.3rem;min-height:36px}
.plateau .vide{font-size:.88rem;color:var(--text-muted)}
.chip-x{display:inline-flex;align-items:center;gap:.3rem;background:var(--pc-bg);border:1px solid var(--pc);color:var(--text-strong);border-radius:999px;padding:.15rem .25rem .15rem .7rem;font-size:.88rem}
.chip-x button{border:0;background:transparent;color:var(--text-strong);min-width:30px;min-height:30px;border-radius:50%;font-size:1rem;line-height:1}
.chip-x button:hover{background:var(--bg-subtle)}

/* ---- Famille de choix : carte à bord coloré, icône objet, pastille de compte ---- */
.famille{background:var(--bg-card);border:1px solid var(--border);border-left:8px solid var(--pc);border-radius:14px;padding:.9rem 1rem;margin:.7rem 0}
.famille .tete{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.famille .ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--pc-bg);color:var(--pc);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid var(--pc)}
.famille h3{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0}
.famille .compte{margin-left:auto;font-size:.82rem;font-weight:700;padding:.1rem .6rem;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-subtle);color:var(--text-muted)}
.famille .compte.a{background:var(--pc-solide);border-color:var(--pc-solide);color:#fff}
.famille .expl{margin:.4rem 0 .6rem}
.jetons{display:flex;flex-wrap:wrap;gap:.45rem}
.jt{border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);padding:.35rem .8rem;min-height:44px;font-size:.95rem;display:inline-flex;align-items:center;gap:.4rem;text-align:left}
.jt:hover:not(:disabled){border-color:var(--pc);background:var(--pc-bg)}
.jt .bi{display:none}
.jt.on{background:var(--pc-solide);border-color:var(--pc-solide);color:#fff;font-weight:700}
.jt.on .bi{display:inline}
.jt:disabled{opacity:.45}
.jt:focus-visible,.fil-t:focus-visible,.rep:focus-visible,.fd button:focus-visible{outline:3px solid var(--pc,var(--accent));outline-offset:2px}

/* ---- Facile / difficile ---- */
.cond-ligne{display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--border);padding:.5rem 0}
.cond-ligne:first-of-type{border-top:0}
.fd{display:inline-flex;gap:.35rem}
.fd button{border:2px solid var(--border-strong);background:var(--bg-card);color:var(--text-strong);border-radius:10px;min-height:44px;padding:.3rem .9rem;font-weight:600;display:inline-flex;gap:.35rem;align-items:center}
.fd button .bi{display:none}
.fd button.fac.on{background:var(--success-bg-subtle);border-color:var(--success);color:var(--text-strong);font-weight:800}
.fd button.dif.on{background:var(--warning-bg-subtle);border-color:var(--warning);color:var(--text-strong);font-weight:800}
.fd button.on .bi{display:inline}

/* ---- Résultats du chemin 2 ---- */
.ligne-choix{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);padding:.5rem 0}
.ligne-choix:first-of-type{border-top:0}
.ligne-choix .lib{flex:none;min-width:11rem;font-weight:800;display:flex;gap:.45rem;align-items:center}
.ligne-choix .lib .num{width:26px;height:26px;border-radius:7px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.ligne-choix .pills{flex:1}
.grille-m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.tel .grille-m{grid-template-columns:1fr}
.carte-m{border:1px solid var(--border-strong);border-radius:14px;background:var(--bg-card);padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem}
.carte-m h4{font-size:1.1rem;font-weight:800;margin:0}
.carte-m.premiere{grid-column:1/-1;border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-bg-subtle)}
.etiquette{align-self:flex-start;font-size:.78rem;font-weight:800;background:var(--accent);color:var(--bg-card);padding:.08rem .6rem;border-radius:6px}
.pct{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center}
.pct .piste{height:14px;border-radius:7px;background:var(--bg-subtle);border:1px solid var(--border);overflow:hidden}
.pct .piste span{display:block;height:100%;background:var(--accent)}
.lettres{display:flex;gap:.3rem}
.pourquoi{background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:.55rem .75rem}
.pourquoi p{margin:.2rem 0;font-size:.92rem}
.pourquoi .bi{margin-right:.3rem}
.ligne-boutons{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.ligne-boutons .btn{min-height:44px}

/* ---- Chemin 3 : questionnaire ---- */
.rassure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.6rem 0}
.tel .rassure{grid-template-columns:1fr}
.rassure .r{border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-card);padding:.65rem .8rem;display:flex;gap:.65rem;align-items:flex-start}
.rassure .r .ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-bg-subtle);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;border:1px solid var(--accent)}
.rassure .r b{display:block}
.rassure .r span{font-size:.9rem;color:var(--text-muted)}
.parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.tel .parties{grid-template-columns:1fr}
.partie-t{display:flex;gap:.7rem;align-items:flex-start;border:2px solid var(--pc);border-left-width:8px;border-radius:12px;background:var(--pc-bg);padding:.65rem .8rem}
.partie-t .num{flex:none;width:40px;height:40px;border-radius:10px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem}
.partie-t b{display:block}
.partie-t span{font-size:.88rem;color:var(--text-muted)}
.partie-t.fait .num{box-shadow:0 0 0 3px var(--pc-bg),0 0 0 4px var(--pc)}
.avancee{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:.4rem 0 .2rem;font-size:.9rem}
.segments{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:.2rem 0 .6rem}
.segments i{height:8px;border-radius:4px;background:var(--bg-subtle);border:1px solid var(--border)}
.segments i.r{background:var(--pc);border-color:var(--pc)}
.q{display:grid;grid-template-columns:auto 1fr;gap:.5rem .8rem;align-items:start;background:var(--bg-card);border:1px solid var(--border);border-left:6px solid var(--border-strong);border-radius:12px;padding:.65rem .8rem;margin:.5rem 0}
.q.fait{border-left-color:var(--pc);background:var(--pc-bg)}
.q .num{width:34px;height:34px;border-radius:9px;background:var(--bg-subtle);border:1px solid var(--border-strong);color:var(--text-strong);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.q.fait .num{background:var(--pc-solide);border-color:var(--pc-solide);color:#fff}
.q .txt{align-self:center;font-weight:500}
.q .txt small{display:block;color:var(--text-muted);font-weight:400;margin-top:.15rem}
.q .reps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem}
.rep{flex:1 1 9rem;border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);min-height:46px;padding:.3rem .6rem;font-weight:600;display:inline-flex;gap:.35rem;align-items:center;justify-content:center}
.rep .bi{display:none}
.rep:hover{border-color:var(--pc)}
.rep.on{background:var(--pc-solide);border-color:var(--pc-solide);color:#fff;font-weight:800}
.rep.on .bi{display:inline}
.rep.nsp{border-style:dashed}
.rep.nsp.on{background:var(--bg-subtle);border-style:solid;border-color:var(--text-muted);color:var(--text-strong)}
.exemples{display:block;font-size:.85rem;color:var(--text-muted);margin-top:.15rem}
.etat-page{border:1px dashed var(--border-strong);border-radius:10px;padding:.5rem .8rem;margin:.6rem 0;background:var(--bg-subtle)}
.fin-coche{flex:none;width:52px;height:52px;border-radius:12px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem}

/* ---- Chemin 4 ---- */
.hero{border:2px solid var(--accent);border-radius:16px;background:var(--accent-bg-subtle);padding:1rem 1.1rem;margin:.6rem 0}
.hero .dep{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.3rem 0 .6rem}
.hero .dep button{border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);min-height:46px;padding:.3rem .9rem;font-weight:700;display:inline-flex;gap:.4rem;align-items:center}
.hero .dep button.on{border-color:var(--accent);background:var(--accent);color:var(--bg-card)}
.cles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.tel .cles{grid-template-columns:1fr}
.cle{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:.6rem .8rem}
.cle b{display:block;font-size:1.7rem;line-height:1.1;font-weight:800;color:var(--accent)}
.cle span{font-size:.88rem;color:var(--text-muted)}
.sommaire{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;margin:.7rem 0}
.tel .sommaire{grid-template-columns:1fr}
.sommaire button{display:flex;gap:.55rem;align-items:center;text-align:left;border:2px solid var(--pc);border-radius:12px;background:var(--pc-bg);color:var(--text-strong);padding:.45rem .6rem;min-height:60px;font-weight:700;font-size:.9rem;line-height:1.15}
.sommaire .ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.bloc-c4{background:var(--bg-card);border:1px solid var(--border);border-top:8px solid var(--pc);border-radius:14px;padding:.9rem 1.1rem 1rem;margin:.9rem 0}
.bloc-c4 .tete{display:flex;gap:.7rem;align-items:center;margin-bottom:.4rem}
.bloc-c4 .ico{flex:none;width:44px;height:44px;border-radius:11px;background:var(--pc-solide);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem}
.bloc-c4 h2{font-size:var(--t-grand,1.25rem);font-weight:800;margin:0}
.bloc-c4 .sous{font-size:.88rem;color:var(--text-muted)}
.filtre{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.filtre button{border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);min-height:44px;padding:.3rem .8rem;font-weight:600}
.filtre button.on{border-color:var(--pc);background:var(--pc-bg);font-weight:800}
.met{border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-card);padding:.6rem .8rem;margin:.5rem 0}
.met .nom{font-weight:800;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.part{display:flex;height:12px;border-radius:7px;overflow:hidden;border:1px solid var(--border);margin:.35rem 0 .25rem;background:var(--bg-subtle)}
.part i.s{background:var(--accent-solide)}.part i.a{background:var(--accent-bg-subtle)}
.legende{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--text-muted);margin:.3rem 0}
.legende i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:.35rem;vertical-align:-2px}
.legende i.s{background:var(--accent-solide)}.legende i.a{background:var(--accent-bg-subtle);border:1px solid var(--accent)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tabs button{border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-card);color:var(--text-strong);min-height:44px;padding:.3rem .8rem;font-weight:600}
.tabs button.on{border-color:var(--pc);background:var(--pc-solide);color:#fff;font-weight:800}
.fiches{display:flex;flex-wrap:wrap;gap:.45rem;margin:.3rem 0}
.fiches .btn{min-height:44px}
.partage{border:2px dashed var(--border-strong);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0;background:var(--bg-subtle)}
.graph{margin:.4rem 0}
.gb{display:grid;grid-template-columns:minmax(0,15rem) 1fr;gap:.5rem;align-items:center;margin:.25rem 0;font-size:.88rem}
.tel .gb{grid-template-columns:minmax(0,8rem) 1fr}
.gb .b{height:14px;background:var(--bg-subtle);border-radius:7px;overflow:hidden;border:1px solid var(--border)}.gb .b i{display:block;height:100%;background:var(--accent)}
.grille-fiches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.tel .grille-fiches{grid-template-columns:1fr}
@media (max-width:640px){.cles,.sommaire,.rassure,.parties,.grille-m,.grille-fiches{grid-template-columns:1fr}.fil{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Pastilles facile / difficile : jetons partagés de succès et d'alerte */
.pill-fd{display:inline-flex;align-items:center;gap:.3rem;font-size:.9rem;font-weight:700;padding:.15rem .7rem;border-radius:999px;border:2px solid;color:var(--text-strong);margin:.1rem .15rem .1rem 0}
.pill-fd.fac{background:var(--success-bg-subtle);border-color:var(--success)}
.pill-fd.dif{background:var(--warning-bg-subtle);border-color:var(--warning)}

  h += '<div class="bandeau p' + n + '"><span class="fin-coche">' + bi('check-lg') + '</span><div><h2>' + (n < 4 ? 'Partie ' + n + ' terminée. Il en reste ' + mots[n] + '.' : 'Les quatre parties sont terminées. Merci d’avoir pris ce temps.') + '</h2>' +
    '<p>' + (n < 4 ? 'Votre résultat apparaîtra à la fin des quatre parties. Rien n’est montré avant, pour que vos réponses restent libres.' : 'Cliquez sur « Voir mon résultat » pour le découvrir.') + '</p></div></div>';
  h += '<div class="bloc"><h3>Votre partie en un coup d’œil ' + tag('ajout') + '</h3><p class="mb-1">Exemple : vous avez répondu à <b>' + (P.total - 3) + ' ' + P.noms.toLowerCase() + ' sur ' + P.total + '</b>. Les 3 lignes laissées vides comptent comme « Je ne sais pas » : aucun point n’est retiré, et vous pouvez les compléter plus tard en revenant en arrière.</p></div>';
  if (reste > 0) { h += '<p class="note">Si vous vous arrêtez ici, aucun résultat ne sera affiché ni gardé.</p>'; }
  return h;
}

/* ---------- chemin 4 ---------- */
function c4Nom(n) { return prem(String(n).replace(/’/g, '\'')); }
function estSais(o) { return o.met > 0 && (o.s / o.met) >= 0.5; }
function c4Fiches(nom) {
  var f = DATA.enqueteFiches[nom] || [];
  return f.length ? '<div class="note mb-1">Voir la fiche du métier :</div><div class="fiches">' + f.map(function (x) { return '<button type="button" class="btn btn-outline-primary btn-sm">' + esc(x) + '</button>'; }).join('') + '</div>'
    : '<a class="btn btn-outline-secondary btn-sm" href="#" onclick="return false">' + bi('box-arrow-up-right') + ' Voir sur France Travail</a>';
}
function c4BlocTete(p, ic, titre, sous, id) {
  return '<section class="bloc-c4 p' + p + '" id="' + id + '"><div class="tete"><span class="ico">' + bi(ic) + '</span><div><h2>' + titre + '</h2><div class="sous">' + sous + '</div></div></div>';
}
function pageC4() {
  var dep = ETAT.dep, d = DATA.bmo.deps[dep], pct = Math.round(d.sais / d.tot * 100), ent = d.nom;
  var lis = d.metiers.filter(function (o) { return ETAT.v.c4filtre !== 'oui' || ETAT.filtre === 'tous' || (ETAT.filtre === 'sais' ? estSais(o) : !estSais(o)); });
  var nSais = d.metiers.filter(estSais).length;
  var max = Math.max.apply(null, d.metiers.map(function (o) { return o.met; }));
  var h = '<h1 class="titre-page">Explorer les métiers</h1><div class="sous-titre">Les emplois en demande</div>';
  h += '<div class="hero p0"><p class="mb-1">Ici, aucune question : voici ce que les employeurs de votre département disent vouloir embaucher, et où chercher.</p>' +
    '<div class="dep" role="group" aria-label="Votre département"><span>Votre département :</span>' + ['24', '87'].map(function (k) {
      return '<button type="button" data-act="dep" data-d="' + k + '" aria-pressed="' + (k === dep) + '" class="' + (k === dep ? 'on' : '') + '">' + bi('geo-alt') + DATA.bmo.deps[k].nom + ' (' + k + ')</button>';
    }).join('') + '</div>';
  if (ETAT.v.c4cles === 'oui') {
    h += '<div class="cles"><div class="cle"><b>' + nb(d.tot) + '</b><span>projets de recrutement prévus, au moins, pour les 10 métiers les plus cités</span></div>' +
      '<div class="cle"><b>' + pct + ' %</b><span>de ces projets sont saisonniers (au moins ' + nb(d.sais) + ')</span></div>' +
      '<div class="cle"><b>' + nSais + ' sur 10</b><span>de ces métiers sont surtout saisonniers</span></div></div>';
  }
  h += '<p class="note mt-2 mb-0">France Travail, enquête Besoins en main-d’œuvre ' + DATA.bmo.annee + ', ' + esc(ent) + ', publiée en avril ' + DATA.bmo.annee + '. Ce sont des minimums.</p></div>';
  if (ETAT.v.c4somm === 'oui') {
    var S = [[0, 'bar-chart-line', 'Ce que les employeurs prévoient', 'c4a'], [2, 'calendar3', 'Les métiers saisonniers', 'c4b'], [1, 'hourglass-split', 'Les métiers difficiles à pourvoir', 'c4c'], [3, 'shop', 'Le commerce', 'c4d'], [4, 'search', 'Chercher des offres', 'c4e']];
    h += '<div class="sommaire" role="navigation" aria-label="Les rubriques de la page">' + S.map(function (s) { return '<button type="button" class="p' + s[0] + '" data-act="somm" data-id="' + s[3] + '"><span class="ico">' + bi(s[1]) + '</span>' + s[2] + '</button>'; }).join('') + '</div>';
  }
  /* A : ce que les employeurs prévoient */
  h += c4BlocTete(0, 'bar-chart-line', 'Ce que les employeurs prévoient d’embaucher', 'Les 10 métiers les plus cités dans ' + (dep === '24' ? 'la Dordogne' : 'la Haute-Vienne'), 'c4a');
  h += '<p>Voici les 10 métiers les plus cités par les employeurs de ' + (dep === '24' ? 'la Dordogne' : 'la Haute-Vienne') + ', d’après l’enquête ' + DATA.bmo.annee + ' de France Travail. Les graphiques montrent d’un coup les métiers où les employeurs prévoient le plus d’embaucher. Dessous, chaque fiche dit ce que fait le métier, ses conditions de travail, et permet de préparer une candidature.</p>';
  h += '<div class="partage"><p class="mb-1"><b>Les graphiques.</b> Choisissez la façon de lire qui vous convient : en chiffres, en barres ou en camembert. <span class="tag-nouveau">composant partagé « Comprendre les chiffres » : inchangé, dessiné ici en raccourci</span></p>' +
    '<div class="filtre" style="margin:.3rem 0"><button type="button">Chiffres</button><button type="button" class="on" style="border-color:var(--accent);background:var(--accent-bg-subtle)">Barres</button><button type="button">Camembert</button></div><div class="graph">' +
    d.metiers.map(function (o) { return '<div class="gb"><span>' + esc(c4Nom(o.nom)) + '</span><span class="b"><i style="width:' + Math.round(o.met / max * 100) + '%"></i></span></div>'; }).join('') + '</div></div>';
  h += '<h3 style="font-size:1.05rem;font-weight:800;margin-top:.8rem">Les fiches de ces métiers</h3>';
  if (ETAT.v.c4filtre === 'oui') {
    h += '<div class="filtre p0" role="group" aria-label="Afficher">' + [['tous', 'Tous (10)'], ['sais', 'Surtout saisonniers (' + nSais + ')'], ['toute', 'Toute l’année (' + (10 - nSais) + ')']].map(function (f) {
      return '<button type="button" data-act="filtre" data-f="' + f[0] + '" aria-pressed="' + (ETAT.filtre === f[0]) + '" class="' + (ETAT.filtre === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  }
  h += '<div class="legende"><span><i class="s"></i>projets saisonniers</span><span><i class="a" style="background:var(--accent)"></i>autres projets</span></div>';
  lis.forEach(function (o) {
    var part = Math.round(o.s / o.met * 100), nom = c4Nom(o.nom);
    h += '<div class="met p0"><div class="nom">' + esc(nom) + (estSais(o) ? ' <span class="pill pc p2">surtout saisonnier</span>' : '') + '</div>' +
      '<div class="part" role="img" aria-label="' + part + ' pour cent de projets saisonniers"><i class="s" style="width:' + part + '%"></i><i class="a" style="width:' + (100 - part) + '%"></i></div>' +
      '<div class="note mb-1">Au moins ' + nb(o.met) + ' projets, dont au moins ' + nb(o.s) + ' saisonniers (' + part + ' %).</div>' + c4Fiches(nom) + '</div>';
  });
  h += encart('exclamation-triangle', 'Ce sont des <b>intentions d’employeurs</b>, pas des embauches garanties, et cela ne veut pas dire qu’un employeur précis recrute. Les nombres sont des <b>minimums</b> : France Travail masque les petits nombres.', true) + '</section>';
  /* B : saisonniers */
  var sais = d.metiers.filter(estSais);
  h += c4BlocTete(2, 'calendar3', 'Les métiers saisonniers', 'Le besoin revient chaque année, le contrat dure quelques semaines ou mois', 'c4b');
  h += '<p>Un emploi saisonnier dépend d’une période de l’année (vendanges, récoltes, saison touristique). Le besoin revient chaque année, mais le contrat dure quelques semaines ou quelques mois.</p>';
  if (sais.length) { h += '<p>Dans ' + (dep === '24' ? 'la Dordogne' : 'la Haute-Vienne') + ', la majorité des projets de recrutement de ces métiers sont saisonniers : ' + sais.map(function (o) { return '<b>' + esc(c4Nom(o.nom)) + '</b>'; }).join(', ') + '.</p>'; }
  var fam = DATA.saison;
  if (ETAT.v.c4onglets === 'oui') {
    h += '<div class="tabs p2" role="group" aria-label="Familles de métiers saisonniers">' + fam.map(function (g, i) { return '<button type="button" data-act="fam" data-i="' + i + '" aria-pressed="' + (ETAT.famille === i) + '" class="' + (ETAT.famille === i ? 'on' : '') + '">' + esc(g.titre) + ' (' + g.fiches.length + ')</button>'; }).join('') + '</div>' +
      '<div class="fiches">' + fam[ETAT.famille].fiches.map(function (x) { return '<button type="button" class="btn btn-outline-primary">' + bi('file-earmark-person') + ' ' + esc(x) + '</button>'; }).join('') + '</div>';
  } else {
    h += fam.map(function (g) { return '<h4 class="h6 mt-3">' + esc(g.titre) + '</h4><div class="fiches">' + g.fiches.map(function (x) { return '<button type="button" class="btn btn-outline-primary">' + bi('file-earmark-person') + ' ' + esc(x) + '</button>'; }).join('') + '</div>'; }).join('');
  }
  h += '<p class="note mt-3">Ces fiches donnent aussi leurs conditions de travail et permettent de préparer une candidature.</p><button type="button" class="btn btn-outline-secondary btn-sm">' + bi('journal-text') + ' Lire la fiche du Lexique</button></section>';
  /* C : tension */
  h += c4BlocTete(1, 'hourglass-split', 'Les métiers difficiles à pourvoir', 'Quand un poste reste ouvert longtemps', 'c4c');
  h += '<p>Un métier est « en tension » quand les employeurs ont du mal à trouver quelqu’un. Un poste reste alors ouvert longtemps. Cela ne veut pas dire qu’il est facile d’y entrer : la difficulté peut venir des horaires, de la pénibilité, du lieu ou du diplôme demandé.</p>' +
    '<div class="ligne-boutons"><button type="button" class="btn btn-outline-secondary btn-sm">' + bi('journal-text') + ' Lire la fiche du Lexique</button><button type="button" class="btn btn-outline-secondary btn-sm">' + bi('graph-up') + ' Voir les chiffres de mon territoire</button></div></section>';
  /* D : commerce */
  h += c4BlocTete(3, 'shop', 'Là où l’on recrute en continu : le commerce', 'Des postes qui reviennent souvent', 'c4d');
  h += '<p>Dans le commerce (grandes surfaces, magasins, restauration rapide), des postes reviennent souvent : des salariés partent, d’autres arrivent. Beaucoup d’enseignes recrutent donc toute l’année. Ce mouvement s’appelle le <b>turnover</b>.</p>' +
    '<button type="button" class="btn btn-outline-secondary btn-sm mb-2">' + bi('journal-text') + ' Lire la fiche du Lexique</button>' +
    '<h3 style="font-size:1.05rem;font-weight:800;margin-top:.8rem">Les métiers du commerce et de la logistique</h3><p class="note mb-2">Mise en rayon, caisse, préparation de commandes, magasinage : chaque fiche donne ses conditions de travail et permet de préparer une candidature.</p>' +
    '<div class="grille-fiches">' + DATA.commerce.map(function (x) { return '<button type="button" class="btn btn-outline-primary">' + bi('file-earmark-person') + ' ' + esc(x) + '</button>'; }).join('') + '</div><hr>' +
    '<p>Nous avons repéré une partie des employeurs de ' + (dep === '24' ? 'la Dordogne' : 'la Haute-Vienne') + ' : leurs adresses, et la page où chacun publie ses offres de recrutement. <b>Le repérage complet est encore en cours.</b></p>' +
    '<div class="ligne-boutons"><button type="button" class="btn btn-primary">' + bi('cart3') + ' Voir les enseignes du commerce</button><button type="button" class="btn btn-outline-primary">' + bi('briefcase') + ' Tous les secteurs : employeurs près de chez moi</button></div>' +
    encart('exclamation-triangle', 'Ce repérage ne couvre que <b>votre département</b>, ' + (dep === '24' ? 'Dordogne (24)' : 'Haute-Vienne (87)') + '. Nous n’avons ni les adresses ni les employeurs des départements qui l’entourent.', true) + '</section>';
  /* E : offres */
  h += c4BlocTete(4, 'search', 'Chercher les offres du moment', 'Une demande prête à copier dans l’assistant en ligne', 'c4e');
  h += '<p>Vous choisissez ici jusqu’à cinq métiers, puis votre territoire. La demande ci-dessous demande à l’assistant en ligne de chercher des offres publiées en ce moment, d’abord dans votre territoire, puis dans les départements proches.</p>' +
    '<div class="partage"><p class="mb-1"><b>Formulaire de demande d’offres</b> <span class="tag-nouveau">formulaire partagé avec la fiche d’un métier : inchangé, non redessiné ici</span></p><div class="tabs p4"><button type="button" class="on">Employeurs</button><button type="button">Saisonniers</button><button type="button">Commerce</button></div><p class="note mb-0">Rien n’est coché au départ ; cinq métiers au plus ; puis le territoire ; puis la demande à copier.</p></div></section>';
  h += '<section class="bloc-c4 p0"><div class="tete"><span class="ico">' + bi('file-earmark-person') + '</span><div><h2>Un métier vous attire ?</h2></div></div><p>Lisez sa fiche : ce que fait le métier, ce qu’il demande. Vous y trouvez aussi le bouton pour préparer votre candidature.</p><button type="button" class="btn btn-outline-primary">' + bi('search') + ' Chercher un métier</button></section>';
  return h;
}

/* ---------- barre du bas ---------- */
function barre() {
  var e = ETAT.ecran, retour = { c2p2: 'c2p1', c2p3: 'c2p2', c2p4: 'c2p3', c2res: 'c2p4', c3part: 'c3intro', c3page: 'c3part', c3fin: 'c3page' }[e];
  var suivant = { c2p1: ['Continuer', 'c2p2'], c2p2: ['Continuer', 'c2p3'], c2p3: ['Continuer', 'c2p4'], c2p4: ['Voir les métiers', 'c2res'], c3intro: ['Commencer la partie 1', 'c3part'], c3part: [partieCourante().bouton, 'c3page'], c3page: ['Continuer', 'c3fin'], c3fin: [ETAT.partie < 4 ? 'Partie suivante' : 'Voir mon résultat', 'c3part'] }[e];
  var bloque = false, msg = '';
  if (e === 'c3page' && ETAT.v.continuer === 'bloque' && nbReponsesPage() < 10) { bloque = true; msg = (10 - nbReponsesPage()) + ' énoncés sans réponse sur cette page.'; }
  if (e === 'c2p4' && ETAT.ch.a.length + ETAT.ch.b.length + ETAT.ch.c.length === 0) { /* comme aujourd'hui : rien choisi, bouton grisé */ bloque = true; msg = 'Choisissez au moins un élément dans les pages précédentes pour voir des métiers.'; }
  return '<div class="barre-navigation-fixe"><div class="barre"><span>' + (retour ? '<button class="btn btn-nav-erip btn-lg" data-act="go" data-v="' + retour + '">&#8592; Retour</button>' : '<button class="btn btn-nav-erip btn-lg" type="button" disabled>&#8592; Retour</button>') + '</span>' +
    (msg ? '<span class="msg">' + esc(msg) + '</span>' : '') +
    '<button class="btn btn-nav-erip btn-accueil" type="button">' + bi('house-door') + ' Accueil</button>' +
    '<span>' + (suivant ? '<button class="btn btn-primary btn-lg" data-act="suivant" data-v="' + suivant[1] + '"' + (bloque ? ' disabled' : '') + '>' + suivant[0] + ' &#8594;</button>' : '') + '</span></div></div>';
}

/* ---------- rendu ---------- */
function rendre() {
  var y = window.scrollY;
  document.documentElement.setAttribute('data-theme', ETAT.sombre ? 'sombre' : 'clair');
  if (ETAT.accent) { document.documentElement.setAttribute('data-accent', ETAT.accent); } else { document.documentElement.removeAttribute('data-accent'); }
  document.getElementById('mqAccents').innerHTML = [['', 'Bleu (par défaut)'], ['orange', 'Orange'], ['vert', 'Vert'], ['violet', 'Violet'], ['turquoise', 'Turquoise'], ['framboise', 'Framboise']].map(function (a) { return '<button type="button" class="btn btn-sm ' + (ETAT.accent === a[0] ? 'btn-primary' : 'btn-outline-secondary') + '" data-act="accent" data-a="' + a[0] + '">' + a[1] + '</button>'; }).join('');
  var p = document.getElementById('mqPage'), e = ETAT.ecran;
  p.className = 'mq-page' + (ETAT.tel ? ' tel' : '');
  var F = { c2p1: function () { return pageChoix('c2p1'); }, c2p2: function () { return pageChoix('c2p2'); }, c2p3: function () { return pageChoix('c2p3'); }, c2p4: pageConditions, c2res: pageResultats,
    c3intro: pageIntro, c3part: pageOuverture, c3page: pageQuestions, c3fin: pageFin, c4: pageC4 };
  p.innerHTML = F[e]();
  document.getElementById('mqBas').innerHTML = barre();
  document.getElementById('mqEcrans').innerHTML = ECRANS.map(function (x) { return '<button type="button" class="btn btn-sm ' + (x[0] === e ? 'btn-primary' : 'btn-outline-primary') + '" data-act="go" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('');
  document.getElementById('mqParties').innerHTML = [1, 2, 3, 4].map(function (n) { return '<button type="button" class="btn btn-sm ' + (ETAT.partie === n ? 'btn-primary' : 'btn-outline-secondary') + '" data-act="partie" data-n="' + n + '">Partie ' + n + '</button>'; }).join('');
  document.getElementById('mqGrpPartie').style.display = /^c3(part|page|fin)$/.test(e) ? '' : 'none';
  document.getElementById('mqVar').innerHTML = VARIABLES.map(function (v) { return '<span class="note">' + v[1] + ' :</span> ' + v[2].map(function (o) { return '<button type="button" class="btn btn-sm ' + (ETAT.v[v[0]] === o[0] ? 'btn-primary' : 'btn-outline-secondary') + '" data-act="var" data-var="' + v[0] + '" data-val="' + o[0] + '">' + o[1] + '</button>'; }).join(' ') + '<br>'; }).join('');
  document.getElementById('mqRetient').innerHTML = '<b>Ce que cet écran retient</b>' + (RETIENT[e] || []).map(function (t) { return '<p>• ' + t + '</p>'; }).join('');
  document.getElementById('mqLarge').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-outline-primary' : 'btn-primary');
  document.getElementById('mqTel').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-primary' : 'btn-outline-primary');
  document.getElementById('mqTheme').textContent = ETAT.sombre ? 'Mode clair' : 'Mode sombre';
  document.getElementById('mqRegl').style.display = ETAT.regl ? '' : 'none';
  document.getElementById('mqRouvrir').style.display = ETAT.regl ? 'none' : 'inline-flex';
  if (rendre.garde) { window.scrollTo(0, y); }
}
function aller(v) { ETAT.ecran = v; rendre.garde = false; rendre(); window.scrollTo(0, 0); }
function basculer(liste, l) { var i = liste.indexOf(l); if (i > -1) { liste.splice(i, 1); } else { liste.push(l); } }

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act],#mqFermer,#mqRouvrir,#mqLarge,#mqTel,#mqTheme');
  if (!b) { return; }
  var a = b.getAttribute('data-act'), g = function (k) { return b.getAttribute('data-' + k); };
  rendre.garde = true;
  if (b.id === 'mqFermer') { ETAT.regl = false; }
  else if (b.id === 'mqRouvrir') { ETAT.regl = true; }
  else if (b.id === 'mqLarge') { ETAT.tel = false; }
  else if (b.id === 'mqTel') { ETAT.tel = true; }
  else if (b.id === 'mqTheme') { ETAT.sombre = !ETAT.sombre; }
  else if (a === 'go' || a === 'suivant') {
    if (a === 'suivant' && ETAT.ecran === 'c3fin' && ETAT.partie < 4) { ETAT.partie++; }
    else if (a === 'suivant' && ETAT.ecran === 'c3fin') { return; }
    aller(g('v')); return;
  }
  else if (a === 'jt') {
    var L = ETAT.ch[g('k')], lim = { a: 16, b: 16, c: 12 }[g('k')], l = g('l');
    if (L.indexOf(l) > -1) { L.splice(L.indexOf(l), 1); } else if (L.length < lim) { L.push(l); }
  }
  else if (a === 'rm') { var L2 = ETAT.ch[g('k')], i2 = L2.indexOf(g('l')); if (i2 > -1) { L2.splice(i2, 1); } }
  else if (a === 'clr') { if (g('k') === 'fd') { ETAT.fd = { fac: [], dif: [] }; } else { ETAT.ch[g('k')] = []; } }
  else if (a === 'fac' || a === 'dif') {
    var l3 = g('l'), mien = a === 'fac' ? ETAT.fd.fac : ETAT.fd.dif, autre = a === 'fac' ? ETAT.fd.dif : ETAT.fd.fac;
    if (mien.indexOf(l3) > -1) { mien.splice(mien.indexOf(l3), 1); } else { mien.push(l3); if (autre.indexOf(l3) > -1) { autre.splice(autre.indexOf(l3), 1); } }
  }
  else if (a === 'rep') { var k = ETAT.partie + ':' + g('i'); if (ETAT.rep[k] === g('r')) { delete ETAT.rep[k]; } else { ETAT.rep[k] = g('r'); } }
  else if (a === 'partie') { ETAT.partie = parseInt(g('n'), 10); rendre.garde = false; }
  else if (a === 'accent') { ETAT.accent = g('a'); }
  else if (a === 'dep') { ETAT.dep = g('d'); }
  else if (a === 'filtre') { ETAT.filtre = g('f'); }
  else if (a === 'fam') { ETAT.famille = parseInt(g('i'), 10); }
  else if (a === 'somm') { var t = document.getElementById(g('id')); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  else if (a === 'var') { ETAT.v[g('var')] = g('val'); }
  else if (a === 'remplir') { ETAT.ch = { a: EXEMPLE.a.slice(), b: EXEMPLE.b.slice(), c: EXEMPLE.c.slice() }; ETAT.fd = { fac: [], dif: [] }; for (var i = 0; i < 7; i++) { ETAT.rep[ETAT.partie + ':' + i] = REPONSES[ETAT.partie][i % 3][0]; } }
  else if (a === 'vider') { ETAT.ch = { a: [], b: [], c: [] }; ETAT.fd = { fac: [], dif: [] }; ETAT.rep = {}; }
  rendre();
});
rendre();
</script>
