<script>
/* ------------------------------------------------------------------
   MAQUETTE V3 du 18/11/2026 : « Ma synthèse » (consignes 460 et 461 de Denis).
   Les chiffres des deux départements sont les vrais (enquête BMO 2026). Tout le reste (personne, pourcentages, métiers, niveaux) est FICTIF.
   Les trois passages donnent un résultat ; le quatrième chemin (emplois en demande) donne du concret, pas un résultat.
------------------------------------------------------------------ */
var DEP = {
  '24': { nom: 'Dordogne', metiers: [['Viticulteurs, arboriculteurs', 1447, 1383], ['Agriculteurs', 1212, 1145], ['Aides de cuisine et employés polyvalents de la restauration', 1098, 524]] },
  '87': { nom: 'Haute-Vienne', metiers: [['Agriculteurs', 692, 610], ['Aides de cuisine et employés polyvalents de la restauration', 500, 137], ['Aides-soignants', 407, 84]] }
};
var LIEN_ENQUETE = { 'Aide-soignant ou aide-soignante': 'Aides-soignants' };
var NOMS_LETTRES = { R: 'Réaliste', I: 'Investigateur', A: 'Artistique', S: 'Social', E: 'Entreprenant', C: 'Conventionnel' };
var NIVEAUX = ['Sans diplôme', 'CAP ou BEP', 'Bac', 'Bac + 2', 'Bac + 3', 'Bac + 5'];
var DATE = '18/11/2026';
/* Les métiers du passage 1 : le mieux classé (recommandé), des métiers proches, un métier du commerce (pour montrer le turnover). */
var METIERS = {
  recommande: { nom: 'Auxiliaire de puériculture', pct: '82 %', niveau: 2, secteur: 'Santé et social', comp: { se: 4, sf: 6, sv: 5 }, rang: 'le métier le mieux classé' },
  proche: { nom: 'Animateur ou animatrice socioculturel', pct: '78 %', niveau: 3, secteur: 'Animation et culture', comp: { se: 4, sf: 6, sv: 4 }, rang: 'un métier proche' },
  commerce: { nom: 'Employé ou employée de libre-service', pct: '66 %', niveau: 0, secteur: 'Commerce', comp: { se: 4, sf: 5, sv: 3 }, rang: 'un métier proche', commerce: true }
};
var LETTRES_METIERS = [['Auxiliaire de puériculture', 'SA'], ['Animateur ou animatrice socioculturel', 'SA'], ['Éducateur ou éducatrice de jeunes enfants', 'SE']];
var COMPARE = { exerce: 'Aide à domicile', vise: 'Animateur ou animatrice socioculturel', transferables: ['Écouter la personne', 'Accompagner un public fragile', 'Organiser une activité simple'], transversales: ['Communiquer', 'Garder son calme', 'Travailler en équipe'], acquerir: ['Concevoir un projet d’animation', 'Encadrer un groupe', 'Connaître le cadre réglementaire des accueils de mineurs'] };
var COMP_CHOISIES = ['Écouter', 'Être patient', 'Expliquer simplement', 'Organiser une activité', 'Garder son calme'];
var EXEMPLE = {
  pct: { S: 71, A: 58, E: 33, I: 21, C: 12, R: 8 },
  pctEgalite: { S: 60, A: 60, E: 60, I: 21, C: 12, R: 8 },
  dateTest: '17/11/2026',
  faciles: ['Parler avec des personnes', 'Expliquer', 'Travailler en équipe'],
  difficiles: ['Travailler la nuit'],
  choix: { 'Avec qui ou avec quoi': ['Des enfants', 'Des personnes âgées', 'Des animaux'], 'Ce que j’aimerais faire': ['Écouter, conseiller', 'Créer, imaginer', 'Prendre soin'], 'Où': ['Dans un lieu calme', 'À l’intérieur et à l’extérieur'] },
  metiers2: [['Auxiliaire de puériculture', '82 %'], ['Animateur ou animatrice socioculturel', '78 %'], ['Aide-soignant ou aide-soignante', '71 %']],
  horsMetier: ['Créer, imaginer', 'Des animaux'],
  parcours: [['Agent de service hospitalier', ['Entretenir les locaux', 'Aider au repas', 'Accompagner une personne âgée', 'Respecter les règles d’hygiène']], ['Aide à domicile', ['Faire les courses', 'Écouter la personne', 'Préparer un repas']]]
};
var COMPLEMENTS = ['Je peux me déplacer', 'Je peux me former', 'Je cherche vite un emploi', 'Je veux changer complètement', 'Je veux rester dans mon secteur', 'Des horaires fixes sont nécessaires', 'J’ai le permis B', 'J’ai envie de créer mon activité'];
var ETAT = {
  ecran: 'synthese', tel: false, sombre: false, regl: true, dep: '87',
  p1: true, p2: true, p3: true, parcours: true, libre: true, lect: true,
  retenu: 'proche',            // recommande | proche | commerce | aucun
  egalite: false,
  niveauPers: 1,              // index dans NIVEAUX
  suivi: 'oui',               // oui | non | jamais
  complements: { 0: true, 1: true },
  grapheCache: false,
  vParcours: 'fiche', vPasserelle: 'non'
};

function e(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function nb(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function pastille(l, gros) { return '<span class="ri-p ri-' + l + (gros ? ' gros' : '') + '" aria-hidden="true">' + l + '</span>'; }
function pastilleEtat(fait, texteFait) { return '<span class="etat-pastille ' + (fait ? 'fait' : 'afaire') + '">' + (fait ? (texteFait || 'Fait') : 'Pas encore fait') + '</span>'; }
function pcts() { return ETAT.egalite ? EXEMPLE.pctEgalite : EXEMPLE.pct; }
function met() { return ETAT.retenu === 'aucun' ? null : METIERS[ETAT.retenu]; }
function nbSources() { return (ETAT.p1 && met() ? 1 : 0) + (ETAT.p2 ? 1 : 0) + (ETAT.p3 ? 1 : 0); }
function compTotal(m) { return m.comp.se + m.comp.sf + m.comp.sv; }
function lieEnquete(m) { var d = DEP[ETAT.dep], cible = LIEN_ENQUETE[m.nom], r = null; if (!cible) { return null; } d.metiers.forEach(function (x) { if (x[0] === cible) { r = x; } }); return r; }

/* Les six lettres : deux premières en fort, une troisième en teinte intermédiaire si elle se démarque, les autres discrètes. Égalité : toutes les lettres à égalité sont en fort. */
function classLettres() {
  var p = pcts(), ordre = Object.keys(p).sort(function (a, b) { return p[b] - p[a]; });
  var seuilFort = p[ordre[1]], res = {};
  ordre.forEach(function (l, i) { res[l] = (p[l] >= seuilFort) ? 'fort' : 'doux'; });
  var tiers = ordre.filter(function (l) { return res[l] === 'doux'; })[0];
  if (tiers && p[tiers] >= 25 && p[tiers] - p[ordre[ordre.indexOf(tiers) + 1]] >= 8) { res[tiers] = 'inter'; }
  return { ordre: ordre, cls: res };
}
function lettresHTML() {
  var c = classLettres(), p = pcts();
  return '<div class="barres-lettres" role="list">' + c.ordre.map(function (l) {
    return '<div class="bl ri-' + l + ' ' + c.cls[l] + '" role="listitem">' + pastille(l) + '<span class="bl-nom">' + NOMS_LETTRES[l] + '</span><span class="bl-barre"><i style="width:' + p[l] + '%"></i></span><span class="bl-pct">' + p[l] + ' %</span></div>';
  }).join('') + '</div><p class="note mb-0">Les deux premières lettres ressortent le plus' + (c.ordre.some(function (l) { return c.cls[l] === 'inter'; }) ? ', la troisième se démarque un peu' : '') + '. Un pourcentage dit seulement la place d’un type dans vos réponses : ce n’est pas une note.</p>';
}
function camembert(a, b, la, lb) {
  var pa = Math.round(a / (a + b) * 100);
  return '<div class="camembert-zone"><div class="camembert" style="background:conic-gradient(var(--accent) 0 ' + pa + '%, var(--cam-autre) ' + pa + '% 100%)" role="img" aria-label="' + la + ' : ' + a + ' ; ' + lb + ' : ' + b + '"></div>' +
    '<ul class="legende"><li><span class="puce puce-a"></span>' + la + ' : ' + a + '</li><li><span class="puce puce-b"></span>' + lb + ' : ' + b + '</li></ul></div>';
}

/* ---------- Accueil du module ---------- */
function ecranAccueil() {

function texteDemande() {
  var d = DEP[ETAT.dep], m = met(), t = [], c = pcts(), ord = classLettres().ordre;
  t.push('Vous êtes un conseiller en insertion professionnelle, bienveillant et clair. Une personne a exploré des métiers avec l’application APP. Voici ses résultats. Aidez-la à y voir clair : donnez des pistes de réflexion, jamais de note, jamais de diagnostic, jamais de solution toute faite.');
  t.push('');
  if (ETAT.p1 && m) {
    t.push('PASSAGE 1, un métier retenu après le choix de compétences : ' + m.nom + ' (' + m.pct + ' de compatibilité avec ses choix). ' + (ETAT.retenu === 'recommande' ? 'C’est le métier le mieux classé par l’application.' : 'Le métier le mieux classé par l’application était « ' + METIERS.recommande.nom + ' » ; la personne a retenu un métier proche.') + ' Secteur : ' + m.secteur + '. Niveau d’accès : ' + NIVEAUX[m.niveau] + '. Compétences demandées : ' + compTotal(m) + '. Compétences choisies par la personne : ' + COMP_CHOISIES.join(', ') + '. Autres métiers très proches proposés : ' + EXEMPLE.metiers2.map(function (x) { return x[0]; }).join(' ; ') + '. Autres filtres activés : secteur, niveau, conditions de travail.');
    var l = lieEnquete({ nom: m.nom });
    t.push('Recrutement : ' + (l ? 'ce métier fait partie des plus cités par les employeurs de ' + d.nom + ' (au moins ' + nb(l[1]) + ' projets, source France Travail, enquête Besoins en main-d’œuvre 2026).' : (m.commerce ? 'métier du commerce, où des postes reviennent souvent (turnover).' : 'aucune information de recrutement : n’affirmez rien.')));
  }
  if (ETAT.p2) { t.push('PASSAGE 2, ce que la personne aime faire : ' + Object.keys(EXEMPLE.choix).map(function (k) { return k + ' : ' + EXEMPLE.choix[k].join(', '); }).join(' ; ') + '. Elle ferait facilement : ' + EXEMPLE.faciles.join(', ') + '. Ce qui serait difficile : ' + EXEMPLE.difficiles.join(', ') + '. Métiers proposés : ' + EXEMPLE.metiers2.map(function (x) { return x[0] + ' (' + x[1] + ' de ses choix retrouvés)'; }).join(' ; ') + '. Choix qui ne comptent pas dans le métier recommandé : ' + EXEMPLE.horsMetier.join(', ') + '.'); }
  if (ETAT.p3) { t.push('PASSAGE 3, questionnaire de préférences, six types en pourcentage de ses réponses (du plus haut au plus bas) : ' + ord.map(function (l) { return NOMS_LETTRES[l] + ' ' + c[l] + ' %'; }).join(', ') + '. Ce questionnaire dit des préférences, pas des aptitudes.'); }
  if (ETAT.parcours) { t.push('PARCOURS PROFESSIONNEL (compétences cochées par la personne, jusqu’à cinq métiers) : ' + EXEMPLE.parcours.map(function (p) { return p[0] + ' : ' + p[1].join(', '); }).join(' ; ') + '.'); }
  t.push('SITUATION : niveau d’études ' + NIVEAUX[ETAT.niveauPers] + '. ' + ({ oui: 'Accompagnée par un professionnel.', non: 'Pas accompagnée pour l’instant.', jamais: 'Jamais accompagnée.' }[ETAT.suivi]) + (Object.keys(ETAT.complements).filter(function (i) { return ETAT.complements[i]; }).length ? ' Ce qui compte pour elle : ' + Object.keys(ETAT.complements).filter(function (i) { return ETAT.complements[i]; }).map(function (i) { return COMPLEMENTS[i]; }).join(', ') + '.' : ''));
  if (ETAT.libre) { t.push('SES MOTS : « J’ai toujours aimé m’occuper des autres, mais je ne sais pas si je saurais me former. »'); }
  var manquants = []; if (!(ETAT.p1 && m)) { manquants.push('passage 1 (métier retenu)'); } if (!ETAT.p2) { manquants.push('passage 2 (ce que la personne aime faire)'); } if (!ETAT.p3) { manquants.push('passage 3 (questionnaire)'); }
  if (manquants.length) { t.push('PASSAGES NON FAITS : ' + manquants.join(', ') + '. Ne devinez rien à leur sujet et dites-le.'); }
  if (ETAT.p3) { t.push('Métiers proches des lettres (passage 3) : ' + LETTRES_METIERS.map(function (x) { return x[0] + ' (' + x[1] + ')'; }).join(' ; ') + '.'); }
  if (ETAT.parcours) { t.push('Du métier exercé (' + COMPARE.exerce + ') au métier visé (' + COMPARE.vise + '), calculé par l’application. Transférables : ' + COMPARE.transferables.join(', ') + '. À acquérir : ' + COMPARE.acquerir.join(', ') + '.'); }
  t.push('TERRITOIRE : ' + d.nom + '.');
  t.push('');
  t.push('CONSIGNES : 1. Pour chaque passage, donnez en deux ou trois phrases ce qu’il suggère. 2. Dites ce qui se retrouve d’un passage à l’autre et ce qui diffère. 3. Proposez trois métiers à regarder en premier et, pour chacun, ce qui va dans le sens de cette piste dans les résultats et ce qui reste à vérifier. 4. Comparez le niveau d’études de la personne et celui attendu par ces métiers : s’il manque une préparation, dites-le clairement et orientez vers un organisme de formation et un conseiller. 5. Parmi les compétences du parcours, dites lesquelles sont transférables et lesquelles sont transversales. 6. Distinguez la rencontre avec un professionnel (Ambassadeurs Métiers dans la région, ExplorJob ou My Job Glasses au niveau national) de l’immersion en structure (Immersion facilitée, demandée avec un conseiller), sans citer d’entreprise ; conseillez deux à trois immersions courtes dans des structures différentes. 7. Selon la situation, encouragez à en parler à son conseiller, à se faire accompagner, ou à contacter ERIP. 8. Mots simples, phrases courtes, réponse de longueur raisonnable. N’inventez ni offre, ni salaire, ni diplôme. Répondez avec exactement ces titres : « Ce que disent mes trois passages », « Ce qui se retrouve, ce qui diffère », « Trois pistes à regarder en premier », « Mon niveau et ce qu’il faudrait », « Mes compétences transférables et transversales », « Rencontrer, essayer, être accompagné », « Questions pour un conseiller ».');
  return t.join('\n');
}

    '<div class="encart"><i class="bi bi-shield-check"></i><p>La demande ne contient ni votre nom ni aucune réponse du questionnaire : seulement vos résultats et ce que vous avez écrit ici. Relisez-la avant de la copier.</p></div>' +

    '<div class="bloc"><h2>Collez la réponse ici</h2><textarea class="form-control" rows="8" aria-label="Réponse de l’assistant" placeholder="Collez ici la réponse de l’assistant"></textarea><div class="boutons-ligne"><button type="button" class="btn btn-primary btn-lg" data-lect="1">Voir ma lecture</button></div>' +

/* ---------- La lecture mise en page ---------- */
function ecranLecture() {
  var m = met() || METIERS.recommande, ecart = (m.niveau > ETAT.niveauPers), nomM = m.nom;
  var h = '<h1 class="titre-page"><i class="bi bi-chat-square-quote"></i> Ma lecture</h1><p class="sous-titre">Lecture de l’assistant en ligne, reçue le ' + DATE + '</p>' +
    '<div class="encart warn"><i class="bi bi-info-circle"></i><p>Ce sont des pistes de réflexion, pas une note, pas un diagnostic, pas une solution. Relisez-les avec une personne qui vous accompagne.</p></div>';
  h += '<div class="bloc"><h2><i class="bi bi-1-circle"></i> Ce que disent mes trois passages</h2><div class="trois">' +
    '<div class="tr"><b>Mes compétences</b><p>Écouter, être patient et expliquer simplement vous rapprochent des métiers de l’accompagnement.</p><span class="pill">Piste : ' + e(nomM) + '</span></div>' +
    '<div class="tr"><b>Mes envies</b><p>Enfants et personnes âgées, dans un lieu calme : vos choix visent la relation et le soin.</p><span class="pill">Piste : Auxiliaire de puériculture</span></div>' +
    '<div class="tr"><b>Mes lettres</b><p>Social en tête, Artistique ensuite : le contact et la création ressortent.</p><span class="pill">Piste : Animateur ou animatrice</span></div></div></div>';
  h += '<div class="bloc"><h2><i class="bi bi-2-circle"></i> Ce qui se retrouve, ce qui diffère</h2><p><b>Se retrouve :</b> le contact avec des personnes, plus précisément les plus jeunes et les plus âgées.</p><p class="mb-0"><b>Diffère :</b> vous avez choisi « Créer, imaginer », qui ne compte pas dans le métier le mieux classé. Ce n’est pas une contradiction : c’est un point à regarder de près.</p></div>';
  h += '<div class="bloc"><h2><i class="bi bi-3-circle"></i> Trois pistes à regarder en premier</h2><div class="trois">' +
    ['Auxiliaire de puériculture', 'Animateur ou animatrice socioculturel', 'Aide-soignant ou aide-soignante'].map(function (n, i) { return '<div class="tr"><b>' + (i + 1) + '. ' + e(n) + '</b><p><i class="bi bi-check2"></i> Va dans le sens de vos résultats : revient dans plusieurs passages.</p><p class="note mb-0"><i class="bi bi-question-circle"></i> À vérifier : ' + (i === 2 ? 'les horaires de nuit, que vous avez écartés.' : 'ce que le quotidien demande vraiment.') + '</p></div>'; }).join('') + '</div></div>';
  h += '<div class="bloc"><h2><i class="bi bi-4-circle"></i> Mon niveau et ce qu’il faudrait</h2><div class="niveaux"><div><span class="note">Mon niveau</span><b>' + NIVEAUX[ETAT.niveauPers] + '</b></div><i class="bi bi-arrow-right" aria-hidden="true"></i><div><span class="note">Niveau d’accès de « ' + e(nomM) + ' »</span><b>' + NIVEAUX[m.niveau] + '</b></div></div>' +
    (ecart ? '<div class="encart warn"><i class="bi bi-mortarboard"></i><p>Il manque une préparation pour ce métier. Le chemin passe par une formation : rapprochez-vous d’un organisme de formation et d’un conseiller (France Travail ou autre) pour une remise à niveau. Des offres existent, mais elles supposent ce niveau.</p></div>' : '<p class="mt-2 mb-0">Votre niveau correspond à celui demandé : vous pouvez regarder des offres.</p>') + '</div>';
  h += '<div class="bloc"><h2><i class="bi bi-5-circle"></i> Mes compétences transférables et transversales</h2><div class="deux"><div class="tr"><b>Transférables</b><p>Accompagner une personne âgée, préparer un repas : à réutiliser auprès d’enfants ou de familles.</p></div><div class="tr"><b>Transversales</b><p>Écouter, garder son calme, travailler en équipe : utiles dans presque tous les métiers.</p></div></div>' +
    '<p class="note mt-2">Les compétences du métier « ' + e(nomM) + ' » :</p>' + camembert(7, compTotal(m) - 7, 'Déjà pratiquées', 'À construire') + '<p class="note mb-0">Ce dessin n’est pas une note : il montre simplement ce que vous avez déjà et ce qu’il reste à découvrir.</p></div>';
  h += '<div class="bloc"><h2><i class="bi bi-6-circle"></i> Les six lettres</h2>' + lettresHTML() + '</div>';
  h += '<div class="bloc"><h2><i class="bi bi-patch-check"></i> Valider mon projet : de quoi parle-t-on ?</h2><p>Valider un projet, c’est vérifier avant de se lancer qu’il est réaliste, faisable et bien connu du terrain. Trois questions :</p><ol class="mb-1"><li><b>Est-il réaliste ?</b> Mes compétences se rapprochent-elles de celles attendues ? Sinon, une formation peut réduire l’écart.</li><li><b>Est-il faisable ?</b> Y a-t-il des offres près de chez moi ? Mes contraintes (horaires, déplacements, garde d’enfants) sont-elles compatibles ?</li><li><b>Est-ce que je connais vraiment ce métier ?</b> En rencontrant des professionnels, puis en observant, voire en pratiquant quelques jours sur place : c’est l’immersion. Après cela, vous savez si vous vous voyez exercer ce métier.</li></ol><p class="note mb-0">D’après les sites de France Travail et de Choisir le service public, consultés le ' + DATE + '. Un mot à ajouter au Lexique.</p></div>';
  h += '<div class="bloc"><h2><i class="bi bi-7-circle"></i> Rencontrer, essayer, être accompagné</h2><ul class="mb-1"><li><b>Rencontrer</b> un professionnel pour poser vos questions : <a href="https://www.ambassadeursmetiers.fr" target="_blank" rel="noopener">Ambassadeurs Métiers</a> (Nouvelle-Aquitaine), ExplorJob ou My Job Glasses (toute la France).</li><li><b>Essayer</b> par une immersion courte, pour valider votre projet : <a href="https://immersion-facile.beta.gouv.fr" target="_blank" rel="noopener">Immersion facilitée</a> (site du gouvernement), avec votre conseiller. Deux à trois immersions de quelques jours, dans des structures différentes, donnent une vue d’ensemble.</li></ul><div class="boutons-ligne mb-2"><a class="btn btn-outline-primary" href="https://immersion-facile.beta.gouv.fr" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Ouvrir Immersion facilitée</a><a class="btn btn-outline-primary" href="https://www.ambassadeursmetiers.fr" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Ouvrir Ambassadeurs Métiers</a></div><p class="note mb-1">Types de structures : établissements d’accueil, services à domicile, associations, collectivités. Aucun nom d’entreprise n’est donné ici.</p>' +
    '<p class="mb-0">' + ({ oui: 'Parlez de cette lecture à la personne qui vous accompagne : elle peut vous aider à choisir.', non: 'Se faire accompagner peut beaucoup aider : un conseiller France Travail ou de votre mission locale peut vous recevoir.', jamais: 'Vous pouvez contacter ERIP : lors d’un rendez-vous, vous explorez d’autres pistes ensemble avec les outils du dispositif.' }[ETAT.suivi]) + '</p><p class="note mb-0">Sources et conditions vérifiées le ' + DATE + ' ; elles peuvent changer.</p></div>';
  h += '<div class="bloc"><h2><i class="bi bi-8-circle"></i> Questions pour un conseiller</h2><ul class="mb-0"><li>Quelle formation, et de quel niveau, pour la première piste près de chez moi ?</li><li>Comment tester ce métier avant de m’engager ?</li><li>Quelles aides pour une remise à niveau ?</li></ul></div>';
  h += '<div class="bloc bloc-synth"><h2><i class="bi bi-briefcase"></i> Chercher des offres</h2><p>Choisissez parmi les métiers de vos tests et ceux de cette lecture, puis votre territoire.</p><div class="boutons-ligne"><button type="button" class="btn btn-primary" data-go="offres"><i class="bi bi-search"></i> Chercher des offres</button><button type="button" class="btn btn-outline-primary"><i class="bi bi-save"></i> Garder dans la disquette</button><button type="button" class="btn btn-outline-primary" data-go="impression"><i class="bi bi-printer"></i> Imprimer ou enregistrer en PDF</button></div></div>';
  return h;
}

/* ---------- Feuille imprimée ---------- */

  h += '<h2>3. Mes six lettres</h2>' + (ETAT.p3 ? '<p>' + ord.map(function (l) { return NOMS_LETTRES[l] + ' ' + c[l] + ' %'; }).join(' ; ') + '.</p><p>Métiers proches de mes lettres : ' + LETTRES_METIERS.map(function (x) { return e(x[0]) + ' (' + x[1] + ')'; }).join(' ; ') + '.</p>' : '<p>Pas encore fait.</p>');
  h += '<h2>4. Ce que mes passages ont en commun</h2><p>Métiers qui reviennent, compétences qui ressortent, lettres et métier retenu, ce que chaque passage ajoute, ce qui diffère (calculés par l’application).</p>';
  h += '<h2>5. Mon parcours et mes compétences</h2>' + (ETAT.parcours ? '<p>Métiers exercés : ' + EXEMPLE.parcours.map(function (p) { return e(p[0]) + ' (' + p[1].join(', ') + ')'; }).join(' ; ') + '.</p><p>Du métier exercé (' + COMPARE.exerce + ') au métier visé (' + COMPARE.vise + ') : transférables : ' + COMPARE.transferables.join(', ') + ' ; transversales : ' + COMPARE.transversales.join(', ') + ' ; à acquérir : ' + COMPARE.acquerir.join(', ') + '.</p>' : '<p>Pas encore ajouté.</p>');
  h += '<h2>6. Ma situation</h2><p>Niveau d’études : ' + NIVEAUX[ETAT.niveauPers] + '. ' + ({ oui: 'Accompagné(e) par un professionnel.', non: 'Pas accompagné(e) pour l’instant.', jamais: 'Jamais accompagné(e).' }[ETAT.suivi]) + '</p>';

  h += '<h2>8. Valider mon projet</h2><ul><li>☐ Je compare mes compétences à celles attendues</li><li>☐ Je vérifie les offres près de chez moi (' + d.nom + ') et mes contraintes</li><li>☐ Je rencontre un professionnel (enquête métier)</li><li>☐ Je fais deux ou trois immersions courtes (immersion-facile.beta.gouv.fr)</li><li>☐ Je me demande : est-ce que je me vois exercer ce métier ?</li></ul>';
  h += '<h2>9. Questions pour mon conseiller</h2><ul><li>Quelle formation, et de quel niveau, près de chez moi ?</li><li>Comment tester ce métier avant de m’engager ?</li></ul>' +
    '<div class="pied">Rien n’a été envoyé : cette feuille a été produite sur l’appareil de la personne. Sources : France Travail, enquête Besoins en main-d’œuvre 2026 ; sites France Travail et Choisir le service public (consultés le ' + DATE + ').</div></div><div class="boutons-ligne" style="justify-content:center"><button type="button" class="btn btn-primary"><i class="bi bi-printer"></i> Lancer l’impression</button><button type="button" class="btn btn-outline-secondary" data-go="synthese">Retour à ma synthèse</button></div>';
  return h;
}

var ECRANS = [['accueil', 'Accueil du module'], ['synthese', 'Ma synthèse'], ['demande', 'Demande'], ['collage', 'Réponse collée'], ['lecture', 'Ma lecture'], ['offres', 'Chercher des offres'], ['impression', 'Feuille imprimée']];
var TOGGLES = [['p1', 'Passage 1'], ['p2', 'Passage 2'], ['p3', 'Passage 3'], ['parcours', 'Parcours ajouté'], ['libre', 'Dans mes mots'], ['lect', 'Lecture collée']];
var RETIENT = {
  accueil: ['Quatre cartes inchangées (la carte du questionnaire dit désormais « questions numérotées, sans bonne ni mauvaise réponse »). Option : une entrée à part « D’un métier à un autre » (réglage ci-dessous).', 'Bloc « Ma synthèse » seulement s’il y a un résultat, avec « Voir ma synthèse » et « Refaire tout le chemin » (avec confirmation).', 'À mettre aussi à jour avant les vidéos : vidéo d’introduction, présentation du module, infobulle de la carte, aide guidée, fonction disquette, recherche.'],
  synthese: ['Accès : la synthèse existe dès UN résultat ; la lecture aussi, en disant ce qui manque (essayez de décocher des passages).', 'Passage 1 : UN seul métier retenu par le bouton « Retenir pour ma synthèse ». C’est la demande qui dit s’il s’agit du métier le mieux classé ou d’un métier proche (et lequel était recommandé).', 'La fiche du métier retenu ne dit que ce qui est vrai : recrutement du territoire seulement si le métier figure dans l’enquête, turnover seulement pour le commerce. Sinon : aucune affirmation.', 'Passage 2 : les deux versants, « je ferais facilement » et « ce qui serait difficile », et le pourcentage de chaque métier.', 'Passage 3 : les six lettres ; les deux premières en fort, la troisième en teinte intermédiaire si elle se démarque, les autres discrètes ; trois lettres à égalité : toutes en fort (essayez « Trois lettres à égalité »).', '« Ce que les tests ne disent pas » : niveau d’études, accompagnement, compléments par clics, texte libre avec avertissement. « Rejoindre un document » : plus tard.', '« Chez moi » ne montre que les pistes de la personne qui figurent dans l’enquête du territoire (changez de département pour voir les deux cas) : jamais une liste générale. « Ma synthèse par recoupement » est calculée par l’application, sans assistant.', 'Le bouton « Interpréter ma synthèse » déclenche la demande. Les offres viennent après, dans une demande à part.'],
  collage: ['Écran « collez la réponse » : même composant que pour le CV. Le bouton de l’écran précédent y emmène directement.'],
  demande: ['UNE seule réponse, de longueur raisonnable, avec des titres fixes. Aucune note, aucune solution : des pistes.', 'La demande contient : métier retenu (+ recommandé si différent), compétences choisies et demandées, choix des deux versants, six pourcentages, parcours, niveau d’études, accompagnement, mots libres, territoire.', 'Elle demande de comparer le niveau d’études, de nommer les compétences transférables et transversales, de distinguer rencontre et immersion, d’encourager l’accompagnement. Même écran « collez la réponse » que le CV.'],
  lecture: ['Réponse mise en page par l’application : trois lectures (compétences, envies, lettres), ce qui se retrouve et diffère, trois pistes avec « ce qui va dans le sens » et « à vérifier », niveau d’études, compétences transférables et transversales, six lettres, camembert « déjà pratiquées / à construire » (jamais une note), rencontre et immersion, accompagnement selon la situation, questions.', 'Changez le niveau d’études dans « Cas à essayer » : l’encadré sur la remise à niveau apparaît ou disparaît.', 'Textes sur l’immersion et les rencontres : voir docs/RECHERCHE_IMMERSION_ET_ENQUETE_METIER_2026-11-18.md (vérifiés le 18/11/2026, à revérifier avant la mise en ligne).'],
  offres: ['Demande d’offres à part : on choisit parmi les métiers des tests ET ceux de la lecture, cinq au plus, puis le territoire. Si le niveau ne suffit pas, la demande le dit.'],
  impression: ['Feuille simple, noir sur blanc, produite sur l’appareil. Elle reprend tout ce qui est fait, y compris la lecture.']
};
var CAS = [
  ['retenu', 'recommande', 'Métier retenu : le mieux classé'], ['retenu', 'proche', 'Métier retenu : un métier proche'], ['retenu', 'commerce', 'Métier retenu : commerce (turnover)'], ['retenu', 'aucun', 'Aucun métier retenu'], ['p2', false, 'Sans passage 2'], ['p3', false, 'Sans passage 3'],
  ['niveauPers', 0, 'Niveau : sans diplôme'], ['niveauPers', 1, 'Niveau : CAP ou BEP'], ['niveauPers', 4, 'Niveau : Bac + 3'],
  ['egalite', true, 'Trois lettres à égalité'], ['egalite', false, 'Lettres normales'],
  ['suivi', 'oui', 'Accompagné'], ['suivi', 'non', 'Pas pour l’instant'], ['suivi', 'jamais', 'Jamais accompagné']
];
var VARIABLES = [
  ['vParcours', 'Parcours professionnel', [['fiche', 'Chercher un métier et cliquer ses compétences (recommandé)'], ['cv', 'Déposer un CV']]],
  ['vPasserelle', 'Entrée à part « D’un métier à un autre »', [['non', 'Non pour l’instant (recommandé)'], ['oui', 'Oui, sur l’accueil']]]
];

function barre() {
  var retour = { synthese: 'accueil', demande: 'synthese', collage: 'demande', lecture: 'synthese', offres: 'lecture', impression: 'synthese' }[ETAT.ecran];
  return '<div class="barre-navigation-fixe"><div class="barre"><span>' + (retour ? '<button class="btn btn-nav-erip btn-lg" data-go="' + retour + '">&#8592; Retour</button>' : '') + '</span><button class="btn btn-nav-erip btn-accueil" type="button"><i class="bi bi-house-door" aria-hidden="true"></i> Accueil</button><span></span></div></div>';
}
function rendre() {
  document.documentElement.setAttribute('data-theme', ETAT.sombre ? 'sombre' : 'clair');
  var p = document.getElementById('mqPage');
  p.className = 'mq-page' + (ETAT.tel ? ' tel' : '');
  var F = { accueil: ecranAccueil, synthese: ecranSynthese, demande: ecranDemande, collage: ecranCollage, lecture: ecranLecture, offres: ecranOffres, impression: ecranImpression };
  p.innerHTML = F[ETAT.ecran]();
  document.getElementById('mqBas').innerHTML = barre();
  document.getElementById('mqEcrans').innerHTML = ECRANS.map(function (x) { return '<button type="button" class="btn btn-sm ' + (x[0] === ETAT.ecran ? 'btn-primary' : 'btn-outline-primary') + '" data-go="' + x[0] + '">' + x[1] + '</button>'; }).join('');
  document.getElementById('mqRempl').innerHTML = TOGGLES.map(function (x) { return '<button type="button" class="btn btn-sm ' + (ETAT[x[0]] ? 'btn-primary' : 'btn-outline-secondary') + '" data-tog="' + x[0] + '" aria-pressed="' + ETAT[x[0]] + '">' + (ETAT[x[0]] ? '✓ ' : '') + x[1] + '</button>'; }).join('');
  document.getElementById('mqCas').innerHTML = CAS.map(function (x, i) { return '<button type="button" class="btn btn-sm ' + (ETAT[x[0]] === x[1] ? 'btn-primary' : 'btn-outline-secondary') + '" data-cas="' + i + '">' + x[2] + '</button>'; }).join('');
  document.getElementById('mqVar').innerHTML = VARIABLES.map(function (v) { return '<span class="note">' + v[1] + ' :</span> ' + v[2].map(function (o) { return '<button type="button" class="btn btn-sm ' + (ETAT[v[0]] === o[0] ? 'btn-primary' : 'btn-outline-secondary') + '" data-var="' + v[0] + '" data-val="' + o[0] + '">' + o[1] + '</button>'; }).join(' ') + '<br>'; }).join('');
  document.getElementById('mqRetient').innerHTML = '<b>Ce que cet écran retient</b>' + (RETIENT[ETAT.ecran] || []).map(function (t) { return '<p>• ' + t + '</p>'; }).join('');
  document.getElementById('mqLarge').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-outline-primary' : 'btn-primary');
  document.getElementById('mqTel').className = 'btn btn-sm ' + (ETAT.tel ? 'btn-primary' : 'btn-outline-primary');
  document.getElementById('mqTheme').textContent = ETAT.sombre ? 'Mode clair' : 'Mode sombre';
  document.getElementById('mqRegl').style.display = ETAT.regl ? '' : 'none';
  document.getElementById('mqRouvrir').style.display = ETAT.regl ? 'none' : 'inline-flex';
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-go],[data-dep],[data-tog],[data-var],[data-lect],[data-retenir],[data-niv],[data-suivi],[data-comp],[data-cas],[data-graphe]');
  if (!t) { return; }
  var d = t.dataset;
  if (d.go) { ETAT.ecran = d.go; window.scrollTo(0, 0); }
  if (d.dep) { ETAT.dep = d.dep; }
  if (d.tog) { ETAT[d.tog] = !ETAT[d.tog]; }
  if (d.lect) { ETAT.lect = true; ETAT.ecran = 'lecture'; window.scrollTo(0, 0); }
  if (d.retenir) { ETAT.retenu = d.retenir; ETAT.p1 = d.retenir !== 'aucun'; }
  if (d.niv !== undefined) { ETAT.niveauPers = +d.niv; }
  if (d.suivi) { ETAT.suivi = d.suivi; }
  if (d.comp !== undefined) { ETAT.complements[d.comp] = !ETAT.complements[d.comp]; }
  if (d.graphe) { ETAT.grapheCache = !ETAT.grapheCache; }
  if (d.cas !== undefined) { var c = CAS[+d.cas]; ETAT[c[0]] = c[1]; if (c[0] === 'retenu') { ETAT.p1 = c[1] !== 'aucun'; } }
  if (d.var) { ETAT[d.var] = d.val; }
  rendre();
});
document.getElementById('mqLarge').onclick = function () { ETAT.tel = false; rendre(); };
document.getElementById('mqTel').onclick = function () { ETAT.tel = true; rendre(); };
document.getElementById('mqTheme').onclick = function () { ETAT.sombre = !ETAT.sombre; rendre(); };
document.getElementById('mqFermer').onclick = function () { ETAT.regl = false; rendre(); };
document.getElementById('mqRouvrir').onclick = function () { ETAT.regl = true; rendre(); };
rendre();
</script>
</body>
</html>
