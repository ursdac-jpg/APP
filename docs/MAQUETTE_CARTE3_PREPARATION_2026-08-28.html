<!doctype html>
<meta charset="UTF-8">
<title>Carte 3 - Préparation avant génération</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ground: #eef2f6;
    --bg-card: #ffffff;
    --bg-subtle: #f4f7fa;
    --border: #e2e8f0;
    --accent: #0d6efd;
    --accent-bg: #edf4ff;
    --success: #157347;
    --success-bg: #e7f6ee;
    --amber: #b25e00;
    --amber-bg: #fdf3e6;
    --text: #1f2937;
    --text-muted: #4a5b6e;
    --text-faint: #7c8b96;
    --chip-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10141b; --bg-card: #1b212c; --bg-subtle: #222a36; --border: #313a4a;
      --accent: #4d94ff; --accent-bg: #22314a;
      --success: #45c98a; --success-bg: #1d3a2c; --amber: #e6a15c; --amber-bg: #3a2c1a;
      --text: #e7ecf2; --text-muted: #a8b3c4; --text-faint: #7c8b96; --chip-bg: #232b38;
    }
  }
  :root[data-theme="dark"] {
    --ground: #10141b; --bg-card: #1b212c; --bg-subtle: #222a36; --border: #313a4a;
    --accent: #4d94ff; --accent-bg: #22314a;
    --success: #45c98a; --success-bg: #1d3a2c; --amber: #e6a15c; --amber-bg: #3a2c1a;
    --text: #e7ecf2; --text-muted: #a8b3c4; --text-faint: #7c8b96; --chip-bg: #232b38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    padding: 1.5rem 1.25rem 4rem; line-height: 1.5;
  }
  .page { max-width: 760px; margin: 0 auto; }

  .barre-demo {
    max-width: 760px; margin: 0 auto 1.5rem; background: var(--bg-card);
    border: 2px dashed var(--accent); border-radius: 1rem; padding: 0.9rem 1.1rem;
    font-size: 0.85rem;
  }
  .barre-demo strong { color: var(--accent); }
  .barre-demo label { display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 1.2rem; cursor: pointer; }
  .barre-demo .ligne { margin-top: 0.55rem; }

  h1 { font-size: 1.55rem; margin: 0 0 0.4rem; }
  h2 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  .sousTitre { color: var(--text-muted); margin: 0 0 1.6rem; }

  .fil { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }
  .fil span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .fil span.fait { background: var(--success); }
  .fil span.encours { background: var(--accent); }

  .carte {
    background: var(--bg-card); border: 2px solid var(--border); border-radius: 1.1rem;
    padding: 1.2rem 1.3rem; margin-bottom: 1rem;
  }
  .carte .titreExp { font-weight: 700; font-size: 1.02rem; margin: 0 0 0.2rem; }
  .carte .dim { font-size: 0.78rem; color: var(--text-faint); margin: 0 0 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .carte .reco { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 0.9rem; }

  .phrase { font-size: 1rem; line-height: 2.1; }
  .phrase input {
    width: 4.5rem; text-align: center; font-size: 1rem; font-weight: 700; color: var(--accent);
    border: none; border-bottom: 2px solid var(--accent); background: var(--accent-bg);
    border-radius: 6px 6px 0 0; padding: 0.15rem 0.3rem; margin: 0 0.15rem;
  }
  .phrase input.large { width: 7rem; }
  .phrase input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .champ-metier {
    width: 100%; font-size: 1rem; padding: 0.7rem 0.9rem; border-radius: 0.7rem;
    border: 2px solid var(--border); background: var(--bg-card); color: var(--text);
  }
  .champ-metier:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,110,253,0.15); }

  .encart {
    background: var(--bg-subtle); border-radius: 0.8rem; padding: 0.9rem 1.1rem;
    font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.2rem;
  }
  .encart-amber { background: var(--amber-bg); color: var(--amber); }

  .avant-apres { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; font-size: 0.85rem; margin-top: 0.5rem; }
  .avant-apres > div { border-radius: 0.6rem; padding: 0.6rem 0.75rem; }
  .avant-apres .avant { background: var(--bg-subtle); color: var(--text-muted); }
  .avant-apres .apres { background: var(--accent-bg); }
  .avant-apres strong { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
  .ligne-relecture { display: flex; gap: 0.7rem; align-items: flex-start; }
  .ligne-relecture input[type=checkbox] { width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex-shrink: 0; }

  .boutons { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.4rem; }
  .pied { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; }
  .pied-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  button.b {
    font-size: 0.95rem; font-weight: 600; border-radius: 0.7rem; padding: 0.7rem 1.3rem;
    border: 2px solid var(--accent); cursor: pointer; background: var(--accent); color: #fff;
  }
  button.b.creux { background: transparent; color: var(--accent); }
  button.b.gris { background: transparent; color: var(--text-muted); border-color: var(--border); }
  button.b:hover { filter: brightness(1.05); }

  .pastilleInfo {
    display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 999px;
    padding: 0.15rem 0.55rem; background: var(--chip-bg); color: var(--text-muted); margin-left: 0.4rem;
  }
  .cache { display: none; }
  .note-bas { margin-top: 2rem; font-size: 0.8rem; color: var(--text-faint); }

  /* Bandeau qui dit, pour CHAQUE écran, s'il est nouveau (à concevoir)
     ou s'il existe déjà dans l'application (montré ici pour la continuité). */
  .bandeau { border-radius: 0.7rem; padding: 0.7rem 1rem; margin-bottom: 1.1rem; font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: baseline; }
  .bandeau .etiq { font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.72rem; white-space: nowrap; }
  .bandeau.nouveau { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent); }
  .bandeau.existant { background: var(--chip-bg); color: var(--text-muted); border: 1px solid var(--border); }
</style>

<div class="barre-demo">
  <strong>Maquette de travail</strong> - parcours simulé, aucun appel à une IA. Choisissez un scénario puis cliquez « Rejouer depuis le début ».
  <div class="ligne" style="margin-top:0.4rem">
    <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:4px"></span> Écran <strong>nouveau</strong> (à concevoir ensemble)
    &nbsp;&nbsp;
    <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--text-faint);vertical-align:middle;margin-right:4px"></span> Écran <strong>déjà dans l'application</strong> (montré pour la continuité)
  </div>
  <div class="ligne">
    <label><input type="radio" name="metier" value="manquant" checked> Métier visé non renseigné</label>
    <label><input type="radio" name="metier" value="rempli"> Métier visé déjà renseigné</label>
  </div>
  <div class="ligne">
    <label><input type="radio" name="chiffres" value="avec" checked> La personne saisit des chiffres</label>
    <label><input type="radio" name="chiffres" value="sans"> La personne clique « je n'ai pas de chiffres »</label>
  </div>
  <div class="ligne"><button class="b creux" style="font-size:0.82rem;padding:0.4rem 0.9rem" onclick="rejouer()">Rejouer depuis le début</button></div>
</div>

<div class="page" id="app"></div>

<script>
/* ------------------------------------------------------------------
   Données simulées : une personne qui a fait le bilan.
   3 expériences dans son CV. Le 1er prompt (bilan) a produit,
   pour les recommandations "impact / crédibilité", une phrase à
   trous prête à compléter (OPTION A).
   ------------------------------------------------------------------ */
var EXPERIENCES = [
  {
    id: 'exp1',
    titre: "Agent d'accueil - Mairie de Valence (2019-2022)",
    dimension: "Impact / valeur démontrée",
    reco: "Vos missions d'accueil sont décrites sans ordre de grandeur : un recruteur ne peut pas mesurer le volume que vous gériez.",
    missionActuelle: "Accueil du public, orientation des usagers, gestion du courrier.",
    // segments : texte fixe / trou (avec exemple)
    phrase: [
      { t: "Sur ce poste, j'accueillais en moyenne " },
      { trou: "nb_personnes", ex: "80", large: false },
      { t: " personnes par jour et je traitais environ " },
      { trou: "nb_dossiers", ex: "40", large: false },
      { t: " dossiers administratifs par semaine." }
    ],
    apresAvecChiffres: function (v) {
      var p = v.nb_personnes ? "d'environ " + v.nb_personnes + " personnes par jour" : "d'un public nombreux au quotidien";
      var d = v.nb_dossiers ? "de " + v.nb_dossiers + " dossiers administratifs par semaine" : "de dossiers administratifs de façon régulière";
      return "Accueil physique et téléphonique " + p + " ; traitement " + d + " ; orientation des usagers et gestion du courrier.";
    },
    apresGeneral: "Accueil physique et téléphonique d'un flux quotidien important d'usagers ; traitement régulier de dossiers administratifs ; orientation du public et gestion du courrier."
  },
  {
    id: 'exp2',
    titre: "Vendeur - Boulangerie Le Fournil (2022-2023)",
    dimension: "Crédibilité",
    reco: "L'expérience en vente est mentionnée mais rien ne montre le rythme réel ni les responsabilités tenues.",
    missionActuelle: "Vente, encaissement, mise en rayon.",
    phrase: [
      { t: "Je servais environ " },
      { trou: "nb_clients", ex: "150", large: false },
      { t: " clients par jour et je gérais une caisse d'environ " },
      { trou: "montant_caisse", ex: "1 200", large: true },
      { t: " € par jour." }
    ],
    apresAvecChiffres: function (v) {
      var c = v.nb_clients ? "d'environ " + v.nb_clients + " clients par jour" : "d'une clientèle nombreuse en rythme soutenu";
      var m = v.montant_caisse ? "d'environ " + v.montant_caisse + " € par jour" : "quotidienne";
      return "Vente et conseil auprès " + c + " ; tenue d'une caisse " + m + " ; mise en rayon et gestion des invendus.";
    },
    apresGeneral: "Vente et conseil auprès d'une clientèle nombreuse en rythme soutenu ; tenue de caisse quotidienne ; mise en rayon et gestion des invendus."
  },
  {
    id: 'exp3',
    titre: "Bénévole - Association Solidarité Alimentaire (2020-2023)",
    dimension: "Impact / valeur démontrée",
    reco: "Cet engagement associatif est un vrai atout mais il reste vague : de quelle ampleur parle-t-on ?",
    missionActuelle: "Aide à la distribution alimentaire, accueil des bénéficiaires.",
    phrase: [
      { t: "Je participais à la distribution d'environ " },
      { trou: "nb_colis", ex: "60", large: false },
      { t: " colis alimentaires par semaine auprès de " },
      { trou: "nb_familles", ex: "45", large: false },
      { t: " familles." }
    ],
    apresAvecChiffres: function (v) {
      var co = v.nb_colis ? "d'environ " + v.nb_colis + " colis alimentaires" : "de colis alimentaires";
      var f = v.nb_familles ? "auprès de " + v.nb_familles + " familles" : "auprès de nombreuses familles";
      return "Participation hebdomadaire à la distribution " + co + " " + f + " ; accueil et écoute des bénéficiaires.";
    },
    apresGeneral: "Participation régulière à la distribution alimentaire auprès de nombreuses familles ; accueil et écoute des bénéficiaires."
  }
];

var etat = { ecran: 0, metierSaisi: "", chiffres: {}, chiffresPasses: false, coche: {} };
EXPERIENCES.forEach(function (e) { etat.coche[e.id] = true; });

function scenarioMetier() { return document.querySelector('input[name=metier]:checked').value; }
function scenarioChiffres() { return document.querySelector('input[name=chiffres]:checked').value; }

function rejouer() {
  var metierPreRempli = scenarioMetier() === 'rempli' ? "Assistant administratif" : "";
  etat = { ecran: 0, metierSaisi: metierPreRempli, chiffres: {}, chiffresPasses: false, coche: {} };
  EXPERIENCES.forEach(function (e) { etat.coche[e.id] = true; });
  rendre();
}

/* Enchaînement des écrans, en tenant compte du scénario choisi. */
function ecrans() {
  var liste = ['intro'];
  if (scenarioMetier() === 'manquant') { liste.push('metier'); }
  liste.push('chiffres', 'generation', 'relecture', 'fin');
  return liste;
}
function suivant() { etat.ecran = Math.min(etat.ecran + 1, ecrans().length - 1); rendre(); }
function precedent() { etat.ecran = Math.max(etat.ecran - 1, 0); rendre(); }

function fil(idx, total) {
  var h = '<div class="fil">';
  for (var i = 0; i < total; i++) {
    h += '<span class="' + (i < idx ? 'fait' : (i === idx ? 'encours' : '')) + '"></span>';
  }
  return h + '</div>';
}

// Pour chaque écran : est-il NOUVEAU (à concevoir) ou DÉJÀ dans l'application ?
var BANDEAUX = {
  intro:      ['nouveau',  'Proposition à valider - cet écran d\'introduction n\'existe pas aujourd\'hui.'],
  metier:     ['nouveau',  'Nouvel écran - c\'est ce qu\'on est en train de concevoir.'],
  chiffres:   ['nouveau',  'Nouvel écran - le cœur de ce qu\'on conçoit (les phrases à trous).'],
  generation: ['existant', 'Écran déjà dans l\'application. En vrai : vous choisissez une IA, vous copiez un texte, vous le collez dans ChatGPT ou Claude, vous récupérez la réponse et vous la recollez. Ici c\'est simulé et instantané.'],
  relecture:  ['existant', 'Écran déjà dans l\'application (avant / après, cases à cocher). Montré ici pour la continuité. Puis « Appliquer » écrit le texte dans votre CV.'],
  fin:        ['existant', 'Écran de fin déjà dans l\'application. Seuls les textes explicatifs des 2 boutons sont enrichis (proposition).']
};
function bandeau(nom) {
  var b = BANDEAUX[nom]; if (!b) return '';
  return '<div class="bandeau ' + b[0] + '"><span class="etiq">' +
    (b[0] === 'nouveau' ? 'Nouvel écran' : 'Écran existant') + '</span><span>' + b[1] + '</span></div>';
}

function rendre() {
  var nom = ecrans()[etat.ecran];
  var app = document.getElementById('app');
  var total = ecrans().length;
  var corps;
  if (nom === 'intro') corps = ecranIntro(total);
  else if (nom === 'metier') corps = ecranMetier(total);
  else if (nom === 'chiffres') corps = ecranChiffres(total);
  else if (nom === 'generation') { corps = ecranGeneration(total); setTimeout(suivant, 1400); }
  else if (nom === 'relecture') corps = ecranRelecture(total);
  else if (nom === 'fin') corps = ecranFin(total);
  app.innerHTML = bandeau(nom) + corps;
  brancher();
}

function ecranIntro(total) {
  return fil(0, total) +
    '<h1>Se faire accompagner du début à la fin</h1>' +
    '<p class="sousTitre">L\'assistant va rédiger les améliorations de votre bilan et les intégrer à votre CV. Vous validez chaque changement avant qu\'il soit appliqué.</p>' +
    '<div class="encart">' +
    '<strong>Ce qui va se passer :</strong>' +
    '<ol style="margin:0.5rem 0 0;padding-left:1.2rem;">' +
    '<li>Vous précisez le poste que vous visez (facultatif).</li>' +
    '<li>Vous ajoutez vos chiffres là où c\'est utile (facultatif).</li>' +
    '<li>L\'assistant prépare toutes les propositions en une seule fois.</li>' +
    '<li>Vous relisez chaque avant / après et vous cochez ce que vous gardez.</li>' +
    '</ol></div>' +
    '<div class="boutons"><button class="b" onclick="suivant()">Commencer</button></div>';
}

function ecranMetier(total) {
  return fil(1, total) +
    '<h2>Quel poste visez-vous&nbsp;?</h2>' +
    '<div class="encart">Une recommandation de votre bilan concerne l\'adéquation entre votre CV et le poste visé. ' +
    'Si vous le précisez, l\'assistant adaptera le vocabulaire de vos expériences à ce métier. ' +
    '<strong>Ce n\'est pas obligatoire</strong>&nbsp;: sans cette information, l\'assistant restera plus général.</div>' +
    '<input class="champ-metier" id="champMetier" placeholder="Ex. Assistant administratif, Vendeur en boulangerie, Agent d\'accueil…" value="' + escapeAttr(etat.metierSaisi) + '">' +
    '<div class="pied">' +
    '<button class="b gris" onclick="precedent()">&larr; Retour</button>' +
    '<div class="pied-actions">' +
    '<button class="b gris" onclick="validerMetier(false)">Continuer sans préciser</button>' +
    '<button class="b" onclick="validerMetier(true)">Continuer</button>' +
    '</div></div>';
}
function validerMetier(garder) {
  var v = document.getElementById('champMetier').value.trim();
  etat.metierSaisi = garder ? v : "";
  suivant();
}

function ecranChiffres(total) {
  var idx = scenarioMetier() === 'manquant' ? 2 : 1;
  var cartes = EXPERIENCES.map(function (e) {
    var segs = e.phrase.map(function (s) {
      if (s.t) return '<span>' + escapeHtml(s.t) + '</span>';
      var val = (etat.chiffres[e.id] && etat.chiffres[e.id][s.trou]) || '';
      return '<input class="' + (s.large ? 'large' : '') + '" data-exp="' + e.id + '" data-trou="' + s.trou + '" placeholder="' + s.ex + '" value="' + escapeAttr(val) + '">';
    }).join('');
    return '<div class="carte">' +
      '<p class="titreExp">' + escapeHtml(e.titre) + '</p>' +
      '<p class="dim">' + escapeHtml(e.dimension) + '</p>' +
      '<p class="reco">' + escapeHtml(e.reco) + '</p>' +
      '<div class="phrase">' + segs + '</div>' +
      '</div>';
  }).join('');
  return fil(idx, total) +
    '<h2>Vos chiffres</h2>' +
    '<div class="encart">Complétez les phrases ci-dessous&nbsp;: elles rendront votre CV beaucoup plus concret. ' +
    '<strong>Laissez vide ce que vous ne savez pas</strong> - l\'assistant restera alors général sur ces points, sans jamais inventer de chiffre. ' +
    'Les chiffres approximatifs («&nbsp;environ&nbsp;») sont acceptés.</div>' +
    cartes +
    '<div class="pied">' +
    '<button class="b gris" onclick="precedent()">&larr; Retour</button>' +
    '<div class="pied-actions">' +
    '<button class="b gris" onclick="allerGeneration(true)">Passer cette étape</button>' +
    '<button class="b" onclick="allerGeneration(false)">Continuer</button>' +
    '</div></div>';
}
function allerGeneration(passe) {
  // récupère les saisies
  document.querySelectorAll('.phrase input').forEach(function (inp) {
    var e = inp.dataset.exp, tr = inp.dataset.trou;
    etat.chiffres[e] = etat.chiffres[e] || {};
    etat.chiffres[e][tr] = inp.value.trim();
  });
  etat.chiffresPasses = passe || scenarioChiffres() === 'sans';
  suivant();
}

function ecranGeneration(total) {
  var idx = scenarioMetier() === 'manquant' ? 3 : 2;
  return fil(idx, total) +
    '<h2>L\'assistant prépare vos propositions…</h2>' +
    '<p class="sousTitre">Un seul aller-retour, pour toutes les recommandations à la fois.</p>' +
    '<div class="encart">' + (etat.chiffresPasses
      ? 'Vous n\'avez pas ajouté de chiffres&nbsp;: les propositions resteront générales sur les volumes, mais seront quand même adaptées' + (etat.metierSaisi ? ' au poste de <strong>' + escapeHtml(etat.metierSaisi) + '</strong>.' : '.')
      : 'Vos chiffres sont transmis à l\'assistant' + (etat.metierSaisi ? ', avec le poste visé (<strong>' + escapeHtml(etat.metierSaisi) + '</strong>).' : '.')) +
    '</div>';
}

function ecranRelecture(total) {
  var idx = scenarioMetier() === 'manquant' ? 4 : 3;
  var lignes = EXPERIENCES.map(function (e) {
    var v = etat.chiffres[e.id] || {};
    var apres = etat.chiffresPasses ? e.apresGeneral : e.apresAvecChiffres(v);
    var noteGen = etat.chiffresPasses
      ? '<p class="reco" style="margin:0.5rem 0 0;color:var(--amber)">Vous pourrez ajouter vos chiffres plus tard en modifiant ce texte.</p>' : '';
    return '<div class="carte">' +
      '<div class="ligne-relecture">' +
      '<input type="checkbox" data-coche="' + e.id + '" ' + (etat.coche[e.id] ? 'checked' : '') + '>' +
      '<div style="flex:1">' +
      '<p class="titreExp" style="margin-bottom:0.1rem">' + escapeHtml(e.titre) + '</p>' +
      '<p class="dim">' + escapeHtml(e.dimension) + '</p>' +
      '<div class="avant-apres">' +
      '<div class="avant"><strong>Actuellement</strong>' + escapeHtml(e.missionActuelle) + '</div>' +
      '<div class="apres"><strong>Après application</strong>' + escapeHtml(apres) + '</div>' +
      '</div>' + noteGen +
      '</div></div></div>';
  }).join('');
  var nbCoche = EXPERIENCES.filter(function (e) { return etat.coche[e.id]; }).length;
  return fil(idx, total) +
    '<h2>Relisez et validez chaque modification</h2>' +
    '<p class="sousTitre">Décochez ce que vous ne souhaitez pas appliquer. Rien n\'est encore écrit dans votre CV.</p>' +
    lignes +
    '<div class="encart">' + nbCoche + ' modification(s) sélectionnée(s) sur ' + EXPERIENCES.length + '</div>' +
    '<div class="pied">' +
    '<button class="b gris" onclick="precedent()">&larr; Retour</button>' +
    '<div class="pied-actions"><button class="b" onclick="suivant()">Appliquer les modifications sélectionnées</button></div>' +
    '</div>';
}

function ecranFin(total) {
  var nbApplique = EXPERIENCES.filter(function (e) { return etat.coche[e.id]; }).length;
  return fil(total - 1, total) +
    '<h2>C\'est appliqué à votre CV</h2>' +
    '<div class="encart encart-amber" style="background:var(--success-bg);color:var(--success)">' +
    nbApplique + ' modification(s) intégrée(s) à vos expériences. ' +
    (etat.metierSaisi ? 'Vocabulaire adapté au poste : <strong>' + escapeHtml(etat.metierSaisi) + '</strong>. ' : '') +
    'Vous pouvez maintenant mettre votre CV en forme et le télécharger, ou relancer une analyse.</div>' +

    '<div class="carte">' +
    '<p class="titreExp">Mettre en forme et télécharger mon CV</p>' +
    '<p class="reco" style="margin-bottom:0.9rem">Vos corrections sont déjà dans votre CV. Cette étape ouvre l\'atelier de mise en forme (modèle, couleurs) pour produire le document Word ou PDF. <strong>Aucun nouveau passage par l\'assistant</strong>&nbsp;: il s\'agit seulement de la présentation.</p>' +
    '<button class="b creux" onclick="alert(\'Maquette : ouvrirait l\\\'atelier de mise en forme du CV (Word / PDF).\')">Finaliser et télécharger mon CV</button>' +
    '</div>' +

    '<div class="carte">' +
    '<p class="titreExp">Analyser à nouveau mon CV</p>' +
    '<p class="reco" style="margin-bottom:0.9rem">L\'assistant refait une analyse complète, mais sur votre <strong>CV corrigé</strong> (pas la version d\'origine)&nbsp;: pour voir si les changements ont amélioré votre bilan, et repérer les points qui restent à travailler ou de nouveaux points apparus. Le rapport actuel sera remplacé par ce nouveau résultat.</p>' +
    '<button class="b" onclick="alert(\'Maquette : relancerait le bilan sur le CV corrigé.\')">Analyser à nouveau mon CV</button>' +
    '</div>' +
    '<p class="note-bas">Fin de la maquette. Utilisez la barre du haut pour rejouer un autre scénario.</p>';
}

function brancher() {
  document.querySelectorAll('[data-coche]').forEach(function (cb) {
    cb.addEventListener('change', function () { etat.coche[cb.dataset.coche] = cb.checked; rendre(); });
  });
  var cm = document.getElementById('champMetier');
  if (cm) {
    // Première lettre toujours en majuscule (cohérence du site).
    cm.addEventListener('input', function () {
      var pos = cm.selectionStart;
      var v = cm.value;
      if (v.length) { v = v.charAt(0).toUpperCase() + v.slice(1); }
      if (v !== cm.value) { cm.value = v; try { cm.setSelectionRange(pos, pos); } catch (e) {} }
      etat.metierSaisi = cm.value;
    });
    // Touche Entrée = Continuer, uniquement si du texte a été saisi.
    cm.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && cm.value.trim()) { ev.preventDefault(); validerMetier(true); }
    });
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

document.querySelectorAll('input[name=metier], input[name=chiffres]').forEach(function (r) {
  r.addEventListener('change', rejouer);
});
rejouer();
</script>
